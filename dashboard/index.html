<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>规则集自动化｜运行情况看板</title>
<style>
:root{color-scheme:dark;--panel:#141c30;--muted:#91a0ba;--text:#edf2ff;--line:#26334d;--blue:#82aaff;--green:#65d6a3;--amber:#f4c66a;--red:#ff8585}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:linear-gradient(145deg,#0b1020,#111a2d 55%,#0b1020);color:var(--text);font:13px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{width:min(100%,1400px);margin:auto;padding:12px}.panel{background:rgba(20,28,48,.92);border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:8px 0}.metric{font-size:24px;font-weight:750;letter-spacing:-.5px;margin-top:2px}.label,.muted{color:var(--muted);font-size:11px}.dashboard{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.section{font-size:13px;margin:0 0 5px;font-weight:650}.section-wrap{min-width:0}.barrow{display:grid;grid-template-columns:76px 1fr 42px;gap:7px;align-items:center;margin:7px 0;font-size:11px}.track{height:7px;border-radius:99px;background:#25314a;overflow:hidden}.fill{height:100%;border-radius:99px;background:var(--blue)}.fill.direct{background:#65d6a3}.fill.proxy{background:#82aaff}.fill.reject{background:#f4c66a}.row{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px solid var(--line);font-size:11px}.row:last-child{border:0}.status{font-weight:650;text-align:right}.ok{color:var(--green)}.warn{color:var(--amber)}.bad{color:var(--red)}.note{font-size:10px;color:var(--muted);margin-top:5px}.empty{color:var(--muted);padding:8px 0}.automation{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:8px}.automation .row{display:flex;flex-direction:column;gap:2px;border:0;padding:0}.automation .status{text-align:left}.footer{margin-top:8px;padding-top:5px;border-top:1px solid var(--line);color:var(--muted);font-size:9px;line-height:1.25;overflow-wrap:anywhere}
@media(min-width:1000px){main{padding:16px}.panel{padding:12px}.grid,.dashboard{gap:10px}.dashboard{grid-template-columns:repeat(4,minmax(0,1fr))}.section-wrap{min-height:0}.row{font-size:12px;padding:5px 0}.barrow{font-size:12px;margin:9px 0}.metric{font-size:27px}}
@media(max-width:520px){main{padding:8px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:6px 0}.panel{padding:8px;border-radius:8px}.metric{font-size:21px}.dashboard{gap:6px}.section{font-size:12px;margin-bottom:4px}.row{font-size:10px;padding:3px 0;gap:4px}.barrow{grid-template-columns:65px 1fr 34px;gap:5px;font-size:10px;margin:6px 0}.automation{gap:5px;margin-bottom:6px}.automation .row{font-size:10px}.note{font-size:9px;margin-top:3px}.footer{font-size:8px}}
@media(max-width:350px){.metric{font-size:18px}.label{font-size:10px}.barrow{grid-template-columns:58px 1fr 30px}}
</style>
</head>
<body><main>
<section class="panel automation" id="automation"><div class="empty">正在读取自动化状态…</div></section>
<div class="grid" id="summary"><div class="panel"><div class="label">已发布规则</div><div class="metric">—</div></div><div class="panel"><div class="label">待筛选规则</div><div class="metric">—</div></div><div class="panel"><div class="label">规则来源</div><div class="metric">—</div></div><div class="panel"><div class="label">待人工审核（REJECT）</div><div class="metric">—</div></div></div>
<div class="dashboard">
<section class="section-wrap"><h2 class="section">当前规则数量</h2><div class="panel" id="inventory"><div class="empty">正在读取数据…</div></div></section>
<section class="section-wrap"><h2 class="section">审核情况</h2><div class="panel" id="review"><div class="empty">正在读取数据…</div></div></section>
<section class="section-wrap"><h2 class="section">当前任务进度</h2><div class="panel" id="queue"><div class="empty">正在读取数据…</div></div></section>
<section class="section-wrap"><h2 class="section">规则定期检查</h2><div class="panel" id="lifecycle"><div class="empty">正在读取数据…</div></div></section>
</div>
<div class="footer" id="updated">数据加载中</div>
</main>
<script>
const n=v=>Number.isFinite(Number(v))?Number(v).toLocaleString("zh-CN"):"—";
const el=id=>document.getElementById(id);
const row=(k,v,cls="")=>'<div class="row"><span class="muted">'+k+'</span><span class="status '+cls+'">'+v+'</span></div>';
const fmtTime=v=>{if(!v)return "暂无记录";const d=new Date(v);if(Number.isNaN(d.getTime()))return v;const p=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Shanghai",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"}).formatToParts(d).reduce((a,x)=>(a[x.type]=x.value,a),{});return p.year+"-"+p.month+"-"+p.day+" "+p.hour+":"+p.minute+":"+p.second;};
let lastSuccessfulLoad = null;
async function load(){try{const r=await fetch("./data.json?refresh="+Date.now(),{cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);const d=await r.json();lastSuccessfulLoad=new Date();
const cards=[["已发布规则",n(d.rulesets.published_total)],["待筛选规则",n(d.sources.candidate_count)],["规则来源",n(d.sources.source_count)],["待人工审核（REJECT）",n(d.review.reject_manual_pending), "已通过自动审核，但尚未获得人工授权；不会自动发布。"]];
el("summary").innerHTML=cards.map(x=>'<div class="panel"><div class="label">'+x[0]+'</div><div class="metric">'+x[1]+'</div>'+(x[2]?'<div class="note">'+x[2]+'</div>':'')+'</div>').join("");
const a=d.automation||{};const state=a.workflow_state==="active"?(a.last_run_status==="in_progress"?"监控正在运行":(a.last_run_status==="queued"||a.last_run_status==="waiting")?"监控任务排队中":a.last_run_conclusion==="success"?"已启用，最近检查正常":a.last_run_conclusion?"已启用，最近检查异常":"已启用，暂无运行记录"):(a.workflow_state==="disabled"?"未启用":"状态暂时无法确认");el("automation").innerHTML=row("自动化",a.workflow_state==="active"?"已启用":a.workflow_state==="disabled"?"未启用":"待确认",a.workflow_state==="active"?"ok":"warn")+row("监控状态",state,state.indexOf("正常")>=0||state==="监控正在运行"?"ok":state.indexOf("异常")>=0?"bad":"warn")+row("最近监控",fmtTime(a.last_run_at));
const total=Math.max(1,d.rulesets.published_total||0);let inv="";for(const p of ["DIRECT","PROXY","REJECT"]){const v=d.rulesets.by_policy[p]||0;const label={DIRECT:"直连（DIRECT）",PROXY:"代理（PROXY）",REJECT:"拦截（REJECT）"}[p];inv+='<div class="barrow"><b>'+label+'</b><div class="track"><div class="fill '+p.toLowerCase()+'" style="width:'+Math.min(100,v/total*100)+'%"></div></div><b>'+n(v)+'</b></div>'}inv+=row("最多可发布规则数",n(d.rulesets.max_published)+" 条")+row("已使用容量",d.rulesets.max_published?((d.rulesets.published_total/d.rulesets.max_published)*100).toFixed(1)+"%":"—");el("inventory").innerHTML=inv;
let rev=row("已完成审核",n(d.review.reviewed_total))+row("审核通过",n(d.review.approved_total))+row("暂缓或未通过",n(d.review.held_total))+row("规则设置冲突",n(d.review.policy_conflicts));el("review").innerHTML=rev;
const q=d.queue.by_status||{};const queued=Number(q.QUEUED||0),running=Number(q.CLAIMED||0),verifying=Number(q.VERIFYING||0),active=queued+running+verifying;el("queue").innerHTML=row("当前未完成任务",n(active),active?"warn":"ok")+row("等待处理",n(queued))+row("正在执行",n(running))+row("正在核验",n(verifying),"warn")+'<div class="note">'+(active===0?"当前没有排队、执行或核验中的任务。":"以上为当前尚未完成的任务，按处理阶段实时汇总。")+'</div><div class="note">已结束任务</div>'+row("已完成",n(q.SUCCEEDED||0),"ok")+row("多次失败，已暂停",n(q.DEAD_LETTER||0),"bad");
el("lifecycle").innerHTML=row("当前已发布规则数",n(d.lifecycle.published_rule_count))+row("达到以下规则数量时检查",n(d.lifecycle.next_milestone))+row("最多可发布规则数",n(d.lifecycle.max_published_rules))+row("规则检查安排",d.lifecycle.status==="normal_incremental"?"正常，按新增数量逐步检查":d.lifecycle.status||"暂时无法确认")+row("最近一次检查情况",d.lifecycle.latest_review_status==="not_due"?"尚未达到检查条件":d.lifecycle.latest_review_status||"暂无记录")+row("最近一次检查时间",fmtTime(d.lifecycle.last_successful_review_at));
el("updated").textContent="北京时间｜数据生成："+fmtTime(d.generated_at)+"｜刷新："+fmtTime(lastSuccessfulLoad.toISOString())+"｜数据版本："+(d.source_commit||"未知")+"。";
}catch(e){const status=el("updated");status.textContent="数据更新失败："+e.message+"。暂时保留当前页面内容，稍后会自动重试。";}}
load();
setInterval(load,30000);
</script></body></html>
