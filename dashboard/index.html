<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>规则集自动化｜运行情况看板</title>
<style>
:root{color-scheme:dark;--bg:#090f1d;--panel:#121d31;--panel2:#17243a;--muted:#91a2bd;--text:#edf3ff;--line:#283954;--blue:#8ab4ff;--green:#62d9a2;--amber:#f3c66d;--red:#ff8585}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:radial-gradient(ellipse at 12% 0%,#1a2b49 0,transparent 38%),linear-gradient(145deg,#080e1b,#101a2c 60%,#0a1221);color:var(--text);font:13px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{width:min(100%,1440px);margin:0 auto;padding:14px}
.panel{background:linear-gradient(145deg,rgba(22,34,56,.97),rgba(16,27,46,.97));border:1px solid var(--line);border-radius:12px;min-width:0;padding:12px;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.automation{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;padding:0;margin-bottom:10px;overflow:hidden}
.automation .row{display:flex;flex-direction:column;justify-content:center;gap:4px;padding:9px 13px;border:0;border-right:1px solid var(--line);min-width:0}
.automation .row:last-child{border-right:0}
.automation .muted{font-size:10px;letter-spacing:.2px}
.automation .status{text-align:left;font-size:12px;overflow-wrap:anywhere}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:0 0 10px}
.metric-card{position:relative;overflow:hidden;padding:11px 13px}
.metric-card:after{content:"";position:absolute;right:-22px;top:-28px;width:82px;height:82px;border-radius:50%;background:rgba(138,180,255,.055)}
.label,.muted{color:var(--muted);font-size:11px}
.metric{font-size:clamp(21px,2.1vw,29px);font-weight:760;letter-spacing:-.7px;line-height:1.15;margin-top:5px;font-variant-numeric:tabular-nums}
.note{font-size:10px;color:var(--muted);margin-top:5px;line-height:1.35}
.dashboard{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:start}
.section-wrap{min-width:0}
.section{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin:0 0 6px;padding-left:2px}
.section:before{content:"";width:3px;height:13px;border-radius:3px;background:var(--blue)}
.rows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:6px 0;border-bottom:1px solid rgba(40,57,84,.75);min-width:0}
.row:last-child{border-bottom:0}
.row .muted{min-width:0;overflow-wrap:anywhere}
.status{font-weight:680;text-align:right;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.ok{color:var(--green)}.warn{color:var(--amber)}.bad{color:var(--red)}
.barrow{display:grid;grid-template-columns:112px minmax(30px,1fr) 52px;gap:9px;align-items:center;margin:10px 0;font-size:11px}
.track{height:8px;border-radius:99px;background:#263650;overflow:hidden}
.fill{height:100%;border-radius:99px;background:var(--blue);min-width:0}
.fill.direct{background:var(--green)}.fill.proxy{background:var(--blue)}.fill.reject{background:var(--amber)}
.bar-meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:10px;margin-top:10px}
.footer{margin-top:10px;padding:8px 2px 0;border-top:1px solid var(--line);color:var(--muted);font-size:9px;line-height:1.35;overflow-wrap:anywhere}
.empty{color:var(--muted);padding:8px 0}
@media(min-width:1100px){main{padding:18px}.panel{padding:14px}.automation .row{padding:10px 16px}.dashboard{gap:12px}.grid{gap:12px}.row{padding:7px 0}}
@media(max-width:700px){main{padding:9px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-bottom:8px}.metric-card{padding:9px 10px}.metric{font-size:22px}.dashboard{gap:8px}.panel{padding:9px;border-radius:10px}.automation{margin-bottom:8px}.automation .row{padding:8px 9px}.automation .status{font-size:10px}.automation .muted{font-size:9px}.section{font-size:12px;margin-bottom:5px}.rows{grid-template-columns:1fr}.row{padding:5px 0;gap:5px}.row .muted,.status{font-size:10px}.barrow{grid-template-columns:82px minmax(24px,1fr) 42px;gap:6px;font-size:10px;margin:8px 0}.track{height:7px}.note{font-size:9px}.footer{font-size:8px}}
@media(max-width:390px){.automation .row{padding:7px 6px}.automation .status{font-size:9px}.dashboard{gap:6px}.panel{padding:8px}.section{font-size:11px}.row .muted,.status{font-size:9px}.barrow{grid-template-columns:68px minmax(18px,1fr) 36px;gap:5px;font-size:9px}}
@media(max-width:330px){.dashboard{grid-template-columns:1fr}.grid{gap:6px}.metric{font-size:20px}}
</style>
</head>
<body><main>
<section class="panel automation" id="automation"><div class="empty">正在读取自动化状态…</div></section>
<div class="grid" id="summary">
<div class="panel metric-card"><div class="label">已发布规则</div><div class="metric">—</div></div>
<div class="panel metric-card"><div class="label">待筛选规则</div><div class="metric">—</div></div>
<div class="panel metric-card"><div class="label">规则来源</div><div class="metric">—</div></div>
<div class="panel metric-card"><div class="label">待人工审核（REJECT）</div><div class="metric">—</div></div>
</div>
<div class="dashboard">
<section class="section-wrap"><h2 class="section">规则分布与容量</h2><div class="panel" id="inventory"><div class="empty">正在读取数据…</div></div></section>
<section class="section-wrap"><h2 class="section">审核概况</h2><div class="panel" id="review"><div class="empty">正在读取数据…</div></div></section>
<section class="section-wrap"><h2 class="section">当前任务进度</h2><div class="panel" id="queue"><div class="empty">正在读取数据…</div></div></section>
<section class="section-wrap"><h2 class="section">规则生命周期</h2><div class="panel" id="lifecycle"><div class="empty">正在读取数据…</div></div></section>
</div>
<div class="footer" id="updated">数据加载中</div>
</main>
<script>
const n=v=>Number.isFinite(Number(v))?Number(v).toLocaleString("zh-CN"):"—";
const el=id=>document.getElementById(id);
const row=(k,v,cls="")=>'<div class="row"><span class="muted">'+k+'</span><span class="status '+cls+'">'+v+'</span></div>';
const fmtTime=v=>{if(!v)return "暂无记录";const d=new Date(v);if(Number.isNaN(d.getTime()))return v;const p=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Shanghai",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"}).formatToParts(d).reduce((a,x)=>(a[x.type]=x.value,a),{});return p.year+"-"+p.month+"-"+p.day+" "+p.hour+":"+p.minute+":"+p.second;};
let lastSuccessfulLoad=null;
async function load(){try{
const r=await fetch("./data.json?refresh="+Date.now(),{cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);const d=await r.json();lastSuccessfulLoad=new Date();
const cards=[["已发布规则",n(d.rulesets.published_total)],["候选池总量",n(d.candidate_review.candidate_total), "当前候选记录数，不代表尚未筛选数量"],["规则来源",n(d.sources.source_count)],["待人工审核（REJECT）",n(d.review.reject_manual_pending),"已通过自动审核，但尚未获得人工授权；不会自动发布。"]];
el("summary").innerHTML=cards.map(x=>'<div class="panel metric-card"><div class="label">'+x[0]+'</div><div class="metric">'+x[1]+'</div>'+(x[2]?'<div class="note">'+x[2]+'</div>':'')+'</div>').join("");
const a=d.automation||{};const state=a.workflow_state==="active"?(a.last_run_status==="in_progress"?"监控正在运行":(a.last_run_status==="queued"||a.last_run_status==="waiting")?"监控任务排队中":a.last_run_conclusion==="success"?"已启用，最近检查正常":a.last_run_conclusion?"已启用，最近检查异常":"已启用，暂无运行记录"):(a.workflow_state==="disabled"?"未启用":"状态暂时无法确认");
el("automation").innerHTML=row("自动化",a.workflow_state==="active"?"已启用":a.workflow_state==="disabled"?"未启用":"待确认",a.workflow_state==="active"?"ok":"warn")+row("监控状态",state,state.indexOf("正常")>=0||state==="监控正在运行"?"ok":state.indexOf("异常")>=0?"bad":"warn")+row("最近监控",fmtTime(a.last_run_at));
const total=Math.max(1,Number(d.rulesets.published_total)||0);let inv="";
for(const p of ["DIRECT","PROXY","REJECT"]){const v=Number(d.rulesets.by_policy[p]||0);const label={DIRECT:"直连 DIRECT",PROXY:"代理 PROXY",REJECT:"拦截 REJECT"}[p];inv+='<div class="barrow"><b>'+label+'</b><div class="track"><div class="fill '+p.toLowerCase()+'" style="width:'+Math.min(100,v/total*100)+'%"></div></div><b class="status">'+n(v)+'</b></div>'}
inv+='<div class="rows">'+row("发布容量上限",n(d.rulesets.max_published)+" 条")+row("当前容量占用",d.rulesets.max_published?((d.rulesets.published_total/d.rulesets.max_published)*100).toFixed(1)+"%":"—")+'</div>';
el("inventory").innerHTML=inv;
const cr=d.candidate_review||{},sc=cr.status_counts||{};const recorded=Number(cr.history_recorded)||0,missing=Number(cr.missing_history)||0,approved=Number(sc.APPROVED)||0;const pass=recorded?Math.min(100,approved/recorded*100):0;
const statusRows=["REVIEW","CONFLICT","POLICY_CONFLICT","RISK_HOLD","ALREADY_COVERED","APPROVED","UNREVIEWED"].map(k=>row(({REVIEW:"待进一步审核",CONFLICT:"配置冲突",POLICY_CONFLICT:"策略冲突",RISK_HOLD:"风险隔离",ALREADY_COVERED:"配置已覆盖",APPROVED:"自动审核通过",UNREVIEWED:"没有审核记录"})[k],n(sc[k]||0),k==="APPROVED"?"ok":k==="UNREVIEWED"?"warn":""));
el("review").innerHTML='<div class="bar-meta"><span>当前候选池审核记录覆盖率</span><b>'+(Number(cr.candidate_total)?(recorded/Number(cr.candidate_total)*100).toFixed(1):"0.0")+'%</b></div><div class="track"><div class="fill" style="width:'+(Number(cr.candidate_total)?Math.min(100,recorded/Number(cr.candidate_total)*100):0)+'%"></div></div><div class="rows">'+row("当前候选池",n(cr.candidate_total))+row("已有历史审核记录",n(recorded))+row("尚无审核记录",n(missing),missing?"warn":"ok")+row("审核账本记录总量",n(cr.review_ledger_total))+row("审核游标状态",cr.cursor_status||"未知")+row("游标候选数",n(cr.cursor_candidate_count))+'</div><div class="rows">'+statusRows.join("")+'</div><div class="note">按当前候选域名与审核账本匹配；历史记录不等于当前证据指纹已复核。数据变化后须由确定性审核程序重新判定。</div>';
const q=d.queue.by_status||{};const queued=Number(q.QUEUED||0),running=Number(q.CLAIMED||0),verifying=Number(q.VERIFYING||0),active=queued+running+verifying;
el("queue").innerHTML='<div class="rows">'+row("未完成任务",n(active),active?"warn":"ok")+row("等待处理",n(queued))+row("正在执行",n(running))+row("正在核验",n(verifying),"warn")+row("已完成",n(q.SUCCEEDED||0),"ok")+row("多次失败，已暂停",n(q.DEAD_LETTER||0),"bad")+'</div>';
const published=Number(d.lifecycle.published_rule_count)||0,milestone=Number(d.lifecycle.next_milestone)||0;const progress=milestone?Math.min(100,published/milestone*100):0;
el("lifecycle").innerHTML='<div class="bar-meta"><span>距离下一次检查节点</span><b>'+progress.toFixed(1)+'%</b></div><div class="track"><div class="fill" style="width:'+progress+'%"></div></div><div class="rows">'+row("当前已发布规则数",n(published))+row("下次检查节点",n(milestone))+row("发布容量上限",n(d.lifecycle.max_published_rules))+row("检查安排",d.lifecycle.status==="normal_incremental"?"按新增数量逐步检查":d.lifecycle.status||"暂时无法确认")+row("最近检查情况",d.lifecycle.latest_review_status==="not_due"?"尚未达到检查条件":d.lifecycle.latest_review_status||"暂无记录")+row("最近检查时间",fmtTime(d.lifecycle.last_successful_review_at))+'</div>';
el("updated").textContent="北京时间｜数据生成："+fmtTime(d.generated_at)+"｜页面刷新："+fmtTime(lastSuccessfulLoad.toISOString())+"｜数据版本："+(d.source_commit||"未知")+"。";
}catch(e){el("updated").textContent="数据更新失败："+e.message+"。暂时保留当前页面内容，稍后会自动重试。";}}
load();setInterval(load,30000);
</script></body></html>
