<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>规则集自动化｜运行情况看板</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#141c30;--muted:#91a0ba;--text:#edf2ff;--line:#26334d;--blue:#82aaff;--green:#65d6a3;--amber:#f4c66a;--red:#ff8585}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#0b1020,#111a2d 55%,#0b1020);color:var(--text);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:1240px;margin:auto;padding:28px 20px 60px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap}h1{font-size:26px;margin:0 0 6px}.sub,.muted{color:var(--muted)}.pill{border:1px solid #315d54;color:var(--green);padding:6px 11px;border-radius:99px;font-size:12px;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:22px 0}.panel{background:rgba(20,28,48,.92);border:1px solid var(--line);border-radius:15px;padding:18px;min-width:0}.metric{font-size:28px;font-weight:700;letter-spacing:-.5px;margin-top:6px}.label{color:var(--muted);font-size:13px}.section{font-size:17px;margin:26px 0 12px}.split{display:grid;grid-template-columns:1.1fr .9fr;gap:14px}.barrow{display:grid;grid-template-columns:80px 1fr 68px;gap:10px;align-items:center;margin:14px 0}.track{height:10px;border-radius:99px;background:#25314a;overflow:hidden}.fill{height:100%;border-radius:99px;background:var(--blue)}.fill.direct{background:#65d6a3}.fill.proxy{background:#82aaff}.fill.reject{background:#f4c66a}.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.status{font-weight:650}.ok{color:var(--green)}.warn{color:var(--amber)}.bad{color:var(--red)}.note{font-size:12px;color:var(--muted);margin-top:16px}.empty{color:var(--muted);padding:14px 0}.footer{border-top:1px solid var(--line);margin-top:28px;padding-top:16px;color:var(--muted);font-size:12px}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:1fr}}@media(max-width:480px){main{padding:20px 14px 40px}.grid{gap:9px}.panel{padding:14px}.metric{font-size:24px}h1{font-size:22px}}
</style>
</head>
<body><main>
<header class="top"><div><h1>规则集自动化 · 运行情况看板</h1><div class="sub">只查看运行情况｜数据来自已保存的运行记录</div></div><span class="pill">只读页面 · 不能操作生产任务</span></header>
<section class="panel" id="automation"><div class="empty">正在读取自动化状态…</div></section>
<div class="grid" id="summary"><div class="panel"><div class="label">已发布规则</div><div class="metric">—</div></div><div class="panel"><div class="label">候选规则</div><div class="metric">—</div></div><div class="panel"><div class="label">规则来源</div><div class="metric">—</div></div></div>
<h2 class="section">当前规则数量</h2><div class="panel" id="inventory"><div class="empty">正在读取数据…</div></div>
<div class="split"><section><h2 class="section">审核情况</h2><div class="panel" id="review"><div class="empty">正在读取数据…</div></div></section><section><h2 class="section">生产运行情况</h2><div class="panel" id="production"><div class="empty">正在读取数据…</div></div></section></div>
<div class="split"><section><h2 class="section">任务处理进度</h2><div class="panel" id="queue"><div class="empty">正在读取数据…</div></div></section><section><h2 class="section">规则定期检查</h2><div class="panel" id="lifecycle"><div class="empty">正在读取数据…</div></div></section></div>
<div class="footer" id="updated">数据加载中</div>
</main>
<script>
const n=v=>Number.isFinite(Number(v))?Number(v).toLocaleString("zh-CN"):"—";
const el=id=>document.getElementById(id);
const row=(k,v,cls="")=>'<div class="row"><span class="muted">'+k+'</span><span class="status '+cls+'">'+v+'</span></div>';
const fmtTime=v=>{if(!v)return "暂无记录";const d=new Date(v);if(Number.isNaN(d.getTime()))return v;const p=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Shanghai",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"}).formatToParts(d).reduce((a,x)=>(a[x.type]=x.value,a),{});return p.year+"-"+p.month+"-"+p.day+" "+p.hour+":"+p.minute+":"+p.second;};
let lastSuccessfulLoad = null;
async function load(){try{const r=await fetch("./data.json?refresh="+Date.now(),{cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);const d=await r.json();lastSuccessfulLoad=new Date();
const cards=[["已发布规则",n(d.rulesets.published_total)],["待筛选规则",n(d.sources.candidate_count)],["规则来源",n(d.sources.source_count)]];
el("summary").innerHTML=cards.map(x=>'<div class="panel"><div class="label">'+x[0]+'</div><div class="metric">'+x[1]+'</div></div>').join("");
const a=d.automation||{};const state=a.workflow_state==="active"?(a.last_run_status==="in_progress"?"监控正在运行":(a.last_run_status==="queued"||a.last_run_status==="waiting")?"监控任务排队中":a.last_run_conclusion==="success"?"已启用，最近检查正常":a.last_run_conclusion?"已启用，最近检查异常":"已启用，暂无运行记录"):(a.workflow_state==="disabled"?"未启用":"状态暂时无法确认");el("automation").innerHTML=row("自动化系统",a.workflow_state==="active"?"已启用":a.workflow_state==="disabled"?"未启用":"状态暂时无法确认",a.workflow_state==="active"?"ok":"warn")+row("最近监控状态",state,state.indexOf("正常")>=0||state==="监控正在运行"?"ok":state.indexOf("异常")>=0?"bad":"warn")+row("最近监控时间",fmtTime(a.last_run_at))+row("当前生产任务",d.production.active>0?"有任务正在处理或等待检查":"当前没有生产任务运行",d.production.active>0?"warn":"")+'<div class="note">自动化监控按计划定时检查；生产任务只有在达到生产条件时才会启动。任务处理进度不代表整个系统是否启用。看板本身不能启动任务。</div>';
const total=Math.max(1,d.rulesets.published_total||0);let inv="";for(const p of ["DIRECT","PROXY","REJECT"]){const v=d.rulesets.by_policy[p]||0;const label={DIRECT:"直连（DIRECT）",PROXY:"代理（PROXY）",REJECT:"拦截（REJECT）"}[p];inv+='<div class="barrow"><b>'+label+'</b><div class="track"><div class="fill '+p.toLowerCase()+'" style="width:'+Math.min(100,v/total*100)+'%"></div></div><b>'+n(v)+'</b></div>'}inv+=row("最多可发布规则数",n(d.rulesets.max_published)+" 条")+row("已使用容量",d.rulesets.max_published?((d.rulesets.published_total/d.rulesets.max_published)*100).toFixed(1)+"%":"—");el("inventory").innerHTML=inv;
let rev=row("已完成审核",n(d.review.reviewed_total))+row("审核通过",n(d.review.approved_total))+row("暂缓或未通过",n(d.review.held_total))+row("规则设置冲突",n(d.review.policy_conflicts))+row("拦截规则需要人工确认",d.review.reject_manual_approval_required?"是":"否")+row("已人工确认的拦截规则",n(d.review.reject_manual_approved));el("review").innerHTML=rev;
const p=d.production;el("production").innerHTML=row("生产任务总数",n(p.total_tasks))+row("已完成并检查通过",n(p.succeeded),"ok")+row("正在执行或等待检查",n(p.active),"warn")+row("失败或已暂停",n(p.dead_letter),"bad")+row("最近一次成功完成时间",fmtTime(p.last_success_verified_at))+row("预计下次生产时间",p.next_expected_at?fmtTime(p.next_expected_at):"暂无可核实的预计时间")+ '<div class="note">生产通常每 8 天进行一次；只有记录完整时才显示预计时间。</div>';
el("queue").innerHTML=row("任务总数",n(d.queue.total))+row("等待处理",n(d.queue.by_status.QUEUED||0))+row("正在处理",n(d.queue.by_status.CLAIMED||0))+row("正在检查结果",n(d.queue.by_status.VERIFYING||0),"warn")+row("处理成功",n(d.queue.by_status.SUCCEEDED||0),"ok")+row("多次处理失败，已暂停",n(d.queue.by_status.DEAD_LETTER||0),"bad")+'<div class="note">这里统计的是系统任务处理到哪一步，不是规则数量，也不能单独用来判断自动化是否启动。</div>';
el("lifecycle").innerHTML=row("当前已发布规则数",n(d.lifecycle.published_rule_count))+row("达到以下规则数量时检查",n(d.lifecycle.next_milestone))+row("最多可发布规则数",n(d.lifecycle.max_published_rules))+row("规则检查安排",d.lifecycle.status==="normal_incremental"?"正常，按新增数量逐步检查":d.lifecycle.status||"暂时无法确认")+row("最近一次检查情况",d.lifecycle.latest_review_status==="not_due"?"尚未达到检查条件":d.lifecycle.latest_review_status||"暂无记录")+row("最近一次检查时间",fmtTime(d.lifecycle.last_successful_review_at));
el("updated").textContent="所有时间均为北京时间（GMT+8）｜数据生成："+fmtTime(d.generated_at)+"｜页面刷新："+fmtTime(lastSuccessfulLoad.toISOString())+"｜数据版本："+(d.source_commit||"未知")+"。本页面只展示汇总信息，不能启动生产、部署或修改配置。由于历史记录尚不完整，暂不展示历史抓取、归档和规则删除/恢复的累计数量。";
}catch(e){const status=el("updated");status.textContent="数据更新失败："+e.message+"。暂时保留当前页面内容，稍后会自动重试。";}}
load();
setInterval(load,30000);
</script></body></html>
