<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>规则集自动化｜运行情况看板</title>
<style>
:root{color-scheme:dark;--bg:#0a1220;--panel:#111d30;--line:#263953;--text:#edf3ff;--muted:#9aabc4;--blue:#8ab4ff;--green:#62d9a2;--amber:#f3c66d;--red:#ff6675;--gap:9px;--radius:10px;--font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:linear-gradient(145deg,#09111f,#101c2e 58%,#0a1424);color:var(--text);font-family:var(--font);font-size:12px;line-height:1.35;font-synthesis:none}
main{width:100%;max-width:1680px;min-height:100vh;margin:0 auto;padding:10px;display:flex;flex-direction:column;gap:var(--gap)}
.panel{min-width:0;height:100%;padding:10px 12px;background:linear-gradient(145deg,rgba(22,35,57,.98),rgba(15,27,45,.98));border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 4px 14px rgba(0,0,0,.12)}
.automation{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;padding:0;margin:0;overflow:hidden}
.automation .row{display:flex;flex-direction:column;justify-content:center;gap:3px;padding:8px 12px;border:0;border-right:1px solid var(--line);min-width:0}.automation .row:last-child{border-right:0}
.automation .muted,.automation .label{font-size:10px}.automation .status{text-align:left;font-size:12px;overflow-wrap:anywhere}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--gap);margin:0}
.metric-card{position:relative;overflow:hidden;padding:10px 13px}.metric-card:nth-child(4) .metric{color:var(--red)}.metric-card:after{content:"";position:absolute;right:-20px;top:-25px;width:74px;height:74px;border-radius:50%;background:rgba(138,180,255,.05);pointer-events:none}
.label,.muted{color:var(--muted);font-size:10px}.metric{font-size:clamp(20px,2vw,27px);font-weight:750;letter-spacing:-.45px;line-height:1.15;margin-top:4px;font-variant-numeric:tabular-nums}
.note{font-size:9px;color:var(--muted);margin-top:4px;line-height:1.3}
.dashboard{display:grid;grid-template-columns:minmax(0,1.02fr) minmax(0,.98fr);grid-template-rows:minmax(0,1.06fr) minmax(0,.94fr);gap:var(--gap);align-items:stretch;flex:1;min-height:0}
.section-wrap{display:flex;flex-direction:column;min-width:0;min-height:0}.section{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;line-height:1.2;margin:0 0 5px;padding:0 2px}.section:before{content:"";width:3px;height:12px;flex:0 0 3px;border-radius:3px;background:var(--blue)}.section-wrap>.panel{flex:1}
.rows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:7px;padding:5px 0;border-bottom:1px solid rgba(40,57,84,.65);min-width:0}.row:last-child{border-bottom:0}.row .muted{min-width:0;overflow-wrap:anywhere}
.status{font-weight:680;text-align:right;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}.ok{color:var(--green)}.warn{color:var(--amber)}.bad{color:var(--red)}
.barrow{display:grid;grid-template-columns:116px minmax(24px,1fr) 54px;gap:9px;align-items:center;margin:10px 0;font-size:11px}.barrow b:first-child{font-weight:700;letter-spacing:.1px}.direct-text{color:var(--green)}.proxy-text{color:var(--blue)}.reject-text{color:var(--red)}
.track{height:7px;border-radius:99px;background:#263650;overflow:hidden}.fill{height:100%;border-radius:99px;background:var(--blue);min-width:0}.fill.direct{background:var(--green)}.fill.proxy{background:var(--blue)}.fill.reject{background:var(--red)}
.review-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px}.review-stat{min-width:0;padding:7px 8px;border:1px solid rgba(40,57,84,.8);border-radius:8px;background:rgba(10,18,33,.25)}.review-stat .label{font-size:9px;line-height:1.2}.review-stat .value{font-size:17px;font-weight:750;line-height:1.15;margin-top:4px;font-variant-numeric:tabular-nums}
.review-stat.warn .value{color:var(--amber)}.review-stat.bad .value{color:var(--red)}.review-stat.ok .value{color:var(--green)}
.review-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:5px;color:var(--muted);font-size:9px}.review-head b{color:var(--text);font-size:12px;font-variant-numeric:tabular-nums}
.bar-meta{display:flex;justify-content:space-between;gap:7px;color:var(--muted);font-size:9px;margin-top:7px}
.footer{margin-top:auto;padding:6px 2px 0;border-top:1px solid var(--line);color:var(--muted);font-size:8px;line-height:1.3;overflow-wrap:anywhere}.empty{color:var(--muted);padding:8px 0}
@media(min-width:1100px){main{padding:12px;gap:10px}.dashboard{gap:10px}.panel{padding:12px 15px}.automation .row{padding:9px 14px}.row{padding:6px 0}.barrow{grid-template-columns:132px minmax(24px,1fr) 62px;font-size:12px;margin:11px 0}}
@media(max-width:700px){:root{--gap:6px}main{padding:6px;gap:6px}.panel{padding:8px;border-radius:8px}.automation .row{padding:7px 8px;gap:2px}.automation .muted,.automation .label{font-size:9px}.automation .status{font-size:10px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.metric-card{padding:8px 9px}.metric{font-size:20px}.dashboard{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:auto;gap:6px}.section{font-size:11px;margin-bottom:4px}.rows{grid-template-columns:repeat(2,minmax(0,1fr));gap:0 7px}.row{padding:4px 0;gap:4px}.row .muted,.status{font-size:9px;line-height:1.25}.barrow{grid-template-columns:76px minmax(14px,1fr) 38px;gap:5px;font-size:9px;margin:7px 0}.track{height:6px}.review-stats{gap:4px;margin-top:6px}.review-stat{padding:6px 5px}.review-stat .label{font-size:8px}.review-stat .value{font-size:14px;margin-top:3px}.review-head{font-size:8px}.review-head b{font-size:11px}.bar-meta{font-size:8px;gap:4px;margin-top:5px}.note{font-size:8px}.footer{font-size:8px}}
@media(max-width:360px){.dashboard{grid-template-columns:1fr}.rows{grid-template-columns:repeat(2,minmax(0,1fr))}.metric{font-size:18px}.review-stat .label{font-size:7px}.review-stat .value{font-size:13px}}
</style>
</head>
<body><main>
<section class="panel automation" id="automation"><div class="empty">正在读取自动化状态…</div></section>
<div class="grid" id="summary">
<div class="panel metric-card"><div class="label">已发布规则</div><div class="metric">—</div></div>
<div class="panel metric-card"><div class="label">待筛选规则</div><div class="metric">—</div></div>
<div class="panel metric-card"><div class="label">规则来源</div><div class="metric">—</div></div>
<div class="panel metric-card"><div class="label">待人工审核（REJECT）</div><div class="metric">—</div></div>
</div>
<div class="dashboard">
<section class="section-wrap"><h2 class="section">规则分布与容量</h2><div class="panel" id="inventory"><div class="empty">正在读取数据…</div></div></section>
<section class="section-wrap"><h2 class="section">审核概况</h2><div class="panel" id="review"><div class="empty">正在读取数据…</div></div></section>
<section class="section-wrap"><h2 class="section">当前任务进度</h2><div class="panel" id="queue"><div class="empty">正在读取数据…</div></div></section>
<section class="section-wrap"><h2 class="section">规则生命周期</h2><div class="panel" id="lifecycle"><div class="empty">正在读取数据…</div></div></section>
</div>
<div class="footer" id="updated">数据加载中</div>
</main>
<script>
const n=v=>Number.isFinite(Number(v))?Number(v).toLocaleString("zh-CN"):"—";
const el=id=>document.getElementById(id);
const row=(k,v,cls="")=>'<div class="row"><span class="muted">'+k+'</span><span class="status '+cls+'">'+v+'</span></div>';
const fmtTime=v=>{if(!v)return "暂无记录";const d=new Date(v);if(Number.isNaN(d.getTime()))return v;const p=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Shanghai",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"}).formatToParts(d).reduce((a,x)=>(a[x.type]=x.value,a),{});return p.year+"-"+p.month+"-"+p.day+" "+p.hour+":"+p.minute+":"+p.second;};
let lastSuccessfulLoad=null;
async function load(){try{
const r=await fetch("./data.json?refresh="+Date.now(),{cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);const d=await r.json();lastSuccessfulLoad=new Date();
const cards=[["已发布规则",n(d.rulesets.published_total)],["候选池总量",n(d.candidate_review.candidate_total), "当前候选记录数，不代表尚未筛选数量"],["规则来源",n(d.sources.source_count)],["待人工审核（REJECT）",n(d.review.reject_manual_pending),"已通过自动审核，但尚未获得人工授权；不会自动发布。"]];
el("summary").innerHTML=cards.map(x=>'<div class="panel metric-card"><div class="label">'+x[0]+'</div><div class="metric">'+x[1]+'</div>'+(x[2]?'<div class="note">'+x[2]+'</div>':'')+'</div>').join("");
const a=d.automation||{};const state=a.workflow_state==="active"?(a.last_run_status==="in_progress"?"监控正在运行":(a.last_run_status==="queued"||a.last_run_status==="waiting")?"监控任务排队中":a.last_run_conclusion==="success"?"已启用，最近检查正常":a.last_run_conclusion?"已启用，最近检查异常":"已启用，暂无运行记录"):(a.workflow_state==="disabled"?"未启用":"状态暂时无法确认");
el("automation").innerHTML=row("自动化",a.workflow_state==="active"?"已启用":a.workflow_state==="disabled"?"未启用":"待确认",a.workflow_state==="active"?"ok":"warn")+row("监控状态",state,state.indexOf("正常")>=0||state==="监控正在运行"?"ok":state.indexOf("异常")>=0?"bad":"warn")+row("最近监控",fmtTime(a.last_run_at));
const total=Math.max(1,Number(d.rulesets.published_total)||0);let inv="";
for(const p of ["DIRECT","PROXY","REJECT"]){const v=Number(d.rulesets.by_policy[p]||0);const label={DIRECT:"直连 DIRECT",PROXY:"代理 PROXY",REJECT:"拦截 REJECT"}[p];inv+='<div class="barrow"><b class="'+p.toLowerCase()+'-text">'+label+'</b><div class="track"><div class="fill '+p.toLowerCase()+'" style="width:'+Math.min(100,v/total*100)+'%"></div></div><b class="status '+p.toLowerCase()+'-text">'+n(v)+'</b></div>'}
inv+='<div class="rows">'+row("发布容量上限",n(d.rulesets.max_published)+" 条")+row("当前容量占用",d.rulesets.max_published?((d.rulesets.published_total/d.rulesets.max_published)*100).toFixed(1)+"%":"—")+'</div>';
el("inventory").innerHTML=inv;
const cr=d.candidate_review||{},sc=cr.status_counts||{};
const candidateTotal=Number(cr.candidate_total)||0,recorded=Number(cr.history_recorded)||0,missing=Number(cr.missing_history)||0;
const coverage=candidateTotal?Math.min(100,recorded/candidateTotal*100):0;
const reviewStats=[
["无审核记录",missing,missing?"warn":"ok"],
["待进一步审核",Number(sc.REVIEW)||0,(Number(sc.REVIEW)||0)?"warn":""],
["配置/策略冲突",(Number(sc.CONFLICT)||0)+(Number(sc.POLICY_CONFLICT)||0),(Number(sc.CONFLICT)||0)+(Number(sc.POLICY_CONFLICT)||0)?"bad":""],
["风险隔离",Number(sc.RISK_HOLD)||0,(Number(sc.RISK_HOLD)||0)?"bad":""],
["自动审核通过",Number(sc.APPROVED)||0,"ok"],
["配置已覆盖",Number(sc.ALREADY_COVERED)||0,""]
];
el("review").innerHTML='<div class="review-head"><span>审核记录覆盖率</span><b>'+coverage.toFixed(1)+'%</b></div><div class="track" style="margin-top:6px"><div class="fill" style="width:'+coverage+'%"></div></div><div class="bar-meta"><span>候选池 '+n(candidateTotal)+'</span><span>已有记录 '+n(recorded)+' / 无记录 '+n(missing)+'</span></div><div class="review-stats">'+reviewStats.map(([label,value,cls])=>'<div class="review-stat '+cls+'"><div class="label">'+label+'</div><div class="value">'+n(value)+'</div></div>').join("")+'</div><div class="note">覆盖率表示候选域名匹配到历史审核记录，不代表当前证据已重新审核；数据变化后由审核程序重新判定。</div>';
const q=d.queue.by_status||{};const queued=Number(q.QUEUED||0),running=Number(q.CLAIMED||0),verifying=Number(q.VERIFYING||0),active=queued+running+verifying;
el("queue").innerHTML='<div class="rows">'+row("未完成任务",n(active),active?"warn":"ok")+row("等待处理",n(queued))+row("正在执行",n(running))+row("正在核验",n(verifying),"warn")+row("已完成",n(q.SUCCEEDED||0),"ok")+row("多次失败，已暂停",n(q.DEAD_LETTER||0),"bad")+'</div>';
const published=Number(d.lifecycle.published_rule_count)||0,milestone=Number(d.lifecycle.next_milestone)||0;const progress=milestone?Math.min(100,published/milestone*100):0;
el("lifecycle").innerHTML='<div class="bar-meta"><span>距离下一次检查节点</span><b>'+progress.toFixed(1)+'%</b></div><div class="track"><div class="fill" style="width:'+progress+'%"></div></div><div class="rows">'+row("当前已发布规则数",n(published))+row("下次检查节点",n(milestone))+row("发布容量上限",n(d.lifecycle.max_published_rules))+row("检查安排",d.lifecycle.status==="normal_incremental"?"按新增数量逐步检查":d.lifecycle.status||"暂时无法确认")+row("最近检查情况",d.lifecycle.latest_review_status==="not_due"?"尚未达到检查条件":d.lifecycle.latest_review_status||"暂无记录")+row("最近检查时间",fmtTime(d.lifecycle.last_successful_review_at))+'</div>';
el("updated").textContent="北京时间｜数据生成："+fmtTime(d.generated_at)+"｜页面刷新："+fmtTime(lastSuccessfulLoad.toISOString())+"｜数据版本："+(d.source_commit||"未知")+"。";
}catch(e){el("updated").textContent="数据更新失败："+e.message+"。暂时保留当前页面内容，稍后会自动重试。";}}
load();setInterval(load,30000);
</script></body></html>
