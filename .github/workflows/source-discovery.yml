name: Shadowrocket Source Discovery (Watchdog)
run-name: Source discovery ${{ inputs.automation_task_id || 'untrusted-manual' }}

on:
  workflow_dispatch:
    inputs:
      automation_task_id:
        description: Watchdog durable task correlation ID
        required: true
        type: string
      resource_lease_proof:
        description: Watchdog-issued exclusive resource lease proof
        required: true
        type: string

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: shadowrocket-source-discovery-writer
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: scripts
    steps:
      - name: Checkout current main without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Export durable queue snapshot from Issue state
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 scripts/remote_task_queue_runtime.py --repository "$GITHUB_REPOSITORY" --branch main snapshot --output "$RUNNER_TEMP/task_queue.json"
          echo "AUTOMATION_QUEUE_SNAPSHOT=$RUNNER_TEMP/task_queue.json" >> "$GITHUB_ENV"

      - name: Verify exact Watchdog dispatch and install live resource fence
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AUTOMATION_TASK_CORRELATION: ${{ inputs.automation_task_id }}
          RESOURCE_LEASE_PROOF: ${{ inputs.resource_lease_proof }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re
          from datetime import datetime, timezone
          from pathlib import Path
          correlation = os.environ["AUTOMATION_TASK_CORRELATION"]
          match = re.fullmatch(r"(task_[0-9a-f]{24})-a([1-9][0-9]*)", correlation)
          if not match:
              raise SystemExit("A valid Watchdog task correlation is required.")
          task_id, attempt_text = match.groups()
          queue = json.loads(Path(os.environ["AUTOMATION_QUEUE_SNAPSHOT"]).read_text(encoding="utf-8"))
          task = next((x for x in queue.get("tasks", []) if isinstance(x, dict) and x.get("task_id") == task_id), None)
          if not isinstance(task, dict):
              raise SystemExit("The Watchdog discovery task is absent from the durable queue.")
          intent = task.get("dispatch_intent")
          if (task.get("target_program_id") != "workflow_source_discovery"
                  or task.get("requester_program_id") != "workflow_automation_watchdog"
                  or task.get("attempts") != int(attempt_text)
                  or not isinstance(intent, dict)
                  or intent.get("task_id") != task_id
                  or intent.get("dispatch_attempt") != int(attempt_text)
                  or intent.get("correlation_id") != correlation
                  or intent.get("workflow_path") != ".github/workflows/source-discovery.yml"
                  or intent.get("ref") != "main"):
              raise SystemExit("The durable task does not authorize this exact discovery workflow run.")
          try:
              proof = json.loads(os.environ["RESOURCE_LEASE_PROOF"])
          except json.JSONDecodeError as exc:
              raise SystemExit("The resource lease proof is invalid JSON.") from exc
          lease = task.get("resource_lease")
          declared = lease.get("resources") if isinstance(lease, dict) else None
          if not isinstance(declared, dict) or lease.get("status") != "ACTIVE" or proof != declared:
              raise SystemExit("The resource proof does not match the task's active exclusive leases.")
          queue_leases = queue.get("resource_leases")
          if not isinstance(queue_leases, dict):
              raise SystemExit("The durable resource lease registry is missing.")
          workers = set()
          now = datetime.now(timezone.utc)
          for key, item in proof.items():
              record = queue_leases.get(key)
              if (not isinstance(record, dict) or record.get("status") != "ACTIVE"
                      or record.get("task_id") != task_id
                      or record.get("lease_id") != item.get("lease_id")
                      or record.get("fencing_token") != item.get("fencing_token")):
                  raise SystemExit("A discovery resource lease is stale or fenced: " + key)
              expiry = datetime.fromisoformat(record["expires_at"].replace("Z", "+00:00"))
              if expiry <= now:
                  raise SystemExit("A discovery resource lease has expired: " + key)
              workers.add(record.get("worker_id"))
          if len(workers) != 1 or not next(iter(workers)):
              raise SystemExit("Discovery resources do not share one durable worker owner.")
          worker_id = next(iter(workers))
          env_values = {
              "AUTOMATION_TASK_ID": task_id,
              "AUTOMATION_TASK_ID_BASE": task_id,
              "AUTOMATION_WORKER_ID": worker_id,
              "AUTOMATION_TASK_LEASE_TOKEN": "resource-fence-only",
              "AUTOMATION_QUEUE_REPOSITORY": os.environ["GITHUB_REPOSITORY"],
              "AUTOMATION_QUEUE_BRANCH": "main",
              "AUTOMATION_QUEUE_PATH": "automation/task_queue.json",
              "AUTOMATION_QUEUE_TOKEN": os.environ["GH_TOKEN"],
              "AUTOMATION_QUEUE_SNAPSHOT": os.environ["AUTOMATION_QUEUE_SNAPSHOT"],
          }
          delimiter = "__SOURCE_DISCOVERY_RESOURCE_PROOF__"
          if delimiter in os.environ["RESOURCE_LEASE_PROOF"]:
              raise SystemExit("Invalid resource proof delimiter.")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as stream:
              for key, value in env_values.items():
                  stream.write(f"{key}={value}\n")
              stream.write(f"AUTOMATION_RESOURCE_LEASE_PROOF<<{delimiter}\n{os.environ['RESOURCE_LEASE_PROOF']}\n{delimiter}\n")
          PY
          canonical_task_id="${AUTOMATION_TASK_CORRELATION%%-a*}"
          printf '%s' "$GH_TOKEN" | python3 scripts/resource_lease_runtime.py --repository "$GITHUB_REPOSITORY" --branch main --token-stdin assert-workflow --task-id "$canonical_task_id" --proof-json "$RESOURCE_LEASE_PROOF"

      - name: Seed isolated discovery workspace from read-only main baseline
        env:
          AUTOMATION_ARTIFACT_ROOT: ${{ runner.temp }}/source-discovery-workspace
        run: |
          set -euo pipefail
          mkdir -p "$AUTOMATION_ARTIFACT_ROOT/sources" "$AUTOMATION_ARTIFACT_ROOT/reports"
          cp -a sources/discovered_sources.json* "$AUTOMATION_ARTIFACT_ROOT/sources/" 2>/dev/null || true
          if [ -f reports/source-discovery.md ]; then cp reports/source-discovery.md "$AUTOMATION_ARTIFACT_ROOT/reports/"; fi

      - name: Discover candidates without activating sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AUTOMATION_TASK_PROCESS: "1"
          AUTOMATION_ARTIFACT_ROOT: ${{ runner.temp }}/source-discovery-workspace
        run: python3 scripts/discover_sources.py

      - name: Verify producer identity and prepare immutable artifact proof
        env:
          AUTOMATION_ARTIFACT_ROOT: ${{ runner.temp }}/source-discovery-workspace
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from json_document_store import read_document
          from task_scheduler import read_only_resource_digests
          workspace = Path(os.environ["AUTOMATION_ARTIFACT_ROOT"])
          expected = {
              "workflow_name": "Shadowrocket Source Discovery (Watchdog)",
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_head_sha": os.environ["GITHUB_SHA"],
          }
          artifact_root = Path(os.environ["RUNNER_TEMP"], "source-discovery-artifact")
          (artifact_root / "sources").mkdir(parents=True, exist_ok=True)
          import shutil
          for item in (workspace / "sources").glob("discovered_sources.json*"):
              if item.is_dir():
                  shutil.copytree(item, artifact_root / "sources" / item.name, dirs_exist_ok=True)
              else:
                  shutil.copy2(item, artifact_root / "sources" / item.name)
          shutil.copy2(workspace / "reports/source-discovery.md", artifact_root / "reports-source-discovery.md")
          # Artifact proof revision 2: bind the digest to the copied upload tree.
          # Hash the exact files that will be uploaded, not the pre-copy workspace.
          artifact_document = read_document(artifact_root / "sources/discovered_sources.json", "candidates", {"candidates": []})
          if artifact_document.get("producer") != expected:
              raise SystemExit("Discovery artifact producer identity does not match this workflow run.")
          digest = read_only_resource_digests(artifact_root, ["sources/discovered_sources.json"])["sources/discovered_sources.json"]
          if not isinstance(digest, str) or len(digest) != 64:
              raise SystemExit("Discovery artifact logical-document digest is unavailable.")
          proof = {**expected, "artifact_path": "sources/discovered_sources.json", "artifact_sha256": digest}
          (artifact_root / "source-discovery-proof.json").write_text(
              json.dumps(proof, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          PY

      - name: Confirm discovery outputs remain runner-local
        run: |
          set -euo pipefail
          git diff --quiet "$GITHUB_SHA" -- modules/uu.conf
          echo "Discovery outputs remain in the runner workspace and are published only as an immutable Actions artifact."
      
      - name: Upload immutable discovery artifact and provenance proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-discovery-output
          path: ${{ runner.temp }}/source-discovery-artifact/
          if-no-files-found: error
          retention-days: 14

      - name: Dispatch Watchdog reconciliation for this exact Discovery run
        if: ${{ success() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SOURCE_DISCOVERY_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          payload="$(jq -n --arg ref "main" --arg run_id "$SOURCE_DISCOVERY_RUN_ID" '{ref:$ref,inputs:{source_discovery_run_id:$run_id}}')"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/automation-watchdog.yml/dispatches" \
            --data "$payload"
          echo "Requested exact-run Watchdog reconciliation for Discovery run $SOURCE_DISCOVERY_RUN_ID."
