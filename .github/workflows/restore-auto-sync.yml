name: Restore auto_sync workflow
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore auto_sync from last good commit and label stages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          GOOD=1cad1aeaffd479ffeb86d96bb22063d0e41fad54
          git show "$GOOD:.github/workflows/auto_sync.yml" > .github/workflows/auto_sync.yml
          test -s .github/workflows/auto_sync.yml
          wc -c .github/workflows/auto_sync.yml
          python3 - <<'PY'
          from pathlib import Path
          text = Path(".github/workflows/auto_sync.yml").read_text()
          if text.strip() == "PLACEHOLDER" or len(text) < 10000:
              raise SystemExit("restored content looks wrong: %s" % len(text))
          text = text.replace(
              "jobs:\n  audit:\n    runs-on: ubuntu-24.04",
              "jobs:\n  audit:\n    name: \"3-5 collect select review\"\n    runs-on: ubuntu-24.04",
              1,
          )
          old_pub = "  publish:\n    needs: audit\n    runs-on: ubuntu-24.04"
          new_pub = "  publish:\n    name: \"6 publish\"\n    needs: audit\n    runs-on: ubuntu-24.04"
          if old_pub not in text:
              raise SystemExit("publish pattern missing")
          text = text.replace(old_pub, new_pub, 1)
          banner = (
              "      - name: Architecture stages (canonical)\n"
              "        run: |\n"
              "          set -euo pipefail\n"
              "          {\n"
              "            echo \"## Production architecture (6 stages)\"\n"
              "            echo \"| 1 | automation switch | production_control.json |\"\n"
              "            echo \"| 2 | Watchdog | sole scheduler |\"\n"
              "            echo \"| 3 | collect | discover + assess |\"\n"
              "            echo \"| 4 | select | candidates + admission |\"\n"
              "            echo \"| 5 | review | deterministic review + policy |\"\n"
              "            echo \"| 6 | publish | sole write boundary |\"\n"
              "            echo \"This job runs stages 3-5; stage 6 is the publish job.\"\n"
              "          } >> \"$GITHUB_STEP_SUMMARY\"\n"
              "\n"
          )
          needle = "      - name: Verify Watchdog-owned durable task dispatch\n"
          if needle not in text:
              raise SystemExit("needle missing")
          text = text.replace(needle, banner + needle, 1)
          Path(".github/workflows/auto_sync.yml").write_text(text)
          print("restored+labeled", len(text))
          PY
          rm -f .github/workflows/restore-auto-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/auto_sync.yml
          git add -u .github/workflows/restore-auto-sync.yml || true
          git status
          git commit -m "Restore auto_sync.yml and surface architecture stages 3-6"
          git push origin HEAD:main
