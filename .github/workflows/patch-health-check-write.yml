name: Patch health-check queue write permission
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: patch-health-check-write-main
  cancel-in-progress: false

jobs:
  patch:
    if: ${{ github.ref_name == 'main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
      - name: Grant health-check contents write for queue CAS
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/automation-watchdog.yml')
          text = path.read_text(encoding='utf-8')
          marker = '  health-check:\n'
          idx = text.find(marker)
          if idx < 0:
              raise SystemExit('health-check job not found')
          # Find the job-level permissions contents: read that belongs to health-check
          # (first contents: read after the job header before the next top-level job)
          rest = text[idx:]
          # Limit search to this job block roughly: until next job at column 0 with 2-space name
          next_job = None
          for line in rest.splitlines()[1:]:
              if line.startswith('  ') and not line.startswith('   ') and line.endswith(':') and not line.startswith('  #'):
                  # another job key at same indent as health-check
                  if line.strip() != 'health-check:' and not line.strip().startswith('if:') and not line.strip().startswith('name:') and not line.strip().startswith('runs-on:') and not line.strip().startswith('needs:') and not line.strip().startswith('timeout') and not line.strip().startswith('permissions:') and not line.strip().startswith('outputs:') and not line.strip().startswith('steps:') and not line.strip().startswith('env:') and not line.strip().startswith('concurrency:') and not line.strip().startswith('defaults:') and not line.strip().startswith('continue-on-error:') and not line.strip().startswith('strategy:') and not line.strip().startswith('container:') and not line.strip().startswith('services:') and not line.strip().startswith('uses:') and line[2] != ' ':
                      # job-level key at indent 2 ending with :
                      key = line.strip()[:-1]
                      if key not in {'if', 'name', 'runs-on', 'needs', 'timeout-minutes', 'permissions', 'outputs', 'steps', 'env', 'concurrency', 'defaults', 'continue-on-error', 'strategy', 'container', 'services', 'uses', 'secrets'}:
                          next_job = line
                          break
          # Simpler approach: replace the first "contents: read" that appears shortly after health-check:
          block_start = idx
          # find permissions under health-check
          perm = text.find('    permissions:', block_start)
          if perm < 0 or perm > block_start + 800:
              raise SystemExit('health-check permissions block not found near job')
          # next contents: read after that
          c_idx = text.find('      contents: read', perm)
          if c_idx < 0 or c_idx > perm + 200:
              raise SystemExit('health-check contents: read not found')
          new_text = text[:c_idx] + '      contents: write' + text[c_idx + len('      contents: read'):]
          if new_text == text:
              raise SystemExit('no change applied')
          path.write_text(new_text, encoding='utf-8')
          print('patched health-check contents: write')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/automation-watchdog.yml
          git commit -m "fix(watchdog): allow health-check contents write for queue CAS"
          git push origin HEAD:main
      - name: Remove one-shot patch workflow
        run: |
          set -euo pipefail
          path=".github/workflows/patch-health-check-write.yml"
          git pull --ff-only origin main
          if [ -f "$path" ]; then
            git rm "$path"
            git commit -m "chore: remove one-shot health-check write patch workflow"
            git push origin HEAD:main
          fi
