name: Validate Shadowrocket config against user baseline

on:
  push:
    paths:
      - "modules/uu.conf"
      - "scripts/validate_config.py"
      - "scripts/audit_config_drift.py"
      - "scripts/audit_ruleset_references.py"
      - "scripts/audit_ruleset_config_overlap.py"
      - "scripts/sync_ruleset_config_conflicts.py"
      - "scripts/register_config_baseline.py"
      - "scripts/select_domain_rules.py"
      - "scripts/refresh_ruleset_manifest.py"
      - "sources/reject_manual_approvals.json"
      - ".github/workflows/auto_sync.yml"
      - "scripts/collect_domains.py"
      - "scripts/deterministic_review.py"
      - "scripts/build_rulesets.py"
      - "scripts/json_document_store.py"
      - "scripts/domain_rule_engine.py"
      - "sources/domain_sources.json"
      - "sources/policy.json"
      - "tests/**"
      - ".github/workflows/validate-config.yml"
      - ".github/workflows/**"
      - "automation/program_registry.json"
      - "automation/execution_adapters.json"
      - "automation/task_queue.json"
      - "automation/*.json"
      - "automation/**/*.json"
      - "scripts/**"
  pull_request:
    paths:
      - "modules/uu.conf"
      - "scripts/**"
      - "sources/domain_sources.json"
      - "sources/policy.json"
      - "sources/protected_domains.json"
      - "tests/**"
      - ".github/workflows/validate-config.yml"
      - ".github/workflows/**"
      - "automation/program_registry.json"
      - "automation/execution_adapters.json"
      - "automation/*.json"
      - "automation/**/*.json"

permissions:
  contents: read

jobs:
  structural-check:
    runs-on: ubuntu-24.04
    env:
      GITHUB_BEFORE: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Run publish-base queue and monitoring regression tests
        run: python3 -m unittest discover -s tests -p 'test_publish_base_integration.py' -v
      - name: Run full deterministic unit regression suite
        run: python3 -m unittest discover -s tests -v
      - name: Replay pinned Source Discovery artifact through sharded registry (read-only)
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/source-discovery-output.zip"
          root="$RUNNER_TEMP/source-discovery-artifact"
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/13731605096/zip" \
            --output "$archive"
          echo "205d3cd4636c40aba3d652240838b85d286219d508259fc9bf80dc8a1869f27b  $archive" | sha256sum --check
          mkdir -p "$root"
          python -m zipfile -e "$archive" "$root"
          python scripts/validate_source_registry_artifact.py \
            --discovery-root "$root" \
            --artifact-zip "$archive" \
            --expected-artifact-sha256 205d3cd4636c40aba3d652240838b85d286219d508259fc9bf80dc8a1869f27b \
            --expected-inventory-sha256 03a5f323d0e464f4d063ed8577578eb6b4f3b9cd9f7c71354bfd8422fbdf4999 \
            --expected-run-id 42744978594 \
            --expected-head-sha 9edfef9422caabf2dfd92b69357dfddc6f4ff106
      - name: Parse every GitHub Actions workflow before structural tests
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input PyYAML==6.0.2
          python - <<'PY'
          from pathlib import Path
          import yaml

          files = sorted(Path(".github/workflows").glob("*.yml"))
          if not files:
              raise SystemExit("No GitHub Actions workflow files were found.")
          for path in files:
              with path.open(encoding="utf-8") as stream:
                  document = yaml.load(stream, Loader=yaml.BaseLoader)
              if not isinstance(document, dict) or not isinstance(document.get("jobs"), dict) or not document["jobs"]:
                  raise SystemExit(f"{path}: expected a workflow mapping with at least one job")
              print(f"YAML OK: {path} ({len(document['jobs'])} jobs)")
          PY
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint" .github/workflows/automation-watchdog.yml
      - name: Verify owner-approved config baseline registration in non-main validation
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main') }}
        env:
          CURRENT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          head_sha="$CURRENT_SHA"
          base_sha="$(git merge-base origin/main "$head_sha")"
          if [ -z "$base_sha" ]; then
            echo "Could not resolve the current main-branch baseline for non-main validation." >&2
            exit 1
          fi
          python3 scripts/verify_baseline.py --verify-registration --base "$base_sha" --head "$head_sha"
      - name: Recover owner-approved config baseline in validation workspace
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BASELINE_SOURCE_REF: ${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main')) && 'refs/heads/main' || github.ref }}
          BASELINE_SOURCE_EVENT: ${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main')) && 'schedule' || github.event_name }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          BASELINE_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] || { [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; }; then
            git fetch --no-tags origin main
            BASELINE_SOURCE_SHA="$(git merge-base origin/main "$GITHUB_SHA")"
            if [ -z "$BASELINE_SOURCE_SHA" ]; then
              echo "Could not resolve the current main-branch baseline for non-main validation." >&2
              exit 1
            fi
            export BASELINE_SOURCE_SHA
          fi
          python scripts/register_config_baseline.py
      - name: Verify owner-approved config baseline
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        run: python scripts/verify_baseline.py --baseline-only
      - name: Audit config drift against the approved baseline
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        run: python scripts/audit_config_drift.py
      - run: python scripts/audit_ruleset_references.py
      - run: python scripts/audit_ruleset_config_overlap.py
      - run: python scripts/validate_config.py
      - run: python scripts/select_domain_rules.py --self-test
      - name: Validate automation program capability registry
        run: python scripts/validate_program_registry.py
      - name: Validate cross-program task queue contract
        run: python scripts/task_queue.py
      - name: Smoke-check task queue runtime CLI
        run: python scripts/task_queue_runtime.py --help
      - run: python scripts/remote_task_queue_runtime.py --help
      - run: python scripts/resource_lease_runtime.py --help
      - run: python scripts/task_result_verifier.py --help
      - run: python scripts/task_scheduler.py --help
      - run: python scripts/github_workflow_adapter.py --help-contract
      - run: python scripts/audit_adapter_activation.py --help
      - name: Validate unified execution adapter contracts
        run: python scripts/validate_execution_adapters.py
      - name: Validate unified release manifest pins and execution safety gates
        run: python scripts/validate_release_manifest.py
      - name: Audit adapter activation readiness without enabling anything
        run: |
          set -euo pipefail
          python scripts/audit_adapter_activation.py | python -c 'import json,sys; d=json.load(sys.stdin); print("Activation audit: programs={program_count}, adapters={adapter_count}, enabled={enabled_adapter_count}, watchdog_permissions_ready={watchdog_caller_permissions_ready}".format(**d)); print("Least-privilege canary candidates: " + (", ".join(d["least_privilege_canary_candidates"]) or "none")); assert d["activation_performed"] is False'
      - name: Validate deterministic evidence review
        run: |
          python -m py_compile scripts/audit_adapter_activation.py scripts/github_queue_store.py scripts/github_workflow_adapter.py scripts/remote_task_queue_runtime.py scripts/task_result_verifier.py scripts/task_scheduler.py scripts/task_queue_runtime.py scripts/task_queue.py scripts/register_config_baseline.py scripts/sync_ruleset_config_conflicts.py scripts/audit_config_drift.py scripts/audit_ruleset_references.py scripts/audit_ruleset_config_overlap.py scripts/validate_config.py scripts/collect_domains.py scripts/deterministic_review.py scripts/domain_rule_engine.py scripts/json_document_store.py scripts/register_discovered_sources.py scripts/validate_source_registry_artifact.py scripts/assess_sources.py scripts/verify_assess_sources_artifacts.py scripts/build_rulesets.py
          python -m unittest discover -s tests -v
          python -m json.tool sources/domain_sources.json >/dev/null
          python -m json.tool sources/policy.json >/dev/null
          python -m json.tool sources/reject_manual_approvals.json >/dev/null
          if [ -f sources/domain_reviews.json ]; then python -m json.tool sources/domain_reviews.json >/dev/null; fi
          if [ -f sources/domain_reviews.json.manifest.json ]; then
            PYTHONPATH=scripts python -c 'from pathlib import Path; from json_document_store import read_document; read_document(Path("sources/domain_reviews.json"), "reviews")' >/dev/null
          fi
