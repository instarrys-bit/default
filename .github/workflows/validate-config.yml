name: Validate Shadowrocket config structure

on:
  push:
    paths:
      - "sources/baseline/ss.conf"\n      - "shadowrocket/ss.conf"
      - "scripts/validate_config.py scripts/audit_config_drift.py"
      - "scripts/select_domain_rules.py"
      - "scripts/collect_domains.py"
      - "scripts/deterministic_review.py"
      - "scripts/build_rulesets.py"
      - "scripts/domain_rule_engine.py"
      - "sources/domain_sources.json"
      - "sources/policy.json"
      - "tests/**"
      - ".github/workflows/validate-config.yml"
  pull_request:
    paths:
      - "sources/baseline/ss.conf"
      - "scripts/validate_config.py"
      - "scripts/select_domain_rules.py"
      - "scripts/collect_domains.py"
      - "scripts/deterministic_review.py"
      - "scripts/build_rulesets.py"
      - "scripts/domain_rule_engine.py"
      - "sources/domain_sources.json"
      - "sources/policy.json"
      - "tests/**"
      - ".github/workflows/validate-config.yml"

permissions:
  contents: read

jobs:
  structural-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python scripts/verify_baseline.py --baseline-only\n      - run: python scripts/audit_config_drift.py
      - run: python scripts/validate_config.py
      - run: python scripts/select_domain_rules.py --self-test
      - name: Validate deterministic evidence review
        run: |
          python -m py_compile scripts/collect_domains.py scripts/deterministic_review.py scripts/domain_rule_engine.py scripts/build_rulesets.py
          python -m unittest discover -s tests -v
          python -m json.tool sources/domain_sources.json >/dev/null
          python -m json.tool sources/policy.json >/dev/null
          python -m json.tool sources/domain_reviews.json >/dev/null
