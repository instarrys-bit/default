name: Validate Shadowrocket config against user baseline

on:
  push:
    paths:
      - "shadowrocket/ss.conf"
      - "scripts/validate_config.py"
      - "scripts/audit_config_drift.py"
      - "scripts/audit_ruleset_references.py"
      - "scripts/audit_ruleset_config_overlap.py"
      - "scripts/sync_ruleset_config_conflicts.py"
      - "scripts/register_config_baseline.py"
      - "scripts/select_domain_rules.py"
      - "scripts/refresh_ruleset_manifest.py"
      - "sources/reject_manual_approvals.json"
      - ".github/workflows/auto_sync.yml"
      - "scripts/collect_domains.py"
      - "scripts/deterministic_review.py"
      - "scripts/build_rulesets.py"
      - "scripts/json_document_store.py"
      - "scripts/domain_rule_engine.py"
      - "sources/domain_sources.json"
      - "sources/policy.json"
      - "tests/**"
      - ".github/workflows/validate-config.yml"
      - ".github/workflows/**"
      - "automation/program_registry.json"
      - "automation/execution_adapters.json"
      - "automation/task_queue.json"
      - "scripts/**"
  pull_request:
    paths:
      - "shadowrocket/ss.conf"
      - "scripts/**"
      - "sources/domain_sources.json"
      - "sources/policy.json"
      - "sources/protected_domains.json"
      - "tests/**"
      - ".github/workflows/validate-config.yml"
      - ".github/workflows/**"
      - "automation/program_registry.json"
      - "automation/execution_adapters.json"

permissions:
  contents: read

jobs:
  structural-check:
    runs-on: ubuntu-24.04
    env:
      GITHUB_BEFORE: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Recover owner-approved config baseline in validation workspace
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_SHA: ${{ github.sha }}
        run: python scripts/register_config_baseline.py
      - run: python scripts/verify_baseline.py --allow-owner-push-change
      - run: python scripts/audit_config_drift.py --allow-owner-push-change
      - run: python scripts/audit_ruleset_references.py
      - run: python scripts/audit_ruleset_config_overlap.py
      - run: python scripts/validate_config.py
      - run: python scripts/select_domain_rules.py --self-test
      - name: Validate automation program capability registry
        run: python scripts/validate_program_registry.py
      - name: Validate cross-program task queue contract
        run: python scripts/task_queue.py
      - name: Smoke-check task queue runtime CLI
        run: python scripts/task_queue_runtime.py --help
      - run: python scripts/remote_task_queue_runtime.py --help
      - name: Validate unified execution adapter contracts
        run: python scripts/validate_execution_adapters.py
      - name: Validate deterministic evidence review
        run: |
          python -m py_compile scripts/github_queue_store.py scripts/remote_task_queue_runtime.py scripts/task_queue_runtime.py scripts/register_config_baseline.py scripts/sync_ruleset_config_conflicts.py scripts/audit_config_drift.py scripts/audit_ruleset_references.py scripts/audit_ruleset_config_overlap.py scripts/validate_config.py scripts/collect_domains.py scripts/deterministic_review.py scripts/domain_rule_engine.py scripts/json_document_store.py scripts/build_rulesets.py
          python -m unittest discover -s tests -v
          python -m json.tool sources/domain_sources.json >/dev/null
          python -m json.tool sources/policy.json >/dev/null
          python -m json.tool sources/reject_manual_approvals.json >/dev/null
          if [ -f sources/domain_reviews.json ]; then python -m json.tool sources/domain_reviews.json >/dev/null; fi
          if [ -f sources/domain_reviews.json.manifest.json ]; then
            PYTHONPATH=scripts python -c 'from pathlib import Path; from json_document_store import read_document; read_document(Path("sources/domain_reviews.json"), "reviews")' >/dev/null
          fi
