name: Validate Shadowrocket config
on:
  push:
    paths:
      - "shadowrocket/ss.conf"
      - "scripts/validate_config.py"
      - "scripts/audit_pipeline.py"
      - "scripts/import_gpt_reviewed_domains.py"
      - "scripts/domain_rule_engine.py"
      - "sources/policy.json"
      - "sources/gpt_domain_reviews.json"
      - ".github/workflows/validate-config.yml"
  pull_request:
    paths:
      - "shadowrocket/ss.conf"
      - "scripts/validate_config.py"
      - "scripts/audit_pipeline.py"
      - "scripts/import_gpt_reviewed_domains.py"
      - "scripts/domain_rule_engine.py"
      - "sources/policy.json"
      - "sources/gpt_domain_reviews.json"
      - ".github/workflows/validate-config.yml"
permissions:
  contents: read
jobs:
  structural-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/validate_config.py
      - run: python scripts/audit_pipeline.py
      - run: python scripts/select_domain_rules.py --self-test
