name: Durable queue snapshot artifact
run-name: Queue snapshot ${{ inputs.automation_task_id || 'scheduled' }}

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      automation_task_id:
        description: Optional correlation label for a manually requested backup
        required: false
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: durable-queue-snapshot-artifact
  cancel-in-progress: false

jobs:
  export-and-upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Export durable queue snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 scripts/remote_task_queue_runtime.py \
            --repository "$GITHUB_REPOSITORY" \
            --branch main \
            snapshot \
            --output "$RUNNER_TEMP/task_queue.json"
          ls -la "$RUNNER_TEMP/task_queue.json"
          python3 -c "import json; d=json.load(open('$RUNNER_TEMP/task_queue.json')); print('revision', d.get('revision'), 'tasks', len(d.get('tasks', [])))"

      - name: Upload durable queue snapshot artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: durable-queue-snapshot-${{ github.run_id }}
          path: ${{ runner.temp }}/task_queue.json
          retention-days: 30
          if-no-files-found: error
