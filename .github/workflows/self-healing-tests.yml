name: Validate self-healing agent
run-name: Automation task ${{ inputs.automation_task_id || 'manual' }}

on:
  pull_request:
    paths:
      - ".github/workflows/self-healing-agent.yml"
      - ".github/workflows/self-healing-tests.yml"
      - ".github/workflows/auto_sync.yml"
      - ".github/workflows/automation-watchdog.yml"
      - "automation/production_inputs.json"
      - "scripts/production_intent.py"
      - "tests/test_production_intent.py"
      - "scripts/apply_safe_repair.py"
      - "scripts/diagnose_workflow_failure.py"
      - "scripts/refresh_ruleset_manifest.py"
      - "scripts/watchdog_recovery_policy.py"
      - "scripts/verify_recovery_run.py"
      - "scripts/incident_state.py"
      - "tests/test_apply_safe_repair.py"
      - "tests/test_diagnose_workflow_failure.py"
      - "tests/test_refresh_ruleset_manifest.py"
      - "tests/test_self_healing_workflow.py"
      - "tests/test_watchdog_recovery_policy.py"
      - "tests/test_verify_recovery_run.py"
      - "tests/test_incident_state.py"
      - "automation/release_manifest.json"
      - "automation/program_registry.json"
      - "automation/execution_adapters.json"
      - "automation/capability_contract_inventory.json"
      - "automation/capability_contracts/**"
      - "scripts/validate_release_manifest.py"
      - "tests/test_release_manifest.py"
      - "tests/test_capability_contract_inventory.py"
      - "scripts/restore_automation_state.py"
      - "scripts/fenced_file_writer.py"
      - "scripts/resource_lease_runtime.py"
      - "scripts/task_scheduler.py"
      - "scripts/assess_sources.py"
      - "automation/resource_ownership_audit.json"
      - "automation/resource_write_sets.json"
  workflow_dispatch:
    inputs:
      automation_task_id:
        description: 'Internal task correlation ID; leave blank for manual runs'
        required: false
        type: string

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Release-manifest tests validate historical Git blob pins, so the
          # checkout must contain the referenced objects rather than depth 1. 
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Compile self-healing modules
        run: |
          python3 -m py_compile scripts/apply_safe_repair.py scripts/diagnose_workflow_failure.py scripts/refresh_ruleset_manifest.py scripts/watchdog_recovery_policy.py scripts/verify_recovery_run.py scripts/incident_state.py
      - name: Test bounded watchdog recovery policy
        run: python3 -m unittest discover -s tests -p "test_watchdog_recovery_policy.py" -v
      - name: Test independent recovery verification
        run: python3 -m unittest discover -s tests -p "test_verify_recovery_run.py" -v
      - name: Test manifest reconciliation
        run: python3 -m unittest discover -s tests -p "test_refresh_ruleset_manifest.py" -v
      - name: Test failure diagnosis
        run: python3 -m unittest discover -s tests -p "test_diagnose_workflow_failure.py" -v
      - name: Test safe repair application
        run: python3 -m unittest discover -s tests -p "test_apply_safe_repair.py" -v
      - name: Test workflow safety boundaries
        run: python3 -m unittest discover -s tests -p "test_self_healing_workflow.py" -v
      - name: Run full deterministic unit suite
        run: python3 -m unittest discover -s tests -v
