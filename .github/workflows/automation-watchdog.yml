              raise SystemExit("Callback producer run identity or conclusion is invalid; queue reconciliation is held.")
          print(json.dumps({
              "producer_run_id": run_id,
              "producer_workflow_path": expected_path,
              "producer_head_sha": producer["head_sha"],
              "producer_status": producer["status"],
              "producer_conclusion": producer["conclusion"],
              "producer_verified": True,
          }, sort_keys=True))
