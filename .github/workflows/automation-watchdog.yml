name: Shadowrocket automation watchdog
run-name: Automation task ${{ inputs.automation_task_id || 'manual' }}

on:
  schedule:
    # GITHUB_TOKEN-dispatched workflow completions do not reliably emit workflow_run events.
    # Reconcile the durable queue every 15 minutes so blocked downstream tasks resume promptly.
    - cron: "*/15 * * * *"
    - cron: "30 22 * * *"
  workflow_dispatch:
    inputs:
      request_deterministic_audit:
        description: 'Explicitly authorize one deterministic production audit through the durable Watchdog queue'
        required: false
        default: false
        type: boolean
      automation_task_id:
        description: 'Internal task correlation ID; leave blank for manual runs'
        required: false
        type: string
  workflow_run:
    workflows:
      - "Shadowrocket Deterministic Domain Audit (User Config Baseline)"
      - "Shadowrocket Source Discovery (Watchdog)"
      - "Validate Shadowrocket config against user baseline"
      - "Validate self-healing agent"
    types: [completed]
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "sources/policy.json"
      - "sources/domain_sources.json"
      - "sources/policy_approvals.json"
      - "sources/protected_domains.json"
      - "sources/request_domain_observations.json"
      - "sources/reject_manual_approvals.json"
      - "scripts/**"
      - "tests/**"
      - "modules/uu.conf"
      - "automation/program_registry.json"
      - "automation/execution_adapters.json"
      - "automation/unregistered_path_registry.json"
      - "automation/production_inputs.json"
      - "automation/production_control.json"

permissions:
  actions: write
  contents: read
  issues: write

# GitHub keeps only one pending run per concurrency group. A shared group can
# silently replace a pending push/workflow_run watchdog event with a later event.
# Queue writes use CAS, while the publisher has its own main-writer lock.
concurrency:
  group: shadowrocket-automation-watchdog-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  baseline-sync:
    name: Audit owner-approved uu.conf baseline (read-only)
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout exact triggering main snapshot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python for baseline audit
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Audit owner-approved baseline without repository writes
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          result="$(python3 scripts/register_config_baseline.py)"
          echo "$result"
          registered="$(printf '%s' "$result" | jq -r '.registered // false')"
          if [ "$registered" = "true" ]; then
            body_file="$RUNNER_TEMP/baseline-issue.md"
            {
              printf '%s\n\n' 'The read-only baseline audit verified an owner-approved config change. No repository files were written by automation. Review this evidence and update baseline metadata manually if appropriate:'
              printf '%s\n' '~~~json'
              printf '%s\n' "$result"
              printf '%s\n' '~~~'
            } > "$body_file"
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Owner-approved uu.conf baseline metadata requires manual reconciliation" \
              --body-file "$body_file"
          fi
          git diff --quiet "$GITHUB_SHA" -- modules/uu.conf
          echo "Baseline audit completed; no repository write was performed."
  health-check:
    needs: [baseline-sync]
    if: ${{ always() && (needs.baseline-sync.result == 'success' || needs.baseline-sync.result == 'skipped') && (github.event_name != 'workflow_run' || (github.event.workflow_run.head_branch == 'main' && (github.event.workflow_run.path == '.github/workflows/auto_sync.yml' || github.event.workflow_run.path == '.github/workflows/source-discovery.yml' || github.event.workflow_run.path == '.github/workflows/validate-config.yml' || github.event.workflow_run.path == '.github/workflows/self-healing-agent.yml'))) }}
    # Queue mutations are Git-blob-SHA CAS; production outputs are protected by
    # live resource leases and fencing tokens. Keep supervision independent of
    # the publisher mutex so it can renew and verify long-running tasks.
    concurrency:
      group: shadowrocket-watchdog-control-plane-${{ github.run_id }}
      cancel-in-progress: false
    env:
      GITHUB_ACTOR_ID: ${{ github.actor_id }}
      GITHUB_MANUAL_AUDIT_REQUEST: ${{ inputs.request_deterministic_audit }}
    outputs:
      block_manifest: ${{ steps.stale-recovery.outputs.block_manifest }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      issues: write
    steps:
      - name: Checkout watchdog policy code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python for deterministic recovery policy
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Export durable queue snapshot from Issue state
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 scripts/remote_task_queue_runtime.py --repository "$GITHUB_REPOSITORY" --branch main snapshot --output "$RUNNER_TEMP/task_queue.json"
          echo "AUTOMATION_QUEUE_SNAPSHOT=$RUNNER_TEMP/task_queue.json" >> "$GITHUB_ENV"
      - name: Recover failed or superseded production audit
        if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SOURCE_EVENT: ${{ github.event.workflow_run.event }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_WORKFLOW_PATH: ${{ github.event.workflow_run.path }}
        run: |
          set -euo pipefail
          # Only the production ruleset audit is recovered here. Config-validator
          # and self-healing failures have their own diagnosis paths.
          if [ "$SOURCE_WORKFLOW_PATH" != ".github/workflows/auto_sync.yml" ]; then
            echo "This recovery path only handles the deterministic ruleset audit."
            exit 0
          fi
          if [ "$SOURCE_EVENT" != "schedule" ] && [ "$SOURCE_EVENT" != "push" ] && [ "$SOURCE_EVENT" != "workflow_dispatch" ]; then
            echo "No recovery for source event=$SOURCE_EVENT."
            exit 0
          fi

          audit_input_json='{}'
          if [ "$SOURCE_EVENT" = "workflow_dispatch" ]; then
            display_title="$(gh api "repos/$REPO/actions/runs/$SOURCE_RUN_ID" --jq .display_title)"
            source_task_id="$(python3 - "$display_title" <<'PY'
          import re, sys
          match = re.fullmatch(r"Automation task (task_[0-9a-f]{24})-a[1-9][0-9]*", sys.argv[1])
          print(match.group(1) if match else "")
          PY
          )"
            if [ -z "$source_task_id" ]; then
              echo "Workflow-dispatch run has no durable queue task correlation; refusing automatic recovery."
              exit 0
            fi
            queue_content="$(base64 -w0 "$AUTOMATION_QUEUE_SNAPSHOT")"
            audit_input_json="$(QUEUE_CONTENT="$queue_content" python3 - "$source_task_id" <<'PY'
          import base64, json, os, sys
          queue = json.loads(base64.b64decode(os.environ["QUEUE_CONTENT"]).decode("utf-8"))
          task = next((item for item in queue.get("tasks", []) if item.get("task_id") == sys.argv[1]), None)
          if task is None or not isinstance(task.get("input"), dict):
              raise SystemExit("Correlated durable queue task or its input is missing; refusing recovery.")
          print(json.dumps(task["input"], ensure_ascii=False, separators=(",", ":")))
          PY
          )"
          fi

          runs="$(gh api --paginate --slurp "repos/$REPO/actions/workflows/auto_sync.yml/runs?per_page=100" | jq '{workflow_runs: [.[].workflow_runs[]]}')"
          current_sha="$(gh api "repos/$REPO/commits/main" --jq .sha)"

          if jq -e --argjson source "$SOURCE_RUN_ID" --arg sha "$current_sha" '[.workflow_runs[] | select(.head_branch == "main" and .head_sha == $sha and .id > $source and (.status != "completed" or .conclusion == "success"))] | length > 0' <<< "$runs" >/dev/null; then
            echo "A newer successful or active current-main audit already exists; no duplicate recovery."
            exit 0
          fi
          if jq -e '[.workflow_runs[] | select(.head_branch == "main" and (.status == "queued" or .status == "pending" or .status == "waiting" or .status == "requested" or .status == "in_progress"))] | length > 0' <<< "$runs" >/dev/null; then
            echo "A main-branch deterministic audit is already queued or running; no duplicate recovery."
            exit 0
          fi

          recovery_kind=""
          case "$SOURCE_CONCLUSION" in
            timed_out|startup_failure)
              recovery_kind="infrastructure"
              ;;
            failure)
              task_fingerprint="$(jq -r '.production_fingerprint // empty' <<< "$audit_input_json")"
              if [ -n "$task_fingerprint" ]; then
                checkout_sha="$(git rev-parse HEAD)"
                if [ "$checkout_sha" != "$current_sha" ]; then
                  echo "Watchdog checkout is behind current main; failed-audit recovery will be reconsidered on the next reconciliation."
                  exit 0
                fi
                current_fingerprint="$(python3 -c 'import sys; from pathlib import Path; sys.path.insert(0, "scripts"); from production_intent import load_manifest, compute_fingerprint; manifest = load_manifest(Path("automation/production_inputs.json")); print(compute_fingerprint(Path("."), manifest))')"
                if [ "$task_fingerprint" != "$current_fingerprint" ]; then
                  echo "The task's input fingerprint is stale even if its workflow run SHA equals current main; replacing it with the current input fingerprint."
                  recovery_kind="superseded_inputs"
                else
                  if [ "$SOURCE_SHA" = "$current_sha" ]; then
                    echo "Same-SHA failure with an unchanged production fingerprint requires diagnosis; automatic retry is prohibited."
                    exit 0
                  fi
                  compare_json="$(gh api "repos/$REPO/compare/$SOURCE_SHA...$current_sha" 2>/dev/null || true)"
                  if [ -z "$compare_json" ] || ! jq -e '.status == "ahead" and (.files | type == "array")' <<< "$compare_json" >/dev/null; then
                    echo "Could not safely classify the failed audit's base advancement; leaving it for the next scheduled reconciliation."
                    exit 0
                  fi
                  compare_file="$RUNNER_TEMP/failed-audit-base-compare.json"
                  printf '%s' "$compare_json" > "$compare_file"
                  if GITHUB_SHA="$SOURCE_SHA" COMPARE_JSON_FILE="$compare_file" bash scripts/verify_publish_base.sh --check-only; then
                    echo "The failed audit's reviewed inputs remain current; this is not a superseded-input failure. No automatic retry."
                    exit 0
                  fi
                  title="Production input classification requires review"
                  body="The failed audit's production fingerprint still matches current main, but the publish-base guard found repository changes that are not safely classified. No replacement production task was created. Review the changed paths and register them in automation/production_inputs.json if appropriate."
                  issue="$(gh issue list --repo "$REPO" --state open --search "$title in:title" --json number --jq '.[0].number')"
                  if [ -n "$issue" ] && [ "$issue" != "null" ]; then
                    gh issue comment "$issue" --repo "$REPO" --body "$body"
                  else
                    gh issue create --repo "$REPO" --title "$title" --body "$body"
                  fi
                  exit 0
                fi
              else
                # Legacy tasks without fingerprints retain the old conservative base guard.
                if [ "$SOURCE_SHA" = "$current_sha" ]; then
                  echo "Same-SHA deterministic failure requires diagnosis; automatic retry is prohibited."
                  exit 0
                fi
                compare_json="$(gh api "repos/$REPO/compare/$SOURCE_SHA...$current_sha" 2>/dev/null || true)"
                if [ -z "$compare_json" ] || ! jq -e '.status == "ahead" and (.files | type == "array")' <<< "$compare_json" >/dev/null; then
                  echo "Could not safely classify the failed audit's base advancement; leaving it for the next scheduled reconciliation."
                  exit 0
                fi
                compare_file="$RUNNER_TEMP/failed-audit-base-compare.json"
                printf '%s' "$compare_json" > "$compare_file"
                if GITHUB_SHA="$SOURCE_SHA" COMPARE_JSON_FILE="$compare_file" bash scripts/verify_publish_base.sh --check-only; then
                  echo "The failed audit's reviewed inputs remain current; this is not a superseded-input failure. No automatic retry."
                  exit 0
                fi
                recovery_kind="superseded_inputs"
              fi
              ;;
            *)
              echo "Conclusion '$SOURCE_CONCLUSION' is not eligible for automatic recovery."
              exit 0
              ;;
          esac

          if [ "$recovery_kind" = "infrastructure" ]; then
            decision="$(python3 scripts/watchdog_recovery_policy.py --source-run-id "$SOURCE_RUN_ID" --source-sha "$SOURCE_SHA" <<< "$runs")"
            echo "$decision" | jq -r '"Infrastructure recovery: " + .reason + "; prior retryable failures=" + (.prior_retryable_failures|tostring) + "; retry=" + (.retry_number|tostring) + "/" + (.max_retries|tostring) + "."'
            if [ "$(jq -r '.allowed' <<< "$decision")" != "true" ]; then
              echo "$decision" >> "$GITHUB_STEP_SUMMARY"
              echo "Automatic infrastructure retry suppressed by bounded recovery policy."
              exit 0
            fi
            recovery_fingerprint="$(jq -r '.production_fingerprint // empty' <<< "$audit_input_json")"
            if [ -n "$recovery_fingerprint" ]; then
              idempotency_key="production:recovery:$recovery_fingerprint:$SOURCE_RUN_ID"
            else
              idempotency_key="auto-sync-recovery:$SOURCE_RUN_ID"
            fi
          else
            echo "The source audit was superseded by meaningful main-branch input changes; recomputing intent against current main."
            checkout_sha="$(git rev-parse HEAD)"
            if [ "$checkout_sha" != "$current_sha" ]; then
              echo "Watchdog checkout is behind current main; superseded recovery will be reconsidered on the next reconciliation."
              exit 0
            fi
            current_fingerprint="$(python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from production_intent import load_manifest, compute_fingerprint
          manifest = load_manifest(Path("automation/production_inputs.json"))
          print(compute_fingerprint(Path("."), manifest))
          PY
          )"
            audit_input_json="$(jq --arg fingerprint "$current_fingerprint" --arg sha "$current_sha" --arg reason "new production input superseded the failed audit; re-evaluating current main" '. + {production_fingerprint:$fingerprint,production_decision:"INPUT_CHANGED",production_reason:$reason,baseline_source_sha:$sha}' <<< "$audit_input_json")"
            idempotency_key="production:input:$current_fingerprint:$current_sha"
          fi
          dispatch_mode="$(python3 - <<'PY'
          import json
          from pathlib import Path
          try:
              control = json.loads(Path("automation/production_control.json").read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError):
              control = {}
          mode = control.get("dispatch_mode") if isinstance(control, dict) and type(control.get("schema_version")) is int and control.get("schema_version") == 1 else "hold"
          print(mode if mode in {"enabled", "hold"} else "hold")
          PY
          )"
          if [ "$dispatch_mode" != "enabled" ]; then
            echo "HOLD: stale-run recovery enqueue suppressed; inspection remains read-only." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          printf '%s' "$GH_TOKEN" | python3 scripts/task_scheduler.py --repository "$REPO" --branch main --token-stdin --idempotency-key "$idempotency_key" --priority 100 --input-json "$audit_input_json" enqueue-auto-sync

      - name: Report degraded source discovery health
        if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.path == '.github/workflows/auto_sync.yml' && github.event.workflow_run.conclusion == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          encoded="$(gh api "repos/$REPO/contents/reports/project-status.json" --jq .content)"
          decoded="$(python3 -c 'import base64,sys; raw="".join(sys.stdin.read().split()); print(base64.b64decode(raw).decode("utf-8"))' <<< "$encoded")"
          health="$(jq -r '.health' <<< "$decoded")"
          search_errors="$(jq -r '.source_discovery.search_error_count // 0' <<< "$decoded")"
          tree_errors="$(jq -r '.source_discovery.tree_error_count // 0' <<< "$decoded")"
          coverage_stalled="$(jq -r '.coverage.stalled // false' <<< "$decoded")"
          title="Shadowrocket source discovery degraded health"
          if [ "$health" = "CHECK" ] || [ "$health" = "FAIL" ]; then
            body="Project health is $health after a successful workflow.\n\nSearch errors: $search_errors\nTree scan errors: $tree_errors\nCoverage stalled: $coverage_stalled\nRun: $RUN_URL\n\nThe affected source inventory remains non-activating until it passes deterministic review. Inspect reports/project-status.json and reports/source-discovery.md."
            issue="$(gh issue list --repo "$REPO" --state open --search "$title in:title" --json number --jq '.[0].number')"
            if [ -n "$issue" ] && [ "$issue" != "null" ]; then
              gh issue comment "$issue" --repo "$REPO" --body "$body"
            else
              gh issue create --repo "$REPO" --title "$title" --body "$body"
            fi
          else
            issue="$(gh issue list --repo "$REPO" --state open --search "$title in:title" --json number --jq '.[0].number')"
            if [ -n "$issue" ] && [ "$issue" != "null" ]; then
              gh issue comment "$issue" --repo "$REPO" --body "Project health recovered to PASS. Recovery run: $RUN_URL"
              gh issue close "$issue" --repo "$REPO"
            fi
          fi
      - name: Detect stale successful audit and recover
        id: stale-recovery
        if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ORIGIN_EVENT: ${{ github.event_name }}
          ORIGIN_ACTOR: ${{ github.actor }}
          ORIGIN_BEFORE: ${{ github.event.before }}
          ORIGIN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          runs="$(gh api "repos/$REPO/actions/workflows/auto_sync.yml/runs?per_page=100" | jq '{workflow_runs: .workflow_runs}')"

          current_sha="$(gh api "repos/$REPO/commits/main" --jq .sha)"
          checkout_sha="$(git rev-parse HEAD)"
          if [ "$checkout_sha" != "$current_sha" ]; then
            echo "Watchdog checkout is behind current main; refusing to decide from a stale input snapshot."
            echo "block_manifest=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if jq -e '[.workflow_runs[] | select(.head_branch == "main" and (.status == "queued" or .status == "pending" or .status == "waiting" or .status == "requested" or .status == "in_progress"))] | length > 0' <<< "$runs" >/dev/null; then
            echo "A main-branch deterministic audit is already queued or running; no duplicate dispatch."
            echo "block_manifest=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A manual authorization is an explicit one-shot request, not a bypass
          # of the normal Watchdog queue, unknown-path gate, or protected baseline.
          if [ "$ORIGIN_EVENT" = "workflow_dispatch" ] && [ "${{ inputs.request_deterministic_audit }}" = "true" ]; then
            manual_dispatch_mode="$(python3 - <<'PY'
          import json
          from pathlib import Path
          try:
              control = json.loads(Path("automation/production_control.json").read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError):
              control = {}
          mode = control.get("dispatch_mode") if isinstance(control, dict) and type(control.get("schema_version")) is int and control.get("schema_version") == 1 else "hold"
          print(mode if mode in {"enabled", "hold"} else "hold")
          PY
          )"
            if [ "$manual_dispatch_mode" != "enabled" ]; then
              echo "HOLD: explicit manual audit request was not enqueued; production dispatch remains held." >> "$GITHUB_STEP_SUMMARY"
              echo "block_manifest=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            pending_paths="$(jq '[.entries[] | select(.status == "PENDING_CLASSIFICATION") | select((.path | startswith("modules/")) | not)] | length' automation/unregistered_path_registry.json)"
            if [ "$pending_paths" -gt 0 ]; then
              echo "Manual audit blocked: $pending_paths unclassified paths remain in the Watchdog inbox."
              echo "block_manifest=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            active_tasks="$(jq '[.tasks[] | select(.status == "QUEUED" or .status == "CLAIMED" or .status == "VERIFYING")] | length' "$AUTOMATION_QUEUE_SNAPSHOT")"
            if [ "$active_tasks" -gt 0 ]; then
              echo "Manual audit blocked: $active_tasks durable queue task(s) are already active."
              echo "block_manifest=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            manual_fingerprint="$(python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from production_intent import load_manifest, compute_fingerprint
          manifest = load_manifest(Path("automation/production_inputs.json"))
          print(compute_fingerprint(Path("."), manifest))
          PY
          )"
            if [ -z "$manual_fingerprint" ]; then
              echo "Manual audit blocked: production input fingerprint is empty."
              exit 1
            fi
            manual_key="production:manual-authorized:$manual_fingerprint:$GITHUB_RUN_ID"
            manual_input="$(jq -cn --arg fingerprint "$manual_fingerprint" --arg sha "$current_sha" --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" --arg actor "$GITHUB_ACTOR" --arg actor_id "$GITHUB_ACTOR_ID" --arg repo "$GITHUB_REPOSITORY" --arg workflow_ref "$GITHUB_WORKFLOW_REF" --arg ref "$GITHUB_REF" --arg manual_request "$GITHUB_MANUAL_AUDIT_REQUEST" --arg target "workflow_auto_sync" --arg idem "$manual_key" '{production_fingerprint:$fingerprint,production_decision:"USER_AUTHORIZED_MANUAL_AUDIT",production_reason:"Explicit one-shot user authorization submitted through the Watchdog manual control.",baseline_source_event:"workflow_dispatch",baseline_source_sha:$sha,authorization_run_id:$run,authorization_run_attempt:$attempt,authorization_actor:$actor,authorization_actor_id:$actor_id,authorization_repository:$repo,authorization_workflow_ref:$workflow_ref,authorization_event:"workflow_dispatch",authorization_ref:$ref,authorization_head_sha:$sha,authorization_requested:($manual_request=="true"),authorization_target_program_id:$target,authorization_idempotency_key:$idem}')"
            echo "Enqueueing one explicitly authorized deterministic audit for current main $current_sha ($manual_fingerprint)."
            printf '%s' "$GH_TOKEN" | python3 scripts/task_scheduler.py --repository "$REPO" --branch main --token-stdin --idempotency-key "$manual_key" --priority 100 --input-json "$manual_input" enqueue-auto-sync
            echo "One authorized deterministic audit was persisted to the durable queue." >> "$GITHUB_STEP_SUMMARY"
            echo "block_manifest=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Reconcile only queue-backed audits stopped at the exact stale-base guard.
          # The durable queue is the bounded source of failed task IDs; do not scan
          # the entire Actions history on every hourly Watchdog pass.
          if [ "$ORIGIN_EVENT" = "push" ] || [ "$ORIGIN_EVENT" = "schedule" ]; then
            current_fingerprint="$(python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from production_intent import load_manifest, compute_fingerprint
          manifest = load_manifest(Path("automation/production_inputs.json"))
          print(compute_fingerprint(Path("."), manifest))
          PY
          )"
            while IFS=$'\t' read -r failed_task_id failed_run_id; do
              if [ -z "$failed_task_id" ] || [ -z "$failed_run_id" ]; then
                continue
              fi
              task_workflow_id="$(jq -r --arg task "$failed_task_id" '[.tasks[] | select(.task_id == $task)] | last | .dispatch_intent.workflow_id // empty' "$AUTOMATION_QUEUE_SNAPSHOT")"
              if [[ ! "$task_workflow_id" =~ ^[0-9]+$ ]]; then
                continue
              fi
              failed_run_json="$(gh api "repos/$REPO/actions/runs/$failed_run_id" 2>/dev/null || true)"
              if [ -z "$failed_run_json" ] || ! jq -e --argjson workflow_id "$task_workflow_id" '
                .head_branch == "main"
                and .path == ".github/workflows/auto_sync.yml"
                and .workflow_id == $workflow_id
                and .conclusion == "failure"
                and .event == "workflow_dispatch"
              ' <<< "$failed_run_json" >/dev/null; then
                continue
              fi

              task_input="$(jq -c --arg task "$failed_task_id" --argjson run "$failed_run_id" '
                [.tasks[] | select(
                  .task_id == $task
                  and .target_program_id == "workflow_auto_sync"
                  and .status == "DEAD_LETTER"
                  and .verification.status == "failed"
                  and .last_error.type == "workflow_run_failed"
                  and .last_error.evidence.run_id == $run
                )] | last | .input // empty
              ' "$AUTOMATION_QUEUE_SNAPSHOT")"
              if [ -z "$task_input" ] || [ "$task_input" = "null" ] || [ "$(jq -r '.production_fingerprint // empty' <<< "$task_input")" != "$current_fingerprint" ]; then
                continue
              fi

              failed_jobs="$(gh api "repos/$REPO/actions/runs/$failed_run_id/jobs?per_page=100" 2>/dev/null || true)"
              if [ -z "$failed_jobs" ] || ! jq -e '[.jobs[]?.steps[]? | select(.name == "Stop stale audit before expensive deterministic review" and .conclusion == "failure")] | length == 1' <<< "$failed_jobs" >/dev/null; then
                continue
              fi
              failed_sha="$(jq -r '.head_sha // empty' <<< "$failed_run_json")"
              if [ -z "$failed_sha" ] || [ "$failed_sha" = "$current_sha" ]; then
                continue
              fi
              compare_json="$(gh api "repos/$REPO/compare/$failed_sha...$current_sha" 2>/dev/null || true)"
              if [ -z "$compare_json" ] || ! jq -e '.status == "ahead" and (.files | type == "array")' <<< "$compare_json" >/dev/null; then
                continue
              fi
              compare_file="$RUNNER_TEMP/guard-reconciliation-compare.json"
              printf '%s' "$compare_json" > "$compare_file"
              if ! GITHUB_SHA="$failed_sha" COMPARE_JSON_FILE="$compare_file" bash scripts/verify_publish_base.sh --check-only; then
                continue
              fi

              if jq -e --arg fingerprint "$current_fingerprint" '
                [.tasks[] | select(
                  .target_program_id == "workflow_auto_sync"
                  and .input.production_fingerprint == $fingerprint
                  and (.status == "QUEUED" or .status == "CLAIMED" or .status == "VERIFYING"
                       or (.status == "SUCCEEDED" and .verification.status == "passed"))
                )] | length > 0
              ' "$AUTOMATION_QUEUE_SNAPSHOT" >/dev/null; then
                echo "A current task already covers this production fingerprint; stale-guard reconciliation is not duplicated."
                echo "block_manifest=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi

              recovery_dispatch_mode="$(python3 - <<'PY'
          import json
          from pathlib import Path
          try:
              control = json.loads(Path("automation/production_control.json").read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError):
              control = {}
          mode = control.get("dispatch_mode") if isinstance(control, dict) and type(control.get("schema_version")) is int and control.get("schema_version") == 1 else "hold"
          print(mode if mode in {"enabled", "hold"} else "hold")
          PY
          )"
              if [ "$recovery_dispatch_mode" != "enabled" ]; then
                echo "HOLD: stale-guard reconciliation is classified but automatic dispatch is disabled."
                echo "block_manifest=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              pending_paths="$(jq '[.entries[] | select(.status == "PENDING_CLASSIFICATION") | select((.path | startswith("modules/")) | not)] | length' automation/unregistered_path_registry.json)"
              if [ "$pending_paths" -gt 0 ]; then
                echo "Stale-guard reconciliation is held because $pending_paths unclassified paths remain in the Watchdog inbox."
                echo "block_manifest=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi

              source_event="$(jq -r '.baseline_source_event // "workflow_dispatch"' <<< "$task_input")"
              source_actor="$(jq -r '.baseline_source_actor // empty' <<< "$task_input")"
              source_before="$(jq -r '.baseline_source_before // empty' <<< "$task_input")"
              source_baseline_sha="$(jq -r '.baseline_source_sha // empty' <<< "$task_input")"
              if [ -z "$source_baseline_sha" ]; then
                source_baseline_sha="$failed_sha"
              fi
              recovery_reason="previous audit stopped at the stale-base guard; current main now passes the strict publish-base classification with an unchanged production fingerprint"
              recovery_input="$(jq -cn \
                --arg fingerprint "$current_fingerprint" \
                --arg reason "$recovery_reason" \
                --arg event "$source_event" \
                --arg actor "$source_actor" \
                --arg before "$source_before" \
                --arg sha "$source_baseline_sha" \
                '{production_fingerprint:$fingerprint,production_decision:"RECOVERY_REQUIRED",production_reason:$reason,baseline_source_event:$event,baseline_source_actor:$actor,baseline_source_before:$before,baseline_source_sha:$sha}')"
              recovery_key="production:guard-reconciliation:$current_fingerprint:$failed_run_id"
              echo "Enqueueing a new, idempotent audit task for stale-guard failure $failed_run_id; historical task $failed_task_id remains unchanged."
              printf '%s' "$GH_TOKEN" | python3 scripts/task_scheduler.py --repository "$REPO" --branch main --token-stdin --idempotency-key "$recovery_key" --priority 100 --input-json "$recovery_input" enqueue-auto-sync
              echo "block_manifest=true" >> "$GITHUB_OUTPUT"
              exit 0
            done < <(jq -r --arg fingerprint "$current_fingerprint" '
              [.tasks[] | select(
                .target_program_id == "workflow_auto_sync"
                and .status == "DEAD_LETTER"
                and .verification.status == "failed"
                and .last_error.type == "workflow_run_failed"
                and .input.production_fingerprint == $fingerprint
                and (.last_error.evidence.run_id | type == "number")
              )]
              | sort_by(.created_at) | reverse | .[:20][]
              | [.task_id, (.last_error.evidence.run_id | tostring)] | @tsv
            ' "$AUTOMATION_QUEUE_SNAPSHOT")
          fi

          last_success_sha="$(jq -r '[.workflow_runs[] | select(.head_branch == "main" and .conclusion == "success")] | sort_by(.created_at) | last | .head_sha // empty' <<< "$runs")"

          last_success_fingerprint=""
          heartbeat_at=""
          if [ -s reports/automation/heartbeat.json ]; then
            last_success_fingerprint="$(jq -r '.post_run_input_fingerprint // .input_fingerprint // empty' reports/automation/heartbeat.json)"
            heartbeat_at="$(jq -r '.recorded_at_utc // empty' reports/automation/heartbeat.json)"
          fi

          paths_json='[]'
          if [ -n "$last_success_sha" ] && [ "$last_success_sha" != "$current_sha" ]; then
            compare_json="$(gh api "repos/$REPO/compare/$last_success_sha...$current_sha" 2>/dev/null || true)"
            if [ -z "$compare_json" ] || ! jq -e '.status == "ahead" and (.files | type == "array")' <<< "$compare_json" >/dev/null; then
              paths_json='["__compare_unavailable__"]'
            else
              paths_json="$(jq -c --slurpfile manifest automation/production_inputs.json '[.files[] | . as $file | select($file.status != "removed" or (($manifest[0].production_input_paths | index($file.filename)) != null)) | $file.filename]' <<< "$compare_json")"
            fi
          fi

          # Control-plane governance files are reviewed and classified in the
          # Watchdog inbox. They must not create policy-production demand by
          # themselves. An exact path explicitly listed as a production input
          # always wins over this classification.
          paths_json="$(jq -c \
            --slurpfile ledger automation/unregistered_path_registry.json \
            --slurpfile manifest automation/production_inputs.json \
            'map(select(. as $path |
              (($manifest[0].production_input_paths | index($path)) != null) or
              ([
                $ledger[0].entries[]
                | select(
                    .status == "CLASSIFIED_CONTROL_PLANE" or
                    .status == "CLASSIFIED_MONITORING" or
                    .status == "CLASSIFIED_DOCUMENTATION"
                  )
                | .path
              ] | index($path) == null)
            ))' <<< "$paths_json")"

          current_fingerprint="$(python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from production_intent import load_manifest, compute_fingerprint
          manifest = load_manifest(Path("automation/production_inputs.json"))
          print(compute_fingerprint(Path("."), manifest))
          PY
          )"
          active_fingerprints="$(CURRENT_PRODUCTION_FINGERPRINT="$current_fingerprint" python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from production_intent import active_production_fingerprints
          queue = json.loads(Path(os.environ["AUTOMATION_QUEUE_SNAPSHOT"]).read_text(encoding="utf-8"))
          print(json.dumps(active_production_fingerprints(queue, os.environ["CURRENT_PRODUCTION_FINGERPRINT"])))
          PY
          )"
          successful_fingerprints="$(jq -c '[.tasks[] | select(.status == "SUCCEEDED" and .verification.status == "passed") | .input.production_fingerprint // empty] | map(select(type == "string")) | unique' "$AUTOMATION_QUEUE_SNAPSHOT")"

          intent_json="$(python3 scripts/production_intent.py \
            --event "$ORIGIN_EVENT" \
            --revision "$ORIGIN_SHA" \
            --paths-json "$paths_json" \
            --last-success-fingerprint "$last_success_fingerprint" \
            --last-success-at "$heartbeat_at" \
            --active-fingerprints-json "$active_fingerprints" \
            --successful-fingerprints-json "$successful_fingerprints")"
          decision="$(jq -r '.decision' <<< "$intent_json")"
          fingerprint="$(jq -r '.fingerprint' <<< "$intent_json")"
          echo "$intent_json" >> "$GITHUB_STEP_SUMMARY"

          # Automatic production dispatch is an explicit control-plane switch.
          # Missing or invalid settings fail closed. The one-shot manual path
          # above remains available only through an explicit user authorization.
          production_dispatch_mode="$(jq -r '.dispatch_mode // "hold"' automation/production_control.json)"
          if [ "$production_dispatch_mode" != "enabled" ]; then
            production_dispatch_mode="hold"
          fi

          case "$decision" in
            INPUT_CHANGED|SCHEDULE_DUE)
              if [ "$production_dispatch_mode" != "enabled" ]; then
                echo "Production demand detected ($decision), but automatic dispatch is held by automation/production_control.json." >> "$GITHUB_STEP_SUMMARY"
                echo "No production task was enqueued. Explicit one-shot user authorization remains available through the Watchdog manual control."
                echo "block_manifest=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "Production is required: $decision ($fingerprint)."
              audit_input_json="$(jq -cn --arg fingerprint "$fingerprint" --arg decision "$decision" --arg reason "$(jq -r '.reason' <<< "$intent_json")" --arg event "$ORIGIN_EVENT" --arg actor "$ORIGIN_ACTOR" --arg before "$ORIGIN_BEFORE" --arg sha "$ORIGIN_SHA" '{production_fingerprint:$fingerprint,production_decision:$decision,production_reason:$reason,baseline_source_event:$event,baseline_source_actor:$actor,baseline_source_before:$before,baseline_source_sha:$sha}')"
              production_key="$(jq -r '.idempotency_key' <<< "$intent_json")"
              printf '%s' "$GH_TOKEN" | python3 scripts/task_scheduler.py --repository "$REPO" --branch main --token-stdin --idempotency-key "$production_key" --priority 100 --input-json "$audit_input_json" enqueue-auto-sync
              echo "block_manifest=true" >> "$GITHUB_OUTPUT"
              ;;
            REVIEW_REQUIRED)
              echo "Production was not dispatched: unregistered paths are being recorded in the Watchdog inbox."
              echo "block_manifest=true" >> "$GITHUB_OUTPUT"
              unknown_paths="$(jq -c '.path_classification.unknown_changes // []' <<< "$intent_json")"
              # Unknown paths are reported through an issue; the automation never writes a repository registry.
              title="Production input classification requires review"
              issue="$(gh issue list --repo "$REPO" --state open --search "$title in:title" --json number --jq '.[0].number')"
              body="$(printf 'These paths are not registered as ruleset production inputs. They remain excluded from automatic production until reviewed. No repository registry was modified.\\n\\nPaths: %s\\n\\nRun: %s' "$unknown_paths" "$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID")"
              if [ -n "$issue" ] && [ "$issue" != "null" ]; then
                gh issue comment "$issue" --repo "$REPO" --body "$body"
              else
                gh issue create --repo "$REPO" --title "$title" --body "$body"
              fi
              ;;
            IN_PROGRESS|WAIT_FOR_ACTIVE|ALREADY_SATISFIED|OBSERVE_ONLY)
              echo "No production task required: $decision."
              echo "block_manifest=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unexpected production intent decision: $decision" >&2
              exit 1
              ;;
          esac

  assessment-canary:
    needs: [health-check]
    if: ${{ false }} # Disabled: the legacy marker-triggered path bypasses trusted one-shot authorization and the capability release manifest.
    concurrency:
      group: shadowrocket-main-writer
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      issues: write
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout current main without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python for the bounded capability canary
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Enqueue one explicitly bounded assessment task with a temporary canary override
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path
          from datetime import datetime, timezone

          sys.path.insert(0, "scripts")
          from remote_task_queue_runtime import make_store, enqueue_remote

          root = Path(".")
          marker = json.loads((root / "automation/assessment_canary_request.json").read_text(encoding="utf-8"))
          if marker.get("schema_version") != 1:
              raise SystemExit("Unsupported assessment canary request schema.")
          expected_config = marker.get("expected_config_blob_sha")
          expected_domains = marker.get("expected_domain_sources_blob_sha")
          for path, expected in (
              ("modules/uu.conf", expected_config),
              ("sources/domain_sources.json", expected_domains),
          ):
              actual = subprocess.check_output(["git", "rev-parse", f"HEAD:{path}"], text=True).strip()
              if actual != expected:
                  raise SystemExit(f"Canary baseline changed; refusing to run: {path}")

          registry = json.loads((root / "automation/program_registry.json").read_text(encoding="utf-8"))
          adapters = json.loads((root / "automation/execution_adapters.json").read_text(encoding="utf-8"))
          program = next(item for item in registry["programs"] if item["id"] == "script_assess_sources")
          adapter = next(item for item in adapters["adapters"] if item["target_program_id"] == "script_assess_sources")
          if program["orchestration"].get("enabled") is not False or adapter.get("enabled") is not False:
              raise SystemExit("Main-branch adapter is expected to remain disabled; canary override refused.")
          program["orchestration"].update({
              "enabled": True,
              "allowed_callers": ["workflow_automation_watchdog"],
              "max_attempts": 1,
              "timeout_seconds": 480,
          })
          adapter["enabled"] = True
          adapter["allowed_callers"] = ["workflow_automation_watchdog"]

          temp = Path(os.environ["RUNNER_TEMP"]) / "assessment-canary"
          temp.mkdir(parents=True, exist_ok=True)
          registry_path = temp / "program_registry.json"
          adapters_path = temp / "execution_adapters.json"
          registry_path.write_text(json.dumps(registry, ensure_ascii=False), encoding="utf-8")
          adapters_path.write_text(json.dumps(adapters, ensure_ascii=False), encoding="utf-8")

          store = make_store(os.environ["REPO"], "main", token=os.environ["GH_TOKEN"])
          queue = store.read().document
          lease = queue.get("resource_leases", {}).get("logical/production-pipeline")
          if isinstance(lease, dict) and lease.get("status") == "ACTIVE":
              expiry = datetime.fromisoformat(lease["expires_at"].replace("Z", "+00:00"))
              if expiry > datetime.now(timezone.utc):
                  raise SystemExit("Production pipeline resource is currently leased; canary did not start.")

          request_key = marker["idempotency_key"]
          existing = next((item for item in queue["tasks"] if item.get("idempotency_key") == request_key), None)
          if existing is None:
              result = enqueue_remote({
                  "idempotency_key": request_key,
                  "requester_program_id": "workflow_automation_watchdog",
                  "target_program_id": "script_assess_sources",
                  "capability": "source_assessment",
                  "priority": 100,
                  "input": marker["input"],
              }, store, registry)
              task = result["task"]
          else:
              task = existing
              if task.get("status") not in {"QUEUED", "SUCCEEDED"}:
                  raise SystemExit(f"Existing canary task is not safely reusable: {task.get('status')}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"task_id={task['task_id']}\n")
              output.write(f"registry_path={registry_path}\n")
              output.write(f"adapters_path={adapters_path}\n")
          print(json.dumps({"task_id": task["task_id"], "status": task["status"], "input": task["input"]}))
          PY
      - name: Run only the canary task through the Watchdog scheduler
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TASK_ID: ${{ steps.prepare.outputs.task_id }}
          REGISTRY_PATH: ${{ steps.prepare.outputs.registry_path }}
          ADAPTERS_PATH: ${{ steps.prepare.outputs.adapters_path }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | python3 scripts/task_scheduler.py \
            --repository "$REPO" --branch main --registry "$REGISTRY_PATH" \
            --adapters "$ADAPTERS_PATH" --worker-id "assessment-canary-$GITHUB_RUN_ID" \
            --task-id "$TASK_ID" --max-tasks 1 --token-stdin run-once | tee "$RUNNER_TEMP/assessment-canary-result.json"
      - name: Verify durable success, persistent publication, and protected baselines
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TASK_ID: ${{ steps.prepare.outputs.task_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          sys.path.insert(0, "scripts")
          from remote_task_queue_runtime import make_store

          marker = json.loads(Path("automation/assessment_canary_request.json").read_text(encoding="utf-8"))
          store = make_store(os.environ["REPO"], "main", token=os.environ["GH_TOKEN"])
          queue = store.read().document
          task = next((item for item in queue["tasks"] if item.get("task_id") == os.environ["TASK_ID"]), None)
          if task is None or task.get("status") != "SUCCEEDED":
              raise SystemExit(f"Canary task did not reach SUCCEEDED: {None if task is None else task.get('status')}")
          result = task.get("result") or {}
          if result.get("artifact_verification", {}).get("valid") is not True:
              raise SystemExit("Independent assessment artifact verification did not pass.")
          publication = result.get("artifact_publication") or {}
          if publication.get("published") is not True:
              raise SystemExit("Canary did not publish persistent assessment artifacts.")
          paths = publication.get("paths", [])
          if "reports/source-assessment.md" not in paths:
              raise SystemExit("Published commit is missing the assessment report.")
          if not any(path == "sources/source_assessments.json" or path == "sources/source_assessments.json.manifest.json" or path.startswith("sources/source_assessments.json.parts-") for path in paths):
              raise SystemExit("Published commit is missing persistent assessment history.")
          if any(path.startswith("data/source_assessments_runtime.json") or path == "modules/uu.conf" for path in paths):
              raise SystemExit("Canary attempted to publish an ephemeral or protected path.")
          commit = publication.get("commit_sha", "")
          if not commit:
              raise SystemExit("Artifact publication commit SHA is missing.")
          changed = subprocess.check_output(
              ["gh", "api", f"repos/{os.environ['REPO']}/commits/{commit}", "--jq", "[.files[].filename]"],
              text=True,
          )
          commit_paths = json.loads(changed)
          if sorted(commit_paths) != sorted(paths):
              raise SystemExit("Published commit file list does not match scheduler publication evidence.")
          for path, expected in (
              ("modules/uu.conf", marker["expected_config_blob_sha"]),
              ("sources/domain_sources.json", marker["expected_domain_sources_blob_sha"]),
          ):
              actual = subprocess.check_output(
                  ["gh", "api", f"repos/{os.environ['REPO']}/contents/{path}", "--jq", ".sha"],
                  text=True,
              ).strip()
              if actual != expected:
                  raise SystemExit(f"Protected baseline changed during canary: {path}")
          print(json.dumps({
              "task_id": task["task_id"], "status": task["status"],
              "artifact_verification": result["artifact_verification"],
              "artifact_publication": publication,
              "protected_config_unchanged": True,
              "domain_sources_unchanged": True,
          }, ensure_ascii=False))
          PY

  task-queue-supervision:
    concurrency:
      group: shadowrocket-watchdog-task-supervision
      cancel-in-progress: false
    env:
      GITHUB_ACTOR_ID: ${{ github.actor_id }}
      GITHUB_MANUAL_AUDIT_REQUEST: ${{ inputs.request_deterministic_audit }}
      PYTHONDONTWRITEBYTECODE: "1"
    needs: [health-check, stale-run-watch, manifest-integrity]
    if: ${{ always() && needs.health-check.result == 'success' && ((github.event_name != 'schedule' && github.event_name != 'workflow_dispatch') || needs.stale-run-watch.result == 'success') && (needs.manifest-integrity.result == 'success' || needs.manifest-integrity.result == 'skipped') && (github.event_name != 'workflow_run' || (github.event.workflow_run.head_branch == 'main' && (github.event.workflow_run.path == '.github/workflows/auto_sync.yml' || github.event.workflow_run.path == '.github/workflows/source-discovery.yml'))) && !(github.event_name == 'push' && contains(github.event.head_commit.message, '[assessment-canary]')) }}
    permissions:
      actions: write
      contents: read
      issues: write
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout scheduler code without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - name: Resolve source execution mode from production control
        id: source-mode
        run: |
          set -euo pipefail
          mode="$(jq -er '.source_discovery_mode | select(. == "independent" or . == "monolithic_fallback")' automation/production_control.json)"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - name: Set up Python for deterministic queue supervision
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Export current durable queue snapshot for supervision
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 scripts/remote_task_queue_runtime.py --repository "$GITHUB_REPOSITORY" --branch main snapshot --output "$RUNNER_TEMP/task_queue.json"
          echo "AUTOMATION_QUEUE_SNAPSHOT=$RUNNER_TEMP/task_queue.json" >> "$GITHUB_ENV"
      - name: Resolve completed Discovery run from durable task correlation
        id: resolve-discovery-run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SOURCE_DISCOVERY_MODE: ${{ steps.source-mode.outputs.mode }}
          AUTOMATION_QUEUE_SNAPSHOT: ${{ runner.temp }}/task_queue.json
          EVENT_SOURCE_RUN_ID: ${{ github.event.workflow_run.path == '.github/workflows/source-discovery.yml' && github.event.workflow_run.id || '' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys, urllib.request
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from source_handoff_policy import classify_assessment_handoff, discovery_task_requires_handoff
          if os.environ.get("SOURCE_DISCOVERY_MODE") != "independent":
              print("Independent source DAG is not selected; no Discovery reconciliation.")
              raise SystemExit(0)
          queue_path = Path(os.environ.get("AUTOMATION_QUEUE_SNAPSHOT") or (Path(os.environ["RUNNER_TEMP"]) / "task_queue.json"))
          queue = json.loads(queue_path.read_text(encoding="utf-8"))
          tasks = queue.get("tasks", [])
          handoff = None
          handoff_state = ""
          pending = []
          for task in tasks:
              if not discovery_task_requires_handoff(task, tasks):
                  continue
              intent = task.get("dispatch_intent") or {}
              correlation, requested_sha = intent.get("correlation_id"), intent.get("requested_head_sha")
              if isinstance(correlation, str) and correlation and isinstance(requested_sha, str) and len(requested_sha) == 40:
                  pending.append((task, correlation, requested_sha))
          pending.sort(key=lambda x: x[0].get("created_at", ""), reverse=True)
          assessment_tasks = [
              task for task in tasks
              if task.get("target_program_id") == "script_assess_sources"
              and task.get("status") == "QUEUED"
              and isinstance((task.get("input") or {}).get("predecessor"), dict)
          ]
          print(json.dumps({
              "queue_revision": queue.get("revision"),
              "queue_snapshot": str(queue_path),
              "discovery_tasks_needing_handoff": [item[0].get("task_id") for item in pending],
              "queued_assessment_tasks_needing_artifact_recovery": [item.get("task_id") for item in assessment_tasks],
          }))
          if not pending and not assessment_tasks:
              print("No completed or verifying Discovery task or queued Assessment task needs downstream reconciliation.")
              raise SystemExit(0)
          repo, token = os.environ["GITHUB_REPOSITORY"], os.environ["GITHUB_TOKEN"]
          resolved = None

          # A queued Assessment task already contains the exact predecessor run ID,
          # SHA and artifact digest. Resolve that immutable identity directly instead
          # of searching only the newest 100 workflow runs (which can omit older runs).
          for assessment_task in assessment_tasks:
              proof = (assessment_task.get("input") or {}).get("predecessor") or {}
              run_id = str(proof.get("workflow_run_id", ""))
              requested_sha = proof.get("workflow_head_sha")
              if (proof.get("program_id") != "script_discover_sources"
                      or proof.get("workflow_name") != "Shadowrocket Source Discovery (Watchdog)"
                      or proof.get("artifact_path") != "sources/discovered_sources.json"
                      or not run_id.isdigit()
                      or not isinstance(requested_sha, str)
                      or len(requested_sha) != 40
                      or not isinstance(proof.get("artifact_sha256"), str)
                      or len(proof.get("artifact_sha256")) != 64):
                  continue
              run_url = f"https://api.github.com/repos/{repo}/actions/runs/{run_id}"
              run_req = urllib.request.Request(run_url, headers={"Accept":"application/vnd.github+json","Authorization":"Bearer "+token,"X-GitHub-Api-Version":"2022-11-28","User-Agent":"Shadowrocket-Watchdog-Discovery-Reconciler/1.0"})
              with urllib.request.urlopen(run_req, timeout=30) as response:
                  run = json.loads(response.read(2_000_000).decode("utf-8"))
              if (run.get("path") != ".github/workflows/source-discovery.yml"
                      or run.get("event") != "workflow_dispatch"
                      or run.get("head_branch") != "main"
                      or run.get("head_sha") != requested_sha
                      or run.get("status") != "completed"
                      or run.get("conclusion") != "success"):
                  raise SystemExit("Queued Assessment predecessor does not resolve to its exact successful Discovery run.")
              artifact_url = f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100"
              artifact_req = urllib.request.Request(artifact_url, headers={"Accept":"application/vnd.github+json","Authorization":"Bearer "+token,"X-GitHub-Api-Version":"2022-11-28","User-Agent":"Shadowrocket-Watchdog-Discovery-Reconciler/1.0"})
              with urllib.request.urlopen(artifact_req, timeout=30) as response:
                  artifacts = json.loads(response.read(2_000_000).decode("utf-8")).get("artifacts", [])
              exact = [a for a in artifacts if a.get("name") == "source-discovery-output" and a.get("expired") is False
                  and str((a.get("workflow_run") or {}).get("id")) == run_id
                  and (a.get("workflow_run") or {}).get("head_sha") == requested_sha]
              if len(exact) != 1:
                  raise SystemExit("The exact successful Discovery run must have exactly one unexpired source-discovery-output artifact.")
              handoff = classify_assessment_handoff(tasks, run_id)
              handoff_state = handoff["state"]
              resolved = (assessment_task, run)
              break

          if resolved is None and pending:
              import sys
              sys.path.insert(0, "scripts")
              from github_workflow_adapter import GitHubWorkflowClient, expected_correlation_titles, validate_run_head_sha
              workflow_client = GitHubWorkflowClient(repo, token)
              event_run_id = os.environ.get("EVENT_SOURCE_RUN_ID", "").strip()

              # A verified task result contains the exact workflow run ID and actual
              # run SHA. Prefer it over a list query, which may be delayed or omit
              # the task's queue-intent commit from a strict requested-SHA comparison.
              for task, correlation, requested_sha in pending:
                  intent = task.get("dispatch_intent") or {}
                  evidence = (task.get("result") or {}).get("run_evidence")
                  if not isinstance(evidence, dict):
                      continue
                  run_id_value = evidence.get("run_id")
                  if isinstance(run_id_value, bool) or not isinstance(run_id_value, int) or run_id_value <= 0:
                      continue
                  run_id = str(run_id_value)
                  if event_run_id and run_id != event_run_id:
                      continue
                  run = workflow_client.get_run(run_id_value)
                  if (run.get("path") != ".github/workflows/source-discovery.yml"
                          or run.get("workflow_id") != intent.get("workflow_id")
                          or run.get("event") != "workflow_dispatch"
                          or run.get("head_branch") != "main"
                          or run.get("display_title") not in expected_correlation_titles(intent)):
                      raise SystemExit("Persisted Discovery run evidence does not match the exact task correlation.")
                  relationship = validate_run_head_sha(workflow_client, intent, run.get("head_sha"))
                  if (evidence.get("head_sha") != run.get("head_sha")
                          or evidence.get("head_sha_relationship") != relationship
                          or evidence.get("status") != run.get("status")
                          or evidence.get("conclusion") != run.get("conclusion")):
                      raise SystemExit("Persisted Discovery run evidence changed or failed SHA relationship verification.")
                  if run.get("status") != "completed" or run.get("conclusion") != "success":
                      continue
                  artifact_url = f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100"
                  artifact_req = urllib.request.Request(artifact_url, headers={"Accept":"application/vnd.github+json","Authorization":"Bearer "+token,"X-GitHub-Api-Version":"2022-11-28","User-Agent":"Shadowrocket-Watchdog-Discovery-Reconciler/1.0"})
                  with urllib.request.urlopen(artifact_req, timeout=30) as response:
                      artifacts = json.loads(response.read(2_000_000).decode("utf-8")).get("artifacts", [])
                  exact = [a for a in artifacts if a.get("name") == "source-discovery-output" and a.get("expired") is False
                      and str((a.get("workflow_run") or {}).get("id")) == run_id
                      and (a.get("workflow_run") or {}).get("head_sha") == run.get("head_sha")]
                  if len(exact) != 1:
                      raise SystemExit("The exact successful Discovery run must have exactly one unexpired source-discovery-output artifact.")
                  handoff = classify_assessment_handoff(tasks, run_id)
                  handoff_state = handoff["state"]
                  resolved = (task, run)
                  break

          if resolved is None and pending:
              import sys
              sys.path.insert(0, "scripts")
              from github_workflow_adapter import GitHubWorkflowClient, expected_correlation_titles, validate_run_head_sha
              workflow_client = GitHubWorkflowClient(repo, token)
              workflow_id = (pending[0][0].get("dispatch_intent") or {}).get("workflow_id")
              if isinstance(workflow_id, bool) or not isinstance(workflow_id, int):
                  raise SystemExit("Pending Discovery task has no reviewed workflow ID.")
              runs, page = [], 1
              while page <= 20:
                  page_data = workflow_client.list_runs(workflow_id, "main", page)
                  page_runs = page_data.get("workflow_runs", [])
                  if not isinstance(page_runs, list):
                      raise SystemExit("Discovery workflow run history response is malformed.")
                  runs.extend(page_runs)
                  if len(page_runs) < 100:
                      break
                  page += 1
              if page > 20:
                  raise SystemExit("Discovery workflow run history exceeds the bounded 2,000-run reconciliation window; refusing incomplete handoff.")
              for task, correlation, requested_sha in pending:
                  intent = task.get("dispatch_intent") or {}
                  candidates = [run for run in runs if run.get("path") == ".github/workflows/source-discovery.yml"
                      and run.get("workflow_id") == intent.get("workflow_id")
                      and run.get("event") == "workflow_dispatch" and run.get("head_branch") == "main"
                      and run.get("display_title") in expected_correlation_titles(intent)]
                  if len(candidates) > 1:
                      raise SystemExit("More than one workflow run matches the exact Discovery task correlation; refusing ambiguous handoff.")
                  if not candidates:
                      continue
                  listed = candidates[0]
                  run_id_value = listed.get("id")
                  if isinstance(run_id_value, bool) or not isinstance(run_id_value, int):
                      raise SystemExit("Matched Discovery workflow run has an invalid numeric run ID.")
                  run = workflow_client.get_run(run_id_value)
                  relationship = validate_run_head_sha(workflow_client, intent, run.get("head_sha"))
                  if (run.get("path") != ".github/workflows/source-discovery.yml"
                          or run.get("workflow_id") != intent.get("workflow_id")
                          or run.get("event") != "workflow_dispatch"
                          or run.get("head_branch") != "main"
                          or run.get("display_title") not in expected_correlation_titles(intent)
                          or run.get("head_sha") != listed.get("head_sha")):
                      raise SystemExit("Matched Discovery run changed identity between list and detail reads.")
                  if run.get("status") != "completed" or run.get("conclusion") != "success":
                      continue
                  run_id = str(run["id"])
                  artifact_url = f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100"
                  artifact_req = urllib.request.Request(artifact_url, headers={"Accept":"application/vnd.github+json","Authorization":"Bearer "+token,"X-GitHub-Api-Version":"2022-11-28","User-Agent":"Shadowrocket-Watchdog-Discovery-Reconciler/1.0"})
                  with urllib.request.urlopen(artifact_req, timeout=30) as response:
                      artifacts = json.loads(response.read(2_000_000).decode("utf-8")).get("artifacts", [])
                  exact = [a for a in artifacts if a.get("name") == "source-discovery-output" and a.get("expired") is False
                      and str((a.get("workflow_run") or {}).get("id")) == run_id
                      and (a.get("workflow_run") or {}).get("head_sha") == run.get("head_sha")]
                  if len(exact) != 1:
                      raise SystemExit("The exact successful Discovery run must have exactly one unexpired source-discovery-output artifact.")
                  handoff = classify_assessment_handoff(tasks, run_id)
                  handoff_state = handoff["state"]
                  resolved = (task, run)
                  break
          if resolved is None:
              if pending or assessment_tasks:
                  handoff_state = "awaiting_discovery_run" if pending else "awaiting_assessment_predecessor"
                  with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                      output.write(f"handoff_state={handoff_state}\n")
                  with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                      summary.write("A durable Discovery/Assessment task exists, but its exact successful predecessor run is not yet verifiable; replacement Discovery dispatch is held.\\n")
                  print(json.dumps({"resolved":False,"handoff_state":handoff_state}))
              else:
                  print("No completed or verifying Discovery task or queued Assessment task needs downstream reconciliation.")
              raise SystemExit(0)
          task, run = resolved
          run_id, head_sha = str(run["id"]), str(run["head_sha"])
          handoff_state = handoff_state or "ready"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"run_id={run_id}\nhead_sha={head_sha}\ntask_id={task['task_id']}\nhandoff_state={handoff_state}\n")
              output.write("assessment_task_ids=" + ",".join(handoff.get("task_ids", [])) + "\n")
              output.write("duplicate_assessment_task_ids=" + ",".join(handoff.get("duplicate_task_ids", [])) + "\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"Resolved Discovery task {task['task_id']} to exact run {run_id}; assessment handoff state: {handoff_state}.\\n")
              if handoff and handoff.get("duplicate_task_ids"):
                  summary.write("Historical duplicate Assessment task IDs: " + ", ".join(handoff["duplicate_task_ids"]) + "\\n")
          print(json.dumps({"resolved":True,"task_id":task["task_id"],"run_id":run_id,"head_sha":head_sha,"handoff_state":handoff_state,"assessment_task_ids":handoff.get("task_ids",[]),"duplicate_assessment_task_ids":handoff.get("duplicate_task_ids",[])}))
          PY
      - name: Download artifact from the exact discovery workflow run
        if: ${{ steps.resolve-discovery-run.outputs.run_id != '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: source-discovery-output
          run-id: ${{ steps.resolve-discovery-run.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/source-discovery-output

      - name: Verify immutable discovery artifact against producer run and current main
        if: ${{ steps.resolve-discovery-run.outputs.run_id != '' }}
        env:
          SOURCE_RUN_ID: ${{ steps.resolve-discovery-run.outputs.run_id }}
          SOURCE_HEAD_SHA: ${{ steps.resolve-discovery-run.outputs.head_sha }}
          SOURCE_WORKFLOW_NAME: Shadowrocket Source Discovery (Watchdog)
          SOURCE_ARTIFACT_DIR: ${{ runner.temp }}/source-discovery-output
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from json_document_store import read_document
          from task_scheduler import read_only_resource_digests
          root = Path(os.environ["SOURCE_ARTIFACT_DIR"])
          proof_files = list(root.rglob("source-discovery-proof.json"))
          source_files = list(root.rglob("discovered_sources.json"))
          manifest_files = list(root.rglob("discovered_sources.json.manifest.json"))
          if len(proof_files) != 1 or len(source_files) > 1 or len(manifest_files) > 1 or (not source_files and not manifest_files):
              raise SystemExit("The exact discovery run must contain one provenance proof and one legacy or sharded discovery document.")
          logical_file = source_files[0] if source_files else manifest_files[0]
          artifact_root = logical_file.parent.parent
          proof = json.loads(proof_files[0].read_text(encoding="utf-8"))
          expected = {
              "workflow_name": os.environ["SOURCE_WORKFLOW_NAME"],
              "workflow_run_id": os.environ["SOURCE_RUN_ID"],
              "workflow_head_sha": os.environ["SOURCE_HEAD_SHA"],
              "artifact_path": "sources/discovered_sources.json",
          }
          if any(proof.get(key) != value for key, value in expected.items()):
              raise SystemExit("Discovery artifact provenance does not match the completed producer run.")
          artifact_digest = read_only_resource_digests(artifact_root, [expected["artifact_path"]])[expected["artifact_path"]]
          if artifact_digest != proof.get("artifact_sha256"):
              raise SystemExit("Downloaded discovery artifact digest does not match its immutable proof.")
          artifact_document = read_document(artifact_root / expected["artifact_path"], "candidates", {"candidates": []})
          if artifact_document.get("producer") != {
              "workflow_name": expected["workflow_name"],
              "workflow_run_id": expected["workflow_run_id"],
              "workflow_head_sha": expected["workflow_head_sha"],
          }:
              raise SystemExit("Discovery document producer metadata is inconsistent.")
          # Discovery output is runner-local and artifact-only. Producer identity
          # and content digest above are the provenance boundary; no sources/ commit is required.
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as stream:
              stream.write(f"SOURCE_ARTIFACT_SHA256={artifact_digest}\n")
              stream.write(f"AUTOMATION_PREDECESSOR_ARTIFACT_ROOT={root}\n")
          PY

      - name: Enqueue source assessment after successful discovery workflow
        if: ${{ steps.resolve-discovery-run.outputs.run_id != '' && steps.resolve-discovery-run.outputs.handoff_state == 'ready' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SOURCE_DISCOVERY_MODE: ${{ steps.source-mode.outputs.mode }}
          SOURCE_RUN_ID: ${{ steps.resolve-discovery-run.outputs.run_id }}
          SOURCE_HEAD_SHA: ${{ steps.resolve-discovery-run.outputs.head_sha }}
          SOURCE_WORKFLOW_NAME: Shadowrocket Source Discovery (Watchdog)
        run: |
          set -euo pipefail
          if [ "$SOURCE_DISCOVERY_MODE" != "independent" ]; then
            echo "Independent source DAG is not selected; monolithic auto_sync remains authoritative."
            exit 0
          fi
          assessment_adapter="$(jq -r '[.adapters[] | select(.target_program_id == "script_assess_sources")][0].enabled // false' automation/execution_adapters.json)"
          assessment_program="$(jq -r '[.programs[] | select(.id == "script_assess_sources")][0].orchestration.enabled // false' automation/program_registry.json)"
          assessment_adapter_caller="$(jq -r '[.adapters[] | select(.target_program_id == "script_assess_sources")][0].allowed_callers | index("workflow_automation_watchdog") != null' automation/execution_adapters.json)"
          assessment_program_caller="$(jq -r '[.programs[] | select(.id == "script_assess_sources")][0].orchestration.allowed_callers | index("workflow_automation_watchdog") != null' automation/program_registry.json)"
          if [ "$assessment_adapter" != "true" ] || [ "$assessment_program" != "true" ] || [ "$assessment_adapter_caller" != "true" ] || [ "$assessment_program_caller" != "true" ]; then
            echo "Assessment adapter/program authorization is not fully enabled; refusing partial DAG activation."
            exit 0
          fi
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" git fetch --no-tags origin main
          git reset --hard origin/main
          test "$(jq -r '.dispatch_mode' automation/production_control.json)" = "enabled"
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [ "$current_main" != "$(git rev-parse HEAD)" ]; then
            echo "Watchdog checkout is stale; source assessment enqueue is deferred to the next reconciliation."
            exit 0
          fi
          artifact_sha="${SOURCE_ARTIFACT_SHA256:-}"
          if [[ ! "$artifact_sha" =~ ^[0-9a-f]{64}$ ]]; then
            echo "A verified immutable discovery artifact digest is required."
            exit 1
          fi
          predecessor="$(jq -cn             --arg program_id "script_discover_sources"             --arg workflow_name "$SOURCE_WORKFLOW_NAME"             --arg run_id "$SOURCE_RUN_ID"             --arg head_sha "$SOURCE_HEAD_SHA"             --arg artifact_path "sources/discovered_sources.json"             --arg artifact_sha256 "$artifact_sha"             '{program_id:$program_id,workflow_name:$workflow_name,workflow_run_id:$run_id,workflow_head_sha:$head_sha,artifact_path:$artifact_path,artifact_sha256:$artifact_sha256}')"
          task_input="$(jq -cn --argjson predecessor "$predecessor"             '{max_urls:20,max_file_bytes:1000000,max_total_bytes:10000000,predecessor:$predecessor}')"
          queue_token="$GITHUB_TOKEN"
          unset GITHUB_TOKEN
          printf '%s' "$queue_token" | python3 scripts/task_scheduler.py             --repository "$GITHUB_REPOSITORY" --branch main --token-stdin             --idempotency-key "source-assessment:$SOURCE_RUN_ID"             --priority 60 --input-json "$task_input" enqueue-source-assessment
          unset queue_token

      - name: Enqueue independent source discovery only after its authorization gate opens
        if: ${{ steps.resolve-discovery-run.outputs.run_id == '' && steps.resolve-discovery-run.outputs.handoff_state == '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SOURCE_DISCOVERY_MODE: ${{ steps.source-mode.outputs.mode }}
          AUTOMATION_QUEUE_SNAPSHOT: ${{ runner.temp }}/task_queue.json
        run: |
          set -euo pipefail
          test "$SOURCE_DISCOVERY_MODE" = "independent" || exit 0
          test "$(jq -r '.dispatch_mode' automation/production_control.json)" = "enabled" || exit 0
          adapter_enabled="$(jq -r '[.adapters[] | select(.target_program_id == "workflow_source_discovery")][0].enabled // false' automation/execution_adapters.json)"
          program_enabled="$(jq -r '[.programs[] | select(.id == "workflow_source_discovery")][0].orchestration.enabled // false' automation/program_registry.json)"
          adapter_caller_allowed="$(jq -r '[.adapters[] | select(.target_program_id == "workflow_source_discovery")][0].allowed_callers | index("workflow_automation_watchdog") != null' automation/execution_adapters.json)"
          program_caller_allowed="$(jq -r '[.programs[] | select(.id == "workflow_source_discovery")][0].orchestration.allowed_callers | index("workflow_automation_watchdog") != null' automation/program_registry.json)"
          assessment_adapter_enabled="$(jq -r '[.adapters[] | select(.target_program_id == "script_assess_sources")][0].enabled // false' automation/execution_adapters.json)"
          assessment_program_enabled="$(jq -r '[.programs[] | select(.id == "script_assess_sources")][0].orchestration.enabled // false' automation/program_registry.json)"
          assessment_adapter_caller="$(jq -r '[.adapters[] | select(.target_program_id == "script_assess_sources")][0].allowed_callers | index("workflow_automation_watchdog") != null' automation/execution_adapters.json)"
          assessment_program_caller="$(jq -r '[.programs[] | select(.id == "script_assess_sources")][0].orchestration.allowed_callers | index("workflow_automation_watchdog") != null' automation/program_registry.json)"
          if [ "$adapter_enabled" != "true" ] || [ "$program_enabled" != "true" ] || [ "$adapter_caller_allowed" != "true" ] || [ "$program_caller_allowed" != "true" ] || [ "$assessment_adapter_enabled" != "true" ] || [ "$assessment_program_enabled" != "true" ] || [ "$assessment_adapter_caller" != "true" ] || [ "$assessment_program_caller" != "true" ]; then
            echo "Independent source discovery remains dormant until adapter, orchestration and caller gates are all enabled."
            exit 0
          fi
          discovery_day="$(date -u +%F)"
          base_key="source-discovery:$discovery_day"
          base_status="$(jq -r --arg key "$base_key" '[.tasks[]? | select(.idempotency_key == $key)] | last | .status // ""' "$AUTOMATION_QUEUE_SNAPSHOT")"
          recovery_key="$(jq -r --arg prefix "$base_key:recovery:" '[.tasks[]? | select((.idempotency_key // "") | startswith($prefix))] | last | .idempotency_key // ""' "$AUTOMATION_QUEUE_SNAPSHOT")"
          if [ -n "$recovery_key" ]; then
            idempotency_key="$recovery_key"
          elif [ "$base_status" = "DEAD_LETTER" ]; then
            idempotency_key="$base_key:recovery:1"
          else
            idempotency_key="$base_key"
          fi
          echo "Source Discovery idempotency key: $idempotency_key (base status: ${base_status:-none})"
          queue_token="$GITHUB_TOKEN"
          unset GITHUB_TOKEN
          printf '%s' "$queue_token" | python3 scripts/task_scheduler.py --repository "$GITHUB_REPOSITORY" --branch main --token-stdin --idempotency-key "$idempotency_key" --priority 55 enqueue-source-discovery
          unset queue_token

      - name: Recover leases, verify results, and run one bounded task
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: main
          AUTOMATION_ARTIFACT_ROOT: ${{ runner.temp }}/source-assessment-output
        run: |
          set -euo pipefail
          rm -rf "$AUTOMATION_ARTIFACT_ROOT"
          mkdir -p "$AUTOMATION_ARTIFACT_ROOT"
          queue_token="$GITHUB_TOKEN"
          unset GITHUB_TOKEN
          printf '%s' "$queue_token" | python3 scripts/task_scheduler.py --token-stdin --repository "$GITHUB_REPOSITORY" --branch main --max-tasks 1 run-once | tee /tmp/task-scheduler-report.json
          unset queue_token
          cat /tmp/task-scheduler-report.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload verified source assessment outputs as immutable artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-assessment-output
          path: ${{ runner.temp }}/source-assessment-output/
          if-no-files-found: ignore
          retention-days: 30

  stale-run-watch:
    permissions:
      actions: write
      contents: read
      issues: write
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout watchdog recovery policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python for bounded recovery
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Cancel superseded or stalled audits and recover current main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/$REPO/commits/main" --jq .sha)"
          runs="$(gh api --paginate --slurp "repos/$REPO/actions/workflows/auto_sync.yml/runs?per_page=100" | jq '{workflow_runs: [.[].workflow_runs[]]}')"

          stale_lines="$(jq -r --arg sha "$current_main" '
            .workflow_runs[]
            | select(.status != "completed" and .head_branch == "main" and .id != null)
            | if .head_sha != $sha then [.id, "superseded", (.head_sha // "")]
              else
                ((.run_started_at // .created_at // "") | try fromdateiso8601 catch null) as $started
                | select($started != null and (now - $started) > 21600)
                | [.id, "timeout", (.head_sha // "")]
              end
            | @tsv
          ' <<< "$runs")"

          timed_out_any=0
          timed_out_run_id=""
          if [ -n "$stale_lines" ]; then
            while read -r stale_id reason run_sha; do
              [ -n "$stale_id" ] || continue
              if [ "$reason" = "superseded" ]; then
                compare_json="$(gh api "repos/$REPO/compare/$run_sha...$current_main" 2>/dev/null || true)"
                if [ -z "$compare_json" ] || ! jq -e '.status == "ahead" and (.files | type == "array")' <<< "$compare_json" >/dev/null; then
                  echo "Could not safely classify changes after audit $stale_id; leaving it active for the publish-base guard."
                  continue
                fi
                compare_file="$RUNNER_TEMP/audit-compare-$stale_id.json"
                printf '%s' "$compare_json" > "$compare_file"
                if GITHUB_SHA="$run_sha" COMPARE_JSON_FILE="$compare_file" bash scripts/verify_publish_base.sh --check-only; then
                  echo "Audit $stale_id remains publishable: only docs/ changed after its audited commit, or only strictly verified queue-state commits changed."
                  continue
                fi
              fi
              echo "Cancelling audit $stale_id ($reason); current main is $current_main."
              gh run cancel "$stale_id" --repo "$REPO" || true
              if [ "$reason" = "timeout" ]; then timed_out_any=1; timed_out_run_id="$stale_id"; fi
            done <<< "$stale_lines"
            sleep 10
            runs="$(gh api --paginate --slurp "repos/$REPO/actions/workflows/auto_sync.yml/runs?per_page=100" | jq '{workflow_runs: [.[].workflow_runs[]]}')"
          fi

          active_count="$(jq '[.workflow_runs[] | select(.head_branch == "main" and .status != "completed")] | length' <<< "$runs")"
          if [ "$active_count" -gt 0 ]; then
            echo "An audit is still queued, cancelling, or running; no replacement will be dispatched."
            exit 0
          fi

          # Normal input-change and scheduled-refresh decisions are centralized
          # in health-check. This job may enqueue only a bounded timeout recovery.
          if [ "$timed_out_any" = "1" ]; then
            decision="$(python3 scripts/watchdog_recovery_policy.py --source-run-id 0 --source-sha "$current_main" <<< "$runs")"
            echo "$decision" | jq -r '"Timeout recovery policy: " + .reason + "; prior retryable failures=" + (.prior_retryable_failures|tostring) + "; prior deterministic failures=" + (.prior_non_retryable_failures|tostring) + "."'
            if [ "$(jq -r '.allowed' <<< "$decision")" != "true" ]; then
              echo "$decision" >> "$GITHUB_STEP_SUMMARY"
              echo "Timeout recovery suppressed by bounded recovery policy."
            else
              checkout_sha="$(git rev-parse HEAD)"
              if [ "$checkout_sha" != "$current_main" ]; then
                echo "Watchdog checkout is behind current main; timeout recovery will be reconsidered on the next reconciliation."
                exit 0
              fi
              current_fingerprint="$(python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from production_intent import load_manifest, compute_fingerprint
          manifest = load_manifest(Path("automation/production_inputs.json"))
          print(compute_fingerprint(Path("."), manifest))
          PY
          )"
              recovery_input="$(jq -cn --arg fingerprint "$current_fingerprint" --arg reason "bounded recovery after watchdog cancellation of a timed-out audit" '{production_fingerprint:$fingerprint,production_decision:"RECOVERY_REQUIRED",production_reason:$reason}')"
              dispatch_mode="$(jq -r 'if type == "object" and .schema_version == 1 and (.dispatch_mode == "enabled" or .dispatch_mode == "hold") then .dispatch_mode else "hold" end' automation/production_control.json 2>/dev/null || printf 'hold')"
              if [ "$dispatch_mode" = "enabled" ]; then
                printf '%s' "$GH_TOKEN" | python3 scripts/task_scheduler.py --repository "$REPO" --branch main --token-stdin --idempotency-key "production:recovery:$current_fingerprint:$timed_out_run_id" --priority 100 --input-json "$recovery_input" enqueue-auto-sync
              else
                echo "HOLD: timed-out-run recovery enqueue suppressed." >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
          fi

          if [ "$timed_out_any" = "1" ]; then
            title="Self-healing incident: stalled audit"
            existing="$(gh issue list --repo "$REPO" --state open --search "stalled audit in:title" --json number --jq '.[0].number')"
            body_text="$(printf 'The watchdog cancelled an audit that exceeded six hours and queued a replacement on current main %s.\\n' "$current_main")"
            if [ -n "$existing" ] && [ "$existing" != "null" ]; then
              gh issue comment "$existing" --repo "$REPO" --body "$body_text"
            else
              gh issue create --repo "$REPO" --title "$title" --body "$body_text"
            fi
          fi

  manifest-integrity:
    needs: [health-check]
    concurrency:
      group: shadowrocket-main-writer
      cancel-in-progress: false
    if: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '30 22 * * *')) && needs.health-check.outputs.block_manifest != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      actions: write
      contents: write
      issues: write
    steps:
      - name: Checkout current main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Reconcile manifest metadata from committed rule files
        id: refresh
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 scripts/refresh_ruleset_manifest.py

      - name: Publish manifest-only metadata repair
        id: publish
        if: ${{ steps.refresh.outcome == 'success' }}
        run: |
          set -euo pipefail
          if git diff --quiet -- rulesets/manifest.json; then
            echo "Manifest metadata already matches the committed rule files and active reviewer."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- rulesets/manifest.json
          git diff --cached --check
          git commit -m "Reconcile published RULE-SET manifest metadata"
          git push origin HEAD:main
          git fetch origin main

      - name: Verify published rulesets, manifest and protected baseline
        id: verify
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 scripts/verify_published_rulesets.py --ref origin/main | tee /tmp/published-integrity.json
          cat /tmp/published-integrity.json >> "$GITHUB_STEP_SUMMARY"

      - name: Close recovered manifest integrity incidents
        if: ${{ steps.refresh.outcome == 'success' && steps.publish.outcome == 'success' && steps.verify.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          for title in "RULE-SET manifest metadata repair failed" "Published RULE-SET integrity mismatch"; do
            issue="$(gh issue list --repo "$REPO" --state open --limit 100 --json number,title | jq --arg title "$title" -r '.[] | select(.title == $title) | .number' | head -n 1)"
            if [ -n "$issue" ]; then
              gh issue comment "$issue" --repo "$REPO" --body "Manifest refresh, publication and independent verification now succeed. Recovery run: $RUN_URL"
              gh issue close "$issue" --repo "$REPO"
            fi
          done

      - name: Dispatch one bounded reconciliation audit on mismatch
        if: ${{ steps.refresh.outcome == 'success' && steps.verify.outcome == 'failure' && !(github.event_name == 'workflow_run' && github.event.workflow_run.event == 'workflow_dispatch') }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          runs="$(gh api --paginate --slurp "repos/$REPO/actions/workflows/auto_sync.yml/runs?per_page=100" | jq '{workflow_runs: [.[].workflow_runs[]]}')"
          current_sha="$(gh api "repos/$REPO/commits/main" --jq .sha)"
          if jq -e --arg sha "$current_sha" '[.workflow_runs[] | select(.head_sha == $sha and (.status == "queued" or .status == "pending" or .status == "waiting" or .status == "requested" or .status == "in_progress"))] | length > 0' <<< "$runs" >/dev/null; then
            echo "A deterministic audit for current main ($current_sha) is already queued or running; waiting for its completion."
            exit 0
          fi
          checkout_sha="$(git rev-parse HEAD)"
          if [ "$checkout_sha" != "$current_sha" ]; then
            echo "Manifest verifier checkout is behind current main; deferring reconciliation."
            exit 0
          fi
          current_fingerprint="$(python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from production_intent import load_manifest, compute_fingerprint
          manifest = load_manifest(Path("automation/production_inputs.json"))
          print(compute_fingerprint(Path("."), manifest))
          PY
          )"
          integrity_input="$(jq -cn --arg fingerprint "$current_fingerprint" --arg reason "bounded reconciliation after published manifest integrity mismatch" '{production_fingerprint:$fingerprint,production_decision:"RECOVERY_REQUIRED",production_reason:$reason}')"
          echo "No current-main audit is active. Enqueueing one bounded integrity reconciliation for $current_sha."
          dispatch_mode="$(python3 - <<'PY'
          import json
          from pathlib import Path
          try:
              control = json.loads(Path("automation/production_control.json").read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError):
              control = {}
          mode = control.get("dispatch_mode") if isinstance(control, dict) and type(control.get("schema_version")) is int and control.get("schema_version") == 1 else "hold"
          print(mode if mode in {"enabled", "hold"} else "hold")
          PY
          )"
          if [ "$dispatch_mode" != "enabled" ]; then
            echo "HOLD: manifest-integrity reconciliation enqueue suppressed; no queue mutation." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          printf '%s' "$GH_TOKEN" | python3 scripts/task_scheduler.py --repository "$REPO" --branch main --token-stdin --idempotency-key "production:integrity:$current_fingerprint" --priority 100 --input-json "$integrity_input" enqueue-auto-sync

      - name: Open manifest metadata repair incident
        if: ${{ always() && (steps.refresh.outcome == 'failure' || steps.publish.outcome == 'failure') }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="RULE-SET manifest metadata repair failed"
          body="Watchdog could not safely reconcile manifest metadata from the committed DIRECT/PROXY/REJECT files. No rule file or uu.conf was modified.\n\nRun: $RUN_URL\n\nInspect the manifest refresh or manifest-only publish step. The issue is intentionally fail-closed; no source rebuild was dispatched."
          issue="$(gh issue list --repo "$REPO" --state open --search "$title in:title" --json number --jq '.[0].number')"
          if [ -n "$issue" ] && [ "$issue" != "null" ]; then
            gh issue comment "$issue" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "$title" --body "$body"
          fi

      - name: Open bounded integrity incident if reconciliation did not repair
        if: ${{ steps.verify.outcome == 'failure' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'workflow_dispatch')) }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Published RULE-SET integrity mismatch"
          body="The bounded reconciliation audit completed, but published ruleset verification still fails. No further automatic dispatch will be made, preventing a retry loop.\n\nRun: $RUN_URL\n\nInspect the verify-published-rulesets step and repair the underlying cause before another publication."
          issue="$(gh issue list --repo "$REPO" --state open --search "$title in:title" --json number --jq '.[0].number')"
          if [ -n "$issue" ] && [ "$issue" != "null" ]; then
            gh issue comment "$issue" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "$title" --body "$body"
          fi
