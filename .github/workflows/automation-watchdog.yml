name: Shadowrocket automation watchdog
run-name: "Automation watchdog / ${{ github.run_id }}"

on:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "30 22 * * *"
  workflow_dispatch:
    inputs:
      request_deterministic_audit:
        description: 'Explicitly authorize one deterministic production audit through the durable Watchdog queue'
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - ".github/workflows/automation-watchdog.yml"
      - "sources/policy.json"
      - "sources/domain_sources.json"
      - "sources/protected_domains.json"
      - "sources/request_domain_observations.json"
      - "scripts/**"
      - "modules/uu.conf"
      - "automation/production_inputs.json"
      - "automation/production_control.json"

permissions:
  actions: write
  contents: read

env:
  AUTO_SYNC_WORKFLOW_ID: "402712272"
  WATCHDOG_WORKFLOW_ID: "403552201"

concurrency:
  group: shadowrocket-automation-watchdog-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  entrypoint-probe:
    name: Watchdog entrypoint context
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions:
      contents: read
    steps:
      - name: Record trigger context
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          printf 'event=%s\nref=%s\n' "$EVENT_NAME" "$REF" >> "$GITHUB_STEP_SUMMARY"

  health-check:
    if: ${{ github.ref == 'refs/heads/main' }}
    concurrency:
      group: shadowrocket-watchdog-control-plane-main
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
    outputs:
      block_manifest: ${{ steps.stale-recovery.outputs.block_manifest }}
    steps:
      - name: Checkout watchdog policy code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            scripts
            automation
            sources
            modules
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Export durable queue snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.AUTOMATION_WRITE_TOKEN || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PYTHONPATH: scripts
        run: |
          set -euo pipefail
          python3 scripts/remote_task_queue_runtime.py --repository "$GITHUB_REPOSITORY" --branch main snapshot --output "$RUNNER_TEMP/task_queue.json"
          echo "AUTOMATION_QUEUE_SNAPSHOT=$RUNNER_TEMP/task_queue.json" >> "$GITHUB_ENV"
      - name: Detect production intent and enqueue durable auto-sync task
        id: stale-recovery
        if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_WRITE_TOKEN || github.token }}
          GITHUB_TOKEN: ${{ secrets.AUTOMATION_WRITE_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          ORIGIN_EVENT: ${{ github.event_name }}
          ORIGIN_ACTOR: ${{ github.actor }}
          ORIGIN_BEFORE: ${{ github.event.before }}
          ORIGIN_SHA: ${{ github.sha }}
          PYTHONPATH: scripts
        run: |
          set -euo pipefail
          production_dispatch_mode="$(jq -r '.dispatch_mode // "hold"' automation/production_control.json)"
          if [ "$production_dispatch_mode" != "enabled" ]; then
            production_dispatch_mode="hold"
          fi

          paths_json='[]'
          if [ "$ORIGIN_EVENT" = "push" ] && [ -n "${ORIGIN_BEFORE:-}" ] && [ "$ORIGIN_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            paths_json="$(gh api "repos/$REPO/compare/$ORIGIN_BEFORE...$ORIGIN_SHA" --jq '[.files[].filename]')"
          fi

          current_fingerprint="$(python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from production_intent import load_manifest, compute_fingerprint
          manifest = load_manifest(Path("automation/production_inputs.json"))
          print(compute_fingerprint(Path("."), manifest))
          PY
          )"

          active_fingerprints="$(CURRENT_PRODUCTION_FINGERPRINT="$current_fingerprint" python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from production_intent import active_production_fingerprints
          queue = json.loads(Path(os.environ["AUTOMATION_QUEUE_SNAPSHOT"]).read_text(encoding="utf-8"))
          print(json.dumps(active_production_fingerprints(queue, os.environ["CURRENT_PRODUCTION_FINGERPRINT"])))
          PY
          )"

          successful_fingerprints="$(jq -c '[.tasks[] | select(.status == "SUCCEEDED" and ((.verification.status // "") == "passed")) | .input.production_fingerprint // empty] | map(select(type == "string")) | unique' "$AUTOMATION_QUEUE_SNAPSHOT")"
          last_success_fingerprint="$(jq -r '[.tasks[] | select(.status == "SUCCEEDED" and ((.verification.status // "") == "passed") and (.input.production_fingerprint != null))] | sort_by(.completed_at // .updated_at // "") | last | .input.production_fingerprint // empty' "$AUTOMATION_QUEUE_SNAPSHOT")"
          last_success_at="$(jq -r '[.tasks[] | select(.status == "SUCCEEDED" and ((.verification.status // "") == "passed"))] | sort_by(.completed_at // .updated_at // "") | last | .completed_at // .updated_at // empty' "$AUTOMATION_QUEUE_SNAPSHOT")"

          intent_json="$(python3 scripts/production_intent.py \
            --event "$ORIGIN_EVENT" \
            --revision "$ORIGIN_SHA" \
            --paths-json "$paths_json" \
            --last-success-fingerprint "$last_success_fingerprint" \
            --last-success-at "$last_success_at" \
            --active-fingerprints-json "$active_fingerprints" \
            --successful-fingerprints-json "$successful_fingerprints")"

          decision="$(jq -r '.decision' <<< "$intent_json")"
          fingerprint="$(jq -r '.fingerprint' <<< "$intent_json")"
          echo "$intent_json" >> "$GITHUB_STEP_SUMMARY"
          echo "decision=$decision fingerprint=$fingerprint mode=$production_dispatch_mode"

          case "$decision" in
            INPUT_CHANGED|SCHEDULE_DUE)
              if [ "$production_dispatch_mode" != "enabled" ]; then
                echo "Production demand held by production_control.json"
                echo "block_manifest=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              reason="$(jq -r '.reason // empty' <<< "$intent_json")"
              audit_input_json="$(jq -cn \
                --arg fingerprint "$fingerprint" \
                --arg decision "$decision" \
                --arg reason "$reason" \
                --arg event "$ORIGIN_EVENT" \
                --arg actor "$ORIGIN_ACTOR" \
                --arg before "${ORIGIN_BEFORE:-}" \
                --arg sha "$ORIGIN_SHA" \
                '{production_fingerprint:$fingerprint,production_decision:$decision,production_reason:$reason,baseline_source_event:$event,baseline_source_actor:$actor,baseline_source_before:$before,baseline_source_sha:$sha}')"
              production_key="$(jq -r '.idempotency_key // empty' <<< "$intent_json")"
              if [ -z "$production_key" ]; then
                production_key="production:$fingerprint"
              fi
              printf '%s' "$GH_TOKEN" | python3 scripts/task_scheduler.py \
                --repository "$REPO" --branch main --token-stdin \
                --idempotency-key "$production_key" --priority 100 \
                --input-json "$audit_input_json" enqueue-auto-sync
              echo "block_manifest=true" >> "$GITHUB_OUTPUT"
              ;;
            REVIEW_REQUIRED)
              echo "Production held: REVIEW_REQUIRED"
              echo "block_manifest=true" >> "$GITHUB_OUTPUT"
              ;;
            IN_PROGRESS|WAIT_FOR_ACTIVE|ALREADY_SATISFIED|OBSERVE_ONLY)
              echo "No production task required: $decision"
              echo "block_manifest=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unexpected production intent decision: $decision" >&2
              exit 1
              ;;
          esac

  task-queue-supervision:
    if: ${{ always() && needs.health-check.result == 'success' && github.ref == 'refs/heads/main' }}
    needs: [health-check]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            scripts
            automation
            sources
            modules
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Recover leases and run scheduler once
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_WRITE_TOKEN || github.token }}
          GITHUB_TOKEN: ${{ secrets.AUTOMATION_WRITE_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          PYTHONPATH: scripts
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | python3 scripts/task_scheduler.py \
            --repository "$REPO" --branch main --token-stdin --max-tasks 1 run-once
