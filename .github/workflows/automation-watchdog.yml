name: Shadowrocket automation watchdog
run-name: Automation task ${{ inputs.automation_task_id || 'manual' }}

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      request_deterministic_audit:
        description: 'Explicitly authorize one deterministic production audit'
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "sources/policy.json"
      - "modules/uu.conf"
      - "scripts/**"
      - "automation/**"

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: shadowrocket-automation-watchdog-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  health-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Snapshot note
        run: |
          echo "Temporary minimal Watchdog after accidental placeholder overwrite."
          echo "Full workflow with config-baseline-sync must be restored from local artifacts or prior commit 042251f + job."

  config-baseline-sync:
    needs: [health-check]
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    concurrency:
      group: shadowrocket-main-writer
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Apply owner-verified uu.conf baseline metadata only
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REF: refs/heads/main
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_SHA: ${{ github.sha }}
          BASELINE_SOURCE_EVENT: ${{ github.event_name }}
          BASELINE_SOURCE_SHA: ${{ github.sha }}
          BASELINE_SOURCE_REF: refs/heads/main
        run: |
          set -euo pipefail
          PRE="$(python3 -c \"import hashlib,pathlib; print(hashlib.sha256(pathlib.Path('modules/uu.conf').read_bytes()).hexdigest())\")"
          python3 scripts/register_config_baseline.py --apply || {
            echo "No apply needed or history not owner-verified; exiting cleanly."
            exit 0
          }
          POST="$(python3 -c \"import hashlib,pathlib; print(hashlib.sha256(pathlib.Path('modules/uu.conf').read_bytes()).hexdigest())\")"
          test "$PRE" = "$POST"
          git add sources/policy.json automation/release_manifest.json automation/production_workflow_map.json automation/resource_write_sets.json || true
          if git diff --cached --quiet; then
            echo "No metadata changes."
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "chore(automation): register owner-approved uu.conf baseline metadata (content unchanged)"
          git push origin HEAD:main
