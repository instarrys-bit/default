name: Shadowrocket automation watchdog

on:
  schedule:
    - cron: "30 22 * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Shadowrocket Deterministic Domain Audit (User Config Baseline)"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - ".github/workflows/automation-watchdog.yml"

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: shadowrocket-automation-watchdog
  cancel-in-progress: false

jobs:
  health-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Recover failed scheduled or push-triggered audit once
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SOURCE_EVENT: ${{ github.event.workflow_run.event }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          # A recovery run is workflow_dispatch; ignore its completion to prevent retry loops.
          case "$SOURCE_CONCLUSION" in
            failure|timed_out|startup_failure)
              ;;
            *)
              echo "No automatic recovery required for event=$SOURCE_EVENT conclusion=$SOURCE_CONCLUSION."
              exit 0
              ;;
          esac
          if [ "$SOURCE_EVENT" != "schedule" ] && [ "$SOURCE_EVENT" != "push" ]; then
            echo "No automatic recovery for source event=$SOURCE_EVENT."
            exit 0
          fi

          runs="$(gh api "repos/$REPO/actions/workflows/auto_sync.yml/runs?per_page=20")"
          if jq -e --argjson source "$SOURCE_RUN_ID" '[.workflow_runs[] | select(.id > $source)] | length > 0' <<< "$runs" >/dev/null; then
            echo "A newer deterministic audit already exists; no duplicate recovery."
            exit 0
          fi
          if jq -e '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress")] | length > 0' <<< "$runs" >/dev/null; then
            echo "A deterministic audit is already queued or running; no duplicate recovery."
            exit 0
          fi

          echo "Source run $SOURCE_RUN_ID failed; dispatching one workflow_dispatch recovery attempt."
          gh workflow run auto_sync.yml --ref main --repo "$REPO"

      - name: Report degraded source discovery health
        if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          payload="$(gh api "repos/$REPO/contents/reports/project-status.json")"
          health="$(jq -r '.content | @base64d | fromjson | .health' <<< "$payload")"
          search_errors="$(jq -r '.content | @base64d | fromjson | .source_discovery.search_error_count // 0' <<< "$payload")"
          tree_errors="$(jq -r '.content | @base64d | fromjson | .source_discovery.tree_error_count // 0' <<< "$payload")"
          coverage_stalled="$(jq -r '.content | @base64d | fromjson | .coverage.stalled // false' <<< "$payload")"
          title="Shadowrocket source discovery degraded health"
          if [ "$health" = "CHECK" ] || [ "$health" = "FAIL" ]; then
            body="Project health is $health after a successful workflow.\n\nSearch errors: $search_errors\nTree scan errors: $tree_errors\nCoverage stalled: $coverage_stalled\nRun: $RUN_URL\n\nThe affected source inventory remains non-activating until it passes deterministic review. Inspect reports/project-status.json and reports/source-discovery.md."
            issue="$(gh issue list --repo "$REPO" --state open --search "$title in:title" --json number --jq '.[0].number')"
            if [ -n "$issue" ] && [ "$issue" != "null" ]; then
              gh issue comment "$issue" --repo "$REPO" --body "$body"
            else
              gh issue create --repo "$REPO" --title "$title" --body "$body"
            fi
          else
            issue="$(gh issue list --repo "$REPO" --state open --search "$title in:title" --json number --jq '.[0].number')"
            if [ -n "$issue" ] && [ "$issue" != "null" ]; then
              gh issue comment "$issue" --repo "$REPO" --body "Project health recovered to PASS. Recovery run: $RUN_URL"
              gh issue close "$issue" --repo "$REPO"
            fi
          fi
      - name: Detect stale successful audit and recover
        if: ${{ github.event_name != 'workflow_run' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          runs="$(gh api "repos/$REPO/actions/workflows/auto_sync.yml/runs?per_page=20")"

          if jq -e '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress")] | length > 0' <<< "$runs" >/dev/null; then
            echo "The deterministic audit is already queued or running; no duplicate dispatch."
            exit 0
          fi

          last_success="$(jq -r '[.workflow_runs[] | select(.conclusion == "success")] | sort_by(.created_at) | last | .created_at // empty' <<< "$runs")"
          age_seconds="$(python3 - "$last_success" <<'PY'
          import sys
          from datetime import datetime, timezone
          value = sys.argv[1]
          if not value:
              print(10**9)
          else:
              stamp = datetime.fromisoformat(value.replace("Z", "+00:00"))
              print(max(0, int((datetime.now(timezone.utc) - stamp).total_seconds())))
          PY
          )"

          # Weekly audit is scheduled at 20:00 UTC on Sunday. An 8-day threshold
          # tolerates queue delays while recovering a missed scheduled run.
          if [ "$age_seconds" -gt 691200 ]; then
            echo "Last successful audit is stale (${age_seconds}s); dispatching recovery run."
            gh workflow run auto_sync.yml --ref main --repo "$REPO"
          else
            echo "Last successful audit is healthy (${age_seconds}s ago)."
          fi
