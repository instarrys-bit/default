name: Read-only operations dashboard

on:
  # Rebuild on every main-branch commit. This avoids stale dashboards when a
  # producer writes a new data file that was not listed in a paths filter.
  push:
    branches: [main]
  workflow_run:
    # Publish one fresh snapshot after each production-relevant workflow has
    # finished. Building from latest main makes overlapping events coalesce
    # safely: the snapshot always reads the newest committed source state.
    workflows:
      - "Shadowrocket Deterministic Domain Audit (User Config Baseline)"
      - "Shadowrocket automation watchdog"
      - "Shadowrocket Source Discovery (Watchdog)"
      - "Validate Shadowrocket config against user baseline"
      - "Shadowrocket self-healing agent"
      - "Automation task manual"
    types: [completed]
  schedule:
    - cron: "*/5 * * * *"
permissions:
  contents: read
  actions: read
  issues: read

concurrency:
  group: github-pages-dashboard
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main snapshot
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Build sanitized dashboard data
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/build_dashboard_snapshot.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static dashboard
        uses: actions/upload-pages-artifact@v4
        with:
          path: dashboard

  deploy:
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy read-only dashboard
        id: deployment
        uses: actions/deploy-pages@v4
