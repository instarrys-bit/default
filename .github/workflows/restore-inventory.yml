name: Restore inventory files

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: restore-inventory
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore corrupted inventory and push
        env:
          GOOD_SHA: 0de2e952d6b4f07062eeb8dcaa8fd6237bf3a762
          NEW_PIN: efb77e7fa846769c34bcc9051a7cf8a369ee5318
          OLD_PIN: 24eb76ce6162da27fdc608105d372356c923eab3
        run: |
          set -euo pipefail

          needs_restore() {
            python3 - "$1" "$NEW_PIN" <<'PY'
          import json, sys
          path, expected = sys.argv[1], sys.argv[2]
          try:
              data = json.load(open(path, encoding="utf-8"))
          except Exception:
              raise SystemExit(1)
          pin = data.get("review_context", {}).get("release_manifest_blob_sha")
          if pin != expected:
              raise SystemExit(1)
          if "job_graph" not in data and "confirmed_write_sets" not in data:
              raise SystemExit(1)
          PY
          }

          if needs_restore automation/production_workflow_map.json \
            && needs_restore automation/resource_write_sets.json; then
            echo "Inventory healthy"
            exit 0
          fi

          echo "Restoring inventory from ${GOOD_SHA}"
          git show "${GOOD_SHA}:automation/production_workflow_map.json" > automation/production_workflow_map.json
          git show "${GOOD_SHA}:automation/resource_write_sets.json" > automation/resource_write_sets.json

          python3 - "$OLD_PIN" "$NEW_PIN" <<'PY'
          import sys
          from pathlib import Path
          old, new = sys.argv[1], sys.argv[2]
          for rel in [
              "automation/production_workflow_map.json",
              "automation/resource_write_sets.json",
          ]:
              path = Path(rel)
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"{rel}: old pin missing")
              path.write_text(text.replace(old, new), encoding="utf-8")
              print("pinned", rel)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/production_workflow_map.json automation/resource_write_sets.json
          if git diff --cached --quiet; then
            echo "No changes after restore"
            exit 0
          fi
          git commit -m "Restore production_workflow_map and resource_write_sets; align release_manifest pin"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Pushed on attempt ${attempt}"
                exit 0
              fi
            else
              git rebase --abort || true
              git reset --hard origin/main
              git show "${GOOD_SHA}:automation/production_workflow_map.json" > automation/production_workflow_map.json
              git show "${GOOD_SHA}:automation/resource_write_sets.json" > automation/resource_write_sets.json
              python3 - "$OLD_PIN" "$NEW_PIN" <<'PY'
          import sys
          from pathlib import Path
          old, new = sys.argv[1], sys.argv[2]
          for rel in [
              "automation/production_workflow_map.json",
              "automation/resource_write_sets.json",
          ]:
              path = Path(rel)
              text = path.read_text(encoding="utf-8")
              path.write_text(text.replace(old, new), encoding="utf-8")
          PY
              git add automation/production_workflow_map.json automation/resource_write_sets.json
              git commit -m "Restore production_workflow_map and resource_write_sets; align release_manifest pin" || true
            fi
            echo "Attempt ${attempt} failed; retrying"
            sleep 2
          done
          exit 1
