name: Restore inventory files (one-shot)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Restore from chunks
        run: python3 scripts/restore_inventory_from_chunks.py
      - name: Commit restored files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/production_workflow_map.json automation/resource_write_sets.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Restore production_workflow_map and resource_write_sets from verified chunks"
          git push origin HEAD:main
