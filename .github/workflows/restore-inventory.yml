name: Restore inventory files

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: restore-inventory
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect and restore corrupted inventory
        run: |
          set -euo pipefail
          GOOD_SHA=0de2e952d6b4f07062eeb8dcaa8fd6237bf3a762
          NEW=efb77e7fa846769c34bcc9051a7cf8a369ee5318
          OLD=24eb76ce6162da27fdc608105d372356c923eab3

          restore=0
          for f in automation/production_workflow_map.json automation/resource_write_sets.json; do
            if ! python3 -c "import json,sys; d=json.load(open(sys.argv[1])); assert d.get('review_context',{}).get('release_manifest_blob_sha')==sys.argv[2]; assert ('job_graph' in d) or ('confirmed_write_sets' in d)" "$f" "$NEW" 2>/dev/null; then
              restore=1
              echo "needs restore: $f"
            fi
          done

          if [ "$restore" -eq 0 ]; then
            echo "Inventory healthy; nothing to do"
            exit 0
          fi

          echo "Restoring from $GOOD_SHA"
          git show "$GOOD_SHA:automation/production_workflow_map.json" > automation/production_workflow_map.json
          git show "$GOOD_SHA:automation/resource_write_sets.json" > automation/resource_write_sets.json
          python3 -c "
          from pathlib import Path
          OLD='$OLD'
          NEW='$NEW'
          for rel in ['automation/production_workflow_map.json','automation/resource_write_sets.json']:
              p=Path(rel)
              t=p.read_text()
              if OLD not in t:
                  raise SystemExit(rel+': old pin missing')
              p.write_text(t.replace(OLD, NEW))
              print('pinned', rel)
          "

      - name: Commit restore if needed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/production_workflow_map.json automation/resource_write_sets.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Restore production_workflow_map and resource_write_sets; align release_manifest pin"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || {
              git rebase --abort || true
              git show HEAD:automation/production_workflow_map.json > automation/production_workflow_map.json || true
              git show HEAD:automation/resource_write_sets.json > automation/resource_write_sets.json || true
              # Re-apply restored content after rebase abort
              GOOD_SHA=0de2e952d6b4f07062eeb8dcaa8fd6237bf3a762
              NEW=efb77e7fa846769c34bcc9051a7cf8a369ee5318
              OLD=24eb76ce6162da27fdc608105d372356c923eab3
              git show "$GOOD_SHA:automation/production_workflow_map.json" > automation/production_workflow_map.json
              git show "$GOOD_SHA:automation/resource_write_sets.json" > automation/resource_write_sets.json
              python3 -c "from pathlib import Path; OLD='$OLD'; NEW='$NEW';
[Path(r).write_text(Path(r).read_text().replace(OLD, NEW)) for r in ['automation/production_workflow_map.json','automation/resource_write_sets.json']]"
              git add automation/production_workflow_map.json automation/resource_write_sets.json
              git commit -m "Restore production_workflow_map and resource_write_sets; align release_manifest pin" || true
            }
            if git push origin HEAD:main; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying"
            sleep 3
          done
          echo "Failed to push after retries" >&2
          exit 1
