name: Shadowrocket self-healing agent

on:
  workflow_run:
    workflows:
      - "Shadowrocket Deterministic Domain Audit (User Config Baseline)"
      - "Validate Shadowrocket config against user baseline"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shadowrocket-self-healing-agent
  cancel-in-progress: false

jobs:
  diagnose-and-repair:
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    if: ${{ github.event_name == 'workflow_run' && (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out' || github.event.workflow_run.conclusion == 'startup_failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout current main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Check whether a newer run supersedes this failure
        id: supersession
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          runs="$(gh api "repos/$REPO/actions/workflows/$WORKFLOW_ID/runs?per_page=20" 2>/dev/null || true)"
          if [ -z "$runs" ]; then
            echo "Supersession lookup unavailable; continuing with diagnosis."
            echo "stale=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          newer_count="$(jq --argjson failed "$FAILED_RUN_ID" '[.workflow_runs[] | select(.id > $failed) | select(.status != "completed" or .conclusion == "success")] | length' <<< "$runs")"
          if [ "$newer_count" -gt 0 ]; then
            echo "A newer run is queued, active, or successful; suppressing this superseded failure."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "No newer active or successful run supersedes this failure."
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Record superseded failure without opening an incident
        if: ${{ steps.supersession.outputs.stale == 'true' }}
        run: echo "This failed run is superseded by a newer queued, active, or successful run." >> "$GITHUB_STEP_SUMMARY"

      - name: Download failed workflow logs
        if: ${{ steps.supersession.outputs.stale != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh run view "$RUN_ID" --repo "$REPO" --log-failed > /tmp/failed-run.log

      - name: Diagnose failed workflow
        if: ${{ steps.supersession.outputs.stale != 'true' }}
        id: diagnosis
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p reports/self-healing
          python3 scripts/diagnose_workflow_failure.py \
            --log /tmp/failed-run.log \
            --run-id "$RUN_ID" \
            --out reports/self-healing/diagnosis.json
          cat reports/self-healing/diagnosis.json >> "$GITHUB_STEP_SUMMARY"
          echo "repair_id=$(python3 -c 'import json; print(json.load(open("reports/self-healing/diagnosis.json")).get("repair_id") or "")')" >> "$GITHUB_OUTPUT"
          echo "classification=$(python3 -c 'import json; print(json.load(open("reports/self-healing/diagnosis.json"))["classification"])')" >> "$GITHUB_OUTPUT"
          echo "failed_steps_count=$(python3 -c 'import json; print(len(json.load(open("reports/self-healing/diagnosis.json"))["failed_steps"]))')" >> "$GITHUB_OUTPUT"

      - name: Apply allowlisted repair and run tests
        if: ${{ steps.supersession.outputs.stale != 'true' }}
        id: repair
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPAIR_ID: ${{ steps.diagnosis.outputs.repair_id }}
        run: |
          set -euo pipefail
          if [ "$REPAIR_ID" != "refresh_ruleset_manifest" ]; then
            echo "No allowlisted automatic code repair applies; preserving diagnosis for incident reporting."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python3 scripts/apply_safe_repair.py --diagnosis reports/self-healing/diagnosis.json
          python3 -m py_compile scripts/refresh_ruleset_manifest.py scripts/diagnose_workflow_failure.py scripts/apply_safe_repair.py
          python3 -m unittest discover -s tests -v

          if git diff --quiet; then
            echo "The allowlisted repair is already present; no code change is needed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          branch="self-heal/run-$RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add .github/workflows/auto_sync.yml
          git commit -m "Self-heal: reconcile final ruleset manifest counts"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Publish repair pull request
        if: ${{ steps.repair.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ steps.repair.outputs.branch }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git push origin "$BRANCH"
          gh pr create \
            --repo "$REPO" \
            --base main \
            --head "$BRANCH" \
            --title "Self-heal: reconcile final RULE-SET manifest counts" \
            --body "Automated, allowlisted repair proposed after workflow run $RUN_ID.\n\n- Diagnosis: RULESET_MANIFEST_COUNT_MISSING or RULESET_MANIFEST_COUNT_MISMATCH.\n- Change: restore the deterministic final-manifest reconciliation step.\n- Validation: Python compilation and the repository unittest suite passed before publishing this PR.\n- Safety: no changes to shadowrocket/ss.conf, DNS, MITM, or routing policy.\n\nThis PR is not auto-merged."
          gh workflow run self-healing-tests.yml --ref "$BRANCH" --repo "$REPO"

      - name: Open incident when no safe repair applies
        if: ${{ steps.supersession.outputs.stale != 'true' && steps.repair.outputs.changed != 'true' && steps.diagnosis.outputs.classification != 'STALE_SUPERSEDED' && steps.diagnosis.outputs.failed_steps_count != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          classification="$(python3 -c 'import json; print(json.load(open("reports/self-healing/diagnosis.json"))["classification"])')"
          body="$(cat reports/self-healing/diagnosis.json)"
          title="Self-healing incident: $classification"
          existing="$(gh issue list --repo "$REPO" --state open --search "$classification in:title" --json number --jq '.[0].number')"
          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            body_text="$(printf 'Repeated failure for run %s: %s\\n\\n```json\\n%s\\n```\\n' "$RUN_ID" "$RUN_URL" "$body")"
            gh issue comment "$existing" --repo "$REPO" --body "$body_text"
          else
            body_text="$(printf 'Failed workflow run %s: %s\\n\\nAutomatic repair was not applied. No speculative code changes were made.\\n\\nDiagnosis:\\n\\n```json\\n%s\\n```\\n' "$RUN_ID" "$RUN_URL" "$body")"
            gh issue create --repo "$REPO" --title "$title" --body "$body_text"
          fi


  resolve-validator-incidents:
    permissions:
      issues: write
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Validate Shadowrocket config against user baseline' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Close recovered validator incidents
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          for classification in CONFIG_BASELINE_MISMATCH TEST_FAILURE PYTHON_IMPORT_FAILURE; do
            issues="$(gh issue list --repo "$REPO" --state open --search "Self-healing incident $classification in:title" --json number --jq '.[].number')"
            if [ -z "$issues" ]; then
              continue
            fi
            while IFS= read -r issue; do
              [ -n "$issue" ] || continue
              gh issue comment "$issue" --repo "$REPO" --body "A subsequent config-baseline validation succeeded. The protected config was not modified. Successful validation: $RUN_URL"
              gh issue close "$issue" --repo "$REPO"
            done <<< "$issues"
          done


  resolve-audit-incidents:
    permissions:
      issues: write
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Shadowrocket Deterministic Domain Audit (User Config Baseline)' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Close recovered deterministic-audit incidents
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          issues="$(gh issue list --repo "$REPO" --state open --search '"Self-healing incident" in:title' --json number,title --jq '.[] | select((.title | startswith("Self-healing incident: UNCLASSIFIED_STEP_FAILURE")) or (.title | startswith("Self-healing incident: TEST_FAILURE"))) | .number')"
          if [ -z "$issues" ]; then
            echo "No open deterministic-audit test/failure incidents to resolve."
            exit 0
          fi
          while IFS= read -r issue; do
            [ -n "$issue" ] || continue
            gh issue comment "$issue" --repo "$REPO" --body "A subsequent full deterministic audit and publish completed successfully on commit $RUN_SHA. Recovery run: $RUN_URL"
            gh issue close "$issue" --repo "$REPO"
          done <<< "$issues"

  stale-run-watch:
    permissions:
      actions: write
      contents: read
      issues: write
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Cancel superseded or stalled audits and recover current main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/$REPO/commits/main" --jq .sha)"
          runs="$(gh api "repos/$REPO/actions/workflows/auto_sync.yml/runs?per_page=30")"

          stale_lines="$(python3 -c '
          import json, sys
          from datetime import datetime, timezone
          current_main = sys.argv[1]
          payload = json.load(sys.stdin)
          now = datetime.now(timezone.utc)
          for run in payload.get("workflow_runs", []):
              if run.get("status") == "completed":
                  continue
              run_id = run.get("id")
              if not run_id:
                  continue
              if run.get("head_sha") != current_main:
                  print(run_id, "superseded")
                  continue
              stamp = run.get("run_started_at") or run.get("created_at")
              if not stamp:
                  continue
              started = datetime.fromisoformat(stamp.replace("Z", "+00:00"))
              if (now - started).total_seconds() > 21600:
                  print(run_id, "timeout")
          ' "$current_main" <<< "$runs")"

          cancelled_any=0
          timed_out_any=0
          if [ -n "$stale_lines" ]; then
            while read -r stale_id reason; do
              [ -n "$stale_id" ] || continue
              echo "Cancelling audit $stale_id ($reason); current main is $current_main."
              gh run cancel "$stale_id" --repo "$REPO" || true
              cancelled_any=1
              if [ "$reason" = "timeout" ]; then timed_out_any=1; fi
            done <<< "$stale_lines"
            sleep 10
            runs="$(gh api "repos/$REPO/actions/workflows/auto_sync.yml/runs?per_page=30")"
          fi

          active_count="$(jq '[.workflow_runs[] | select(.status != "completed")] | length' <<< "$runs")"
          if [ "$active_count" -gt 0 ]; then
            echo "An audit is still queued, cancelling, or running; no replacement will be dispatched."
            exit 0
          fi

          last_success="$(jq -r '[.workflow_runs[] | select(.conclusion == "success")] | sort_by(.created_at) | last | .created_at // empty' <<< "$runs")"
          last_success_sha="$(jq -r '[.workflow_runs[] | select(.conclusion == "success")] | sort_by(.created_at) | last | .head_sha // empty' <<< "$runs")"
          age_seconds="$(python3 - "$last_success" <<'PY'
          import sys
          from datetime import datetime, timezone
          value = sys.argv[1]
          if not value:
              print(10**9)
          else:
              stamp = datetime.fromisoformat(value.replace("Z", "+00:00"))
              print(max(0, int((datetime.now(timezone.utc) - stamp).total_seconds())))
          PY
          )"

          if [ "$cancelled_any" = "1" ] || [ "$last_success_sha" != "$current_main" ] || [ "$age_seconds" -gt 691200 ]; then
            echo "No current-main audit is active and the last successful audit is stale or superseded; dispatching one replacement."
            gh workflow run auto_sync.yml --ref main --repo "$REPO"
          else
            echo "The latest successful audit matches current main and is within the eight-day health window."
          fi

          if [ "$timed_out_any" = "1" ]; then
            title="Self-healing incident: stalled audit"
            existing="$(gh issue list --repo "$REPO" --state open --search "stalled audit in:title" --json number --jq '.[0].number')"
            body_text="$(printf 'The watchdog cancelled an audit that exceeded six hours and dispatched a replacement on current main %s.\\n' "$current_main")"
            if [ -n "$existing" ] && [ "$existing" != "null" ]; then
              gh issue comment "$existing" --repo "$REPO" --body "$body_text"
            else
              gh issue create --repo "$REPO" --title "$title" --body "$body_text"
            fi
          fi
