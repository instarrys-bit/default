name: Shadowrocket self-healing agent

on:
  workflow_run:
    workflows:
      - "Shadowrocket Deterministic Domain Audit (User Config Baseline)"
      - "Validate Shadowrocket config against user baseline"
    types: [completed]

permissions:
  contents: read

# Repairs and issue-driven repository changes share the main-writer lock.
concurrency:
  group: shadowrocket-main-writer
  cancel-in-progress: false

jobs:
  diagnose-and-repair:
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' && (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out' || github.event.workflow_run.conclusion == 'startup_failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout current main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Check whether a newer run supersedes this failure
        id: supersession
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
          FAILED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          runs="$(gh api --paginate --slurp "repos/$REPO/actions/workflows/$WORKFLOW_ID/runs?per_page=100" 2>/dev/null | jq '{workflow_runs: [.[].workflow_runs[]]}' || true)"
          if [ -z "$runs" ]; then
            echo "Supersession lookup unavailable; continuing with diagnosis."
            echo "stale=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          newer_count="$(jq --argjson failed "$FAILED_RUN_ID" '[.workflow_runs[] | select(.head_branch == "main" and .id > $failed) | select(.status != "completed" or .conclusion == "success")] | length' <<< "$runs")"
          if [ "$newer_count" -gt 0 ]; then
            echo "A newer run is queued, active, or successful; suppressing this superseded failure."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            current_main="$(gh api "repos/$REPO/commits/main" --jq .sha)"
            if [ "$FAILED_SHA" != "$current_main" ]; then
              compare_json="$(gh api "repos/$REPO/compare/$FAILED_SHA...$current_main" 2>/dev/null || true)"
              if [ -n "$compare_json" ]; then
                if ! jq -e '.status == "ahead" and (.files | type == "array")' <<< "$compare_json" >/dev/null || ! jq -e '[.files[].filename | select(startswith("docs/") | not)] | length == 0' <<< "$compare_json" >/dev/null; then
                  echo "The failed run's code inputs have been superseded by a newer main state; suppressing stale diagnosis."
                  echo "stale=true" >> "$GITHUB_OUTPUT"
                  exit 0
                fi
              fi
            fi
            echo "No newer run or non-documentation main change supersedes this failure."
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Record superseded failure without opening an incident
        if: ${{ steps.supersession.outputs.stale == 'true' }}
        run: echo "This failed run is superseded by a newer queued, active, or successful run." >> "$GITHUB_STEP_SUMMARY"

      - name: Download failed workflow logs
        if: ${{ steps.supersession.outputs.stale != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh run view "$RUN_ID" --repo "$REPO" --log-failed > /tmp/failed-run.log

      - name: Diagnose failed workflow
        if: ${{ steps.supersession.outputs.stale != 'true' }}
        id: diagnosis
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p reports/self-healing
          python3 scripts/diagnose_workflow_failure.py \
            --log /tmp/failed-run.log \
            --run-id "$RUN_ID" \
            --out reports/self-healing/diagnosis.json
          cat reports/self-healing/diagnosis.json >> "$GITHUB_STEP_SUMMARY"
          echo "repair_id=$(python3 -c 'import json; print(json.load(open("reports/self-healing/diagnosis.json")).get("repair_id") or "")')" >> "$GITHUB_OUTPUT"
          echo "classification=$(python3 -c 'import json; print(json.load(open("reports/self-healing/diagnosis.json"))["classification"])')" >> "$GITHUB_OUTPUT"
          echo "failed_steps_count=$(python3 -c 'import json; print(len(json.load(open("reports/self-healing/diagnosis.json"))["failed_steps"]))')" >> "$GITHUB_OUTPUT"

      - name: Apply allowlisted repair and run tests
        if: ${{ steps.supersession.outputs.stale != 'true' }}
        id: repair
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPAIR_ID: ${{ steps.diagnosis.outputs.repair_id }}
        run: |
          set -euo pipefail
          case "$REPAIR_ID" in
            refresh_ruleset_manifest)
              PR_TITLE="Self-heal: reconcile final RULE-SET manifest counts"
              ;;
            fix_stale_audit_concurrency_contract)
              PR_TITLE="Self-heal: correct stale audit concurrency test contract"
              ;;
            *)
              echo "No allowlisted automatic code repair applies; preserving diagnosis for incident reporting."
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          python3 scripts/apply_safe_repair.py --diagnosis reports/self-healing/diagnosis.json
          python3 -m py_compile scripts/refresh_ruleset_manifest.py scripts/diagnose_workflow_failure.py scripts/apply_safe_repair.py
          python3 -m unittest discover -s tests -v

          if git diff --quiet; then
            echo "The allowlisted repair is already present; no code change is needed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          branch="self-heal/run-$RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          case "$REPAIR_ID" in
            refresh_ruleset_manifest)
              git add -- .github/workflows/auto_sync.yml
              expected_staged_path=".github/workflows/auto_sync.yml"
              ;;
            fix_stale_audit_concurrency_contract)
              git add -- tests/test_workflow_config_guard_order.py
              expected_staged_path="tests/test_workflow_config_guard_order.py"
              ;;
            *)
              echo "Unknown repair id at staging; refusing to commit."
              exit 1
              ;;
          esac
          git diff --cached --check
          staged_paths="$(git diff --cached --name-only)"
          if [ "$staged_paths" != "$expected_staged_path" ]; then
            echo "Staged paths do not match the repair-specific allowlist; refusing to commit."
            printf '%s\n' "$staged_paths"
            exit 1
          fi
          git commit -m "$PR_TITLE"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Publish repair pull request
        id: publish-repair
        if: ${{ steps.repair.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ steps.repair.outputs.branch }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPAIR_ID: ${{ steps.diagnosis.outputs.repair_id }}
        run: |
          set -euo pipefail
          case "$REPAIR_ID" in
            refresh_ruleset_manifest)
              PR_TITLE="Self-heal: reconcile final RULE-SET manifest counts"
              PR_BODY="Automated, allowlisted repair proposed after workflow run $RUN_ID.\n\n- Diagnosis: RULESET_MANIFEST_COUNT_MISSING or RULESET_MANIFEST_COUNT_MISMATCH.\n- Change: restore the deterministic final-manifest reconciliation step.\n- Validation: Python compilation and the repository unittest suite passed before publishing this PR.\n- Safety: no changes to shadowrocket/ss.conf, DNS, MITM, or routing policy.\n\nThis PR is not auto-merged."
              ;;
            fix_stale_audit_concurrency_contract)
              PR_TITLE="Self-heal: correct stale audit concurrency test contract"
              PR_BODY="Automated, allowlisted repair proposed after workflow run $RUN_ID.\n\n- Diagnosis: WORKFLOW_TEST_CONTRACT_MISMATCH.\n- Change: update only the outdated static test assertion to match the safe cancel-in-progress: false policy.\n- Validation: Python compilation and the repository unittest suite passed before publishing this PR.\n- Safety: no changes to shadowrocket/ss.conf, ruleset contents, DNS, MITM, or routing policy.\n\nThis PR is not auto-merged."
              ;;
            *)
              echo "Unknown repair id at PR publication; refusing to publish."
              exit 1
              ;;
          esac
          gh auth setup-git
          git push origin "$BRANCH"
          gh pr create --repo "$REPO" --base main --head "$BRANCH" --title "$PR_TITLE" --body "$PR_BODY"
          gh workflow run self-healing-tests.yml --ref "$BRANCH" --repo "$REPO"

      - name: Open incident when no safe repair applies
        if: ${{ always() && steps.supersession.outputs.stale != 'true' && steps.diagnosis.outcome == 'success' && steps.diagnosis.outputs.classification != 'STALE_SUPERSEDED' && (steps.diagnosis.outputs.failed_steps_count != '0' || steps.diagnosis.outputs.classification == 'WORKFLOW_TIMEOUT' || github.event.workflow_run.conclusion == 'startup_failure') && (steps.repair.outcome != 'success' || steps.repair.outputs.changed != 'true' || steps.publish-repair.outcome == 'failure') }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          SOURCE_WORKFLOW: ${{ github.event.workflow_run.name }}
          FAILED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          case "$SOURCE_WORKFLOW" in
            "Shadowrocket Deterministic Domain Audit (User Config Baseline)") workflow_key="deterministic_audit" ;;
            "Validate Shadowrocket config against user baseline") workflow_key="config_validator" ;;
            *) echo "Unsupported source workflow; refusing to open a misclassified incident."; exit 1 ;;
          esac
          marker="<!-- shadowrocket-automation:workflow=$workflow_key;run_id=$RUN_ID -->"
          classification="$(python3 -c 'import json; print(json.load(open("reports/self-healing/diagnosis.json"))["classification"])')"
          body="$(cat reports/self-healing/diagnosis.json)"
          title="Self-healing incident: $classification ($workflow_key; ${FAILED_SHA:0:8})"
          existing="$(gh issue list --repo "$REPO" --state open --limit 100 --json number,title | jq --arg title "$title" -r '.[] | select(.title == $title) | .number' | head -n 1)"
          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            body_text="$(printf 'Repeated failure for run %s: %s\\n\\n\x60\x60\x60json\\n%s\\n\x60\x60\x60\\n' "$RUN_ID" "$RUN_URL" "$body")"
            body_text="$(printf '%s\\n\\n%s' "$marker" "$body_text")"
            gh issue comment "$existing" --repo "$REPO" --body "$body_text"
          else
            body_text="$(printf 'Failed workflow run %s: %s\\n\\nAutomatic repair was not applied. No speculative code changes were made.\\n\\nDiagnosis:\\n\\n\x60\x60\x60json\\n%s\\n\x60\x60\x60\\n' "$RUN_ID" "$RUN_URL" "$body")"
            body_text="$(printf '%s\\n\\n%s' "$marker" "$body_text")"
            created_url="$(gh issue create --repo "$REPO" --title "$title" --body "$body_text")"
            existing="${created_url##*/}"
          fi

          gh issue view "$existing" --repo "$REPO" --json body --jq .body > /tmp/incident-body.md
          python3 scripts/incident_state.py \
            --body-file /tmp/incident-body.md \
            --workflow "$workflow_key" \
            --source-sha "$FAILED_SHA" \
            --classification "$classification" \
            --event-id "failure-run-$RUN_ID" \
            --target-state MANUAL_INTERVENTION \
            --out /tmp/incident-state-body.md
          gh issue edit "$existing" --repo "$REPO" --body-file /tmp/incident-state-body.md


  report-agent-failure:
    needs: [diagnose-and-repair]
    if: ${{ always() && github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' && (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out' || github.event.workflow_run.conclusion == 'startup_failure') && needs.diagnose-and-repair.result == 'failure' }}
    permissions:
      issues: write
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Open self-healing agent execution incident
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_URL: ${{ github.event.workflow_run.html_url }}
          SOURCE_WORKFLOW: ${{ github.event.workflow_run.name }}
          AGENT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          case "$SOURCE_WORKFLOW" in
            "Shadowrocket Deterministic Domain Audit (User Config Baseline)") workflow_key="deterministic_audit" ;;
            "Validate Shadowrocket config against user baseline") workflow_key="config_validator" ;;
            *) echo "Unsupported source workflow; refusing to misclassify agent failure."; exit 1 ;;
          esac
          title="Self-healing agent failure: $workflow_key (source run $SOURCE_RUN_ID)"
          marker="<!-- shadowrocket-automation:agent_failure;workflow=$workflow_key;source_run_id=$SOURCE_RUN_ID -->"
          body="The self-healing agent itself failed while processing a main-branch workflow failure.\n\nSource run: $SOURCE_RUN_URL\nAgent run: $AGENT_RUN_URL\n\n$marker\n\nNo speculative project changes were made. Inspect the agent run logs and diagnosis/repair stage."
          existing="$(gh issue list --repo "$REPO" --state open --limit 100 --json number,title | jq --arg title "$title" -r '.[] | select(.title == $title) | .number' | head -n 1)"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
            gh issue edit "$existing" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "$title" --body "$body"
          fi

  resolve-validator-incidents:
    permissions:
      contents: read
      issues: write
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.name == 'Validate Shadowrocket config against user baseline' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout incident state helper
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - name: Close recovered validator incidents
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          close_issue() {
            local issue_number="$1"
            local attempt
            for attempt in 1 2 3; do
              if gh api --method PATCH "repos/$REPO/issues/$issue_number" -f state=closed >/dev/null; then
                return 0
              fi
              if [ "$attempt" -lt 3 ]; then
                sleep "$attempt"
              fi
            done
            echo "Failed to close issue #$issue_number after REST retries." >&2
            return 1
          }
          for classification in CONFIG_BASELINE_MISMATCH TEST_FAILURE PYTHON_IMPORT_FAILURE WORKFLOW_TIMEOUT UNCLASSIFIED_STEP_FAILURE; do
            issues="$(gh issue list --repo "$REPO" --state open --limit 100 --json number,title,body | jq --arg classification "$classification" --argjson run_id "$RUN_ID" '.[] | select(.title | test("^Self-healing incident: " + $classification + " \\(config_validator(; [0-9a-f]{8})?\\)$")) | select(.body | contains("shadowrocket-automation:workflow=config_validator;run_id=")) | select(((.body | capture("shadowrocket-automation:workflow=config_validator;run_id=(?<id>[0-9]+)") | .id | tonumber) < $run_id)) | .number')"
            if [ -z "$issues" ]; then
              continue
            fi
            while IFS= read -r issue; do
              [ -n "$issue" ] || continue
              gh issue view "$issue" --repo "$REPO" --json body --jq .body > /tmp/incident-body.md
              python3 scripts/incident_state.py \
                --body-file /tmp/incident-body.md \
                --workflow config_validator \
                --source-sha "$RUN_SHA" \
                --source-sha-from-state \
                --classification "$classification" \
                --event-id "validator-verifying-$RUN_ID-$issue" \
                --target-state VERIFYING \
                --out /tmp/incident-verifying-body.md
              python3 scripts/incident_state.py \
                --body-file /tmp/incident-verifying-body.md \
                --workflow config_validator \
                --source-sha "$RUN_SHA" \
                --source-sha-from-state \
                --classification "$classification" \
                --event-id "validator-success-$RUN_ID-$issue" \
                --target-state RECOVERED \
                --verification-url "$RUN_URL" \
                --out /tmp/incident-state-body.md
              gh issue edit "$issue" --repo "$REPO" --body-file /tmp/incident-state-body.md
              gh issue comment "$issue" --repo "$REPO" --body "A subsequent config-baseline validation succeeded. The protected config was not modified. Successful validation: $RUN_URL"
              close_issue "$issue"
            done <<< "$issues"
          done
          agent_issues="$(gh issue list --repo "$REPO" --state open --limit 100 --json number,title,body | jq --argjson run_id "$RUN_ID" '.[] | select(.title | startswith("Self-healing agent failure: config_validator (source run ")) | select(.body | contains("shadowrocket-automation:agent_failure;workflow=config_validator;source_run_id=")) | select(((.body | capture("shadowrocket-automation:agent_failure;workflow=config_validator;source_run_id=(?<id>[0-9]+)") | .id | tonumber) < $run_id)) | .number')"
          while IFS= read -r issue; do
            [ -n "$issue" ] || continue
            gh issue comment "$issue" --repo "$REPO" --body "The config-baseline validator has recovered on a later main-branch run: $RUN_URL. This self-healing-agent incident remains open pending verified agent recovery."
          done <<< "$agent_issues"


  resolve-audit-incidents:
    permissions:
      actions: read
      contents: read
      issues: write
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.name == 'Shadowrocket Deterministic Domain Audit (User Config Baseline)' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout verifier code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - name: Close recovered deterministic-audit incidents
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          close_issue() {
            local issue_number="$1"
            local attempt
            for attempt in 1 2 3; do
              if gh api --method PATCH "repos/$REPO/issues/$issue_number" -f state=closed >/dev/null; then
                return 0
              fi
              if [ "$attempt" -lt 3 ]; then
                sleep "$attempt"
              fi
            done
            echo "Failed to close issue #$issue_number after REST retries." >&2
            return 1
          }
          gh api "repos/$REPO/actions/runs/$RUN_ID" > /tmp/recovery-run.json
          gh api --paginate --slurp "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" > /tmp/recovery-jobs.json
          pending_issues="$(gh issue list --repo "$REPO" --state open --limit 100 --json number,title,body | jq --argjson run_id "$RUN_ID" '.[] | select(.title | test("^Self-healing incident: (UNCLASSIFIED_STEP_FAILURE|TEST_FAILURE|PYTHON_IMPORT_FAILURE|WORKFLOW_TIMEOUT|CONFIG_BASELINE_MISMATCH|RULESET_MANIFEST_COUNT_MISSING|RULESET_MANIFEST_COUNT_MISMATCH) \\(deterministic_audit(; [0-9a-f]{8})?\\)$")) | select(.body | contains("shadowrocket-automation:workflow=deterministic_audit;run_id=")) | select(((.body | capture("shadowrocket-automation:workflow=deterministic_audit;run_id=(?<id>[0-9]+)") | .id | tonumber) < $run_id)) | .number')"
          while IFS= read -r issue; do
            [ -n "$issue" ] || continue
            issue_title="$(gh issue view "$issue" --repo "$REPO" --json title --jq .title)"
            classification="${issue_title#Self-healing incident: }"
            classification="$(sed -E 's/ \(deterministic_audit(; [0-9a-f]{8})?\)$//' <<< "$classification")"
            gh issue view "$issue" --repo "$REPO" --json body --jq .body > /tmp/incident-body.md
            python3 scripts/incident_state.py --body-file /tmp/incident-body.md --workflow deterministic_audit --source-sha "$RUN_SHA" \
                --source-sha-from-state --classification "$classification" --event-id "audit-verifying-$RUN_ID-$issue" --target-state VERIFYING --out /tmp/incident-verifying-body.md
            gh issue edit "$issue" --repo "$REPO" --body-file /tmp/incident-verifying-body.md
          done <<< "$pending_issues"
          python3 scripts/verify_recovery_run.py --run /tmp/recovery-run.json --jobs /tmp/recovery-jobs.json | tee /tmp/recovery-verification.json
          cat /tmp/recovery-verification.json >> "$GITHUB_STEP_SUMMARY"
          issues="$(gh issue list --repo "$REPO" --state open --limit 100 --json number,title,body | jq --argjson run_id "$RUN_ID" '.[] | select(.title | test("^Self-healing incident: (UNCLASSIFIED_STEP_FAILURE|TEST_FAILURE|PYTHON_IMPORT_FAILURE|WORKFLOW_TIMEOUT|CONFIG_BASELINE_MISMATCH|RULESET_MANIFEST_COUNT_MISSING|RULESET_MANIFEST_COUNT_MISMATCH) \\(deterministic_audit(; [0-9a-f]{8})?\\)$")) | select(.body | contains("shadowrocket-automation:workflow=deterministic_audit;run_id=")) | select(((.body | capture("shadowrocket-automation:workflow=deterministic_audit;run_id=(?<id>[0-9]+)") | .id | tonumber) < $run_id)) | .number')"
          if [ -z "$issues" ]; then
            echo "No open deterministic-audit test/failure incidents to resolve."
          else
            while IFS= read -r issue; do
              [ -n "$issue" ] || continue
              issue_title="$(gh issue view "$issue" --repo "$REPO" --json title --jq .title)"
              classification="${issue_title#Self-healing incident: }"
              classification="$(sed -E 's/ \(deterministic_audit(; [0-9a-f]{8})?\)$//' <<< "$classification")"
              gh issue view "$issue" --repo "$REPO" --json body --jq .body > /tmp/incident-body.md
              python3 scripts/incident_state.py \
                --body-file /tmp/incident-body.md \
                --workflow deterministic_audit \
                --source-sha "$RUN_SHA" \
                --source-sha-from-state \
                --classification "$classification" \
                --event-id "audit-success-$RUN_ID-$issue" \
                --target-state RECOVERED \
                --verification-url "$RUN_URL" \
                --out /tmp/incident-state-body.md
              gh issue edit "$issue" --repo "$REPO" --body-file /tmp/incident-state-body.md
              gh issue comment "$issue" --repo "$REPO" --body "A subsequent full deterministic audit and publish completed successfully on commit $RUN_SHA. Recovery run: $RUN_URL"
              close_issue "$issue"
            done <<< "$issues"
          fi
          agent_issues="$(gh issue list --repo "$REPO" --state open --limit 100 --json number,title,body | jq --argjson run_id "$RUN_ID" '.[] | select(.title | startswith("Self-healing agent failure: deterministic_audit (source run ")) | select(.body | contains("shadowrocket-automation:agent_failure;workflow=deterministic_audit;source_run_id=")) | select(((.body | capture("shadowrocket-automation:agent_failure;workflow=deterministic_audit;source_run_id=(?<id>[0-9]+)") | .id | tonumber) < $run_id)) | .number')"
          while IFS= read -r issue; do
            [ -n "$issue" ] || continue
            gh issue comment "$issue" --repo "$REPO" --body "The deterministic audit and publish have recovered on a later main-branch run: $RUN_URL. This self-healing-agent incident remains open pending verified agent recovery."
          done <<< "$agent_issues"
