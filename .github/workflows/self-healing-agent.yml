name: Shadowrocket self-healing agent

on:
  workflow_run:
    workflows:
      - "Shadowrocket Deterministic Domain Audit (User Config Baseline)"
      - "Validate Shadowrocket config against user baseline"
    types: [completed]
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: shadowrocket-self-healing-agent
  cancel-in-progress: false

jobs:
  diagnose-and-repair:
    if: ${{ github.event_name == 'workflow_run' && (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out' || github.event.workflow_run.conclusion == 'startup_failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout current main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Check whether a newer run supersedes this failure
        id: supersession
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          runs="$(gh api "repos/$REPO/actions/workflows/$WORKFLOW_ID/runs?per_page=20" 2>/dev/null || true)"
          if [ -z "$runs" ]; then
            echo "Supersession lookup unavailable; continuing with diagnosis."
            echo "stale=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          newer_count="$(jq --argjson failed "$FAILED_RUN_ID" '[.workflow_runs[] | select(.id > $failed) | select(.status != "completed" or .conclusion == "success")] | length' <<< "$runs")"
          if [ "$newer_count" -gt 0 ]; then
            echo "A newer run is queued, active, or successful; suppressing this superseded failure."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "No newer active or successful run supersedes this failure."
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Record superseded failure without opening an incident
        if: ${{ steps.supersession.outputs.stale == 'true' }}
        run: echo "This failed run is superseded by a newer queued, active, or successful run." >> "$GITHUB_STEP_SUMMARY"

      - name: Download failed workflow logs
        if: ${{ steps.supersession.outputs.stale != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh run view "$RUN_ID" --repo "$REPO" --log-failed > /tmp/failed-run.log

      - name: Diagnose failed workflow
        if: ${{ steps.supersession.outputs.stale != 'true' }}
        id: diagnosis
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p reports/self-healing
          python3 scripts/diagnose_workflow_failure.py \
            --log /tmp/failed-run.log \
            --run-id "$RUN_ID" \
            --out reports/self-healing/diagnosis.json
          cat reports/self-healing/diagnosis.json >> "$GITHUB_STEP_SUMMARY"
          echo "repair_id=$(python3 -c 'import json; print(json.load(open("reports/self-healing/diagnosis.json")).get("repair_id") or "")')" >> "$GITHUB_OUTPUT"
          echo "classification=$(python3 -c 'import json; print(json.load(open("reports/self-healing/diagnosis.json"))["classification"])')" >> "$GITHUB_OUTPUT"
          echo "failed_steps_count=$(python3 -c 'import json; print(len(json.load(open("reports/self-healing/diagnosis.json"))["failed_steps"]))')" >> "$GITHUB_OUTPUT"

      - name: Apply allowlisted repair and run tests
        if: ${{ steps.supersession.outputs.stale != 'true' }}
        id: repair
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPAIR_ID: ${{ steps.diagnosis.outputs.repair_id }}
        run: |
          set -euo pipefail
          if [ "$REPAIR_ID" != "refresh_ruleset_manifest" ]; then
            echo "No allowlisted automatic code repair applies; preserving diagnosis for incident reporting."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python3 scripts/apply_safe_repair.py --diagnosis reports/self-healing/diagnosis.json
          python3 -m py_compile scripts/refresh_ruleset_manifest.py scripts/diagnose_workflow_failure.py scripts/apply_safe_repair.py
          python3 -m unittest discover -s tests -v

          if git diff --quiet; then
            echo "The allowlisted repair is already present; no code change is needed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          branch="self-heal/run-$RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add .github/workflows/auto_sync.yml
          git commit -m "Self-heal: reconcile final ruleset manifest counts"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Publish repair pull request
        if: ${{ steps.repair.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ steps.repair.outputs.branch }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git push origin "$BRANCH"
          gh pr create \
            --repo "$REPO" \
            --base main \
            --head "$BRANCH" \
            --title "Self-heal: reconcile final RULE-SET manifest counts" \
            --body "Automated, allowlisted repair proposed after workflow run $RUN_ID.\n\n- Diagnosis: RULESET_MANIFEST_COUNT_MISSING or RULESET_MANIFEST_COUNT_MISMATCH.\n- Change: restore the deterministic final-manifest reconciliation step.\n- Validation: Python compilation and the repository unittest suite passed before publishing this PR.\n- Safety: no changes to shadowrocket/ss.conf, DNS, MITM, or routing policy.\n\nThis PR is not auto-merged."
          gh workflow run self-healing-tests.yml --ref "$BRANCH" --repo "$REPO"

      - name: Open incident when no safe repair applies
        if: ${{ steps.supersession.outputs.stale != 'true' && steps.repair.outputs.changed != 'true' && steps.diagnosis.outputs.classification != 'STALE_SUPERSEDED' && steps.diagnosis.outputs.failed_steps_count != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          classification="$(python3 -c 'import json; print(json.load(open("reports/self-healing/diagnosis.json"))["classification"])')"
          body="$(cat reports/self-healing/diagnosis.json)"
          title="Self-healing incident: $classification"
          existing="$(gh issue list --repo "$REPO" --state open --search "$classification in:title" --json number --jq '.[0].number')"
          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            body_text="$(printf 'Repeated failure for run %s: %s\\n\\n```json\\n%s\\n```\\n' "$RUN_ID" "$RUN_URL" "$body")"
            gh issue comment "$existing" --repo "$REPO" --body "$body_text"
          else
            body_text="$(printf 'Failed workflow run %s: %s\\n\\nAutomatic repair was not applied. No speculative code changes were made.\\n\\nDiagnosis:\\n\\n```json\\n%s\\n```\\n' "$RUN_ID" "$RUN_URL" "$body")"
            gh issue create --repo "$REPO" --title "$title" --body "$body_text"
          fi


  resolve-baseline-incident:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Validate Shadowrocket config against user baseline' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      issues: write
    steps:
      - name: Close recovered config-baseline incident
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          issue="$(gh issue list --repo "$REPO" --state open --search '"Self-healing incident: CONFIG_BASELINE_MISMATCH" in:title' --json number --jq '.[0].number')"
          if [ -n "$issue" ] && [ "$issue" != "null" ]; then
            gh issue comment "$issue" --repo "$REPO" --body "Config-baseline validation recovered. The protected config was not modified. Successful validation: $RUN_URL"
            gh issue close "$issue" --repo "$REPO"
          else
            echo "No open config-baseline incident to resolve."
          fi

  stale-run-watch:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Cancel only an audit older than its timeout plus grace period
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          runs="$(gh api "repos/$REPO/actions/workflows/auto_sync.yml/runs?per_page=20")"
          stale_id="$(python3 -c '
          import json, sys
          from datetime import datetime, timezone
          payload=json.load(sys.stdin)
          now=datetime.now(timezone.utc)
          for run in payload.get("workflow_runs", []):
              if run.get("status") != "in_progress":
                  continue
              stamp=run.get("run_started_at") or run.get("created_at")
              if not stamp:
                  continue
              started=datetime.fromisoformat(stamp.replace("Z","+00:00"))
              if (now-started).total_seconds() > 21600:
                  print(run["id"])
                  break
          ' <<< "$runs")"

          if [ -z "$stale_id" ]; then
            echo "No audit has exceeded the six-hour stale-run threshold."
            exit 0
          fi

          echo "Audit $stale_id exceeded the five-hour job timeout plus one-hour grace period."
          gh run cancel "$stale_id" --repo "$REPO"
          sleep 10
          remaining="$(gh api "repos/$REPO/actions/workflows/auto_sync.yml/runs?per_page=20")"
          if jq -e --argjson stale "$stale_id" '[.workflow_runs[] | select((.status == "queued" or .status == "in_progress") and .id != $stale)] | length == 0' <<< "$remaining" >/dev/null; then
            gh workflow run auto_sync.yml --ref main --repo "$REPO"
            gh issue create \
              --repo "$REPO" \
              --title "Self-healing incident: stale audit run $stale_id" \
              --body "The watchdog found audit run $stale_id still in progress after six hours, cancelled it, and dispatched one replacement run. Inspect the original run logs before changing code."
          else
            echo "Another audit is active; no replacement was dispatched."
          fi
