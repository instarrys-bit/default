name: V2 Storage Management tests

on:
  pull_request:
    paths:
      - "storage/v2/**"
      - "tests/v2/**"
      - ".github/workflows/v2-storage-tests.yml"
  push:
    branches: [main]
    paths:
      - "storage/v2/**"
      - "tests/v2/**"
      - ".github/workflows/v2-storage-tests.yml"

permissions:
  contents: read

jobs:
  storage-v2-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Validate registered programs and disabled adapters
        run: |
          python scripts/validate_program_registry.py
          python scripts/validate_execution_adapters.py
      - name: Validate registry evidence pins
        run: python -m unittest discover -s tests -p test_capability_contract_inventory.py -v
      - name: Verify frozen V1 archive Git tree identity
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python storage/v2/verify_archive_inventory.py
      - name: Run V2 storage unit tests
        run: python -m unittest discover -s tests/v2 -v
