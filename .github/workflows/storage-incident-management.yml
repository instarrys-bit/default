name: Storage Management — incident ledger
run-name: Storage incident ledger / ${{ inputs.automation_task_id || inputs.event_id }}
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Incident ledger operation
        required: true
        type: choice
        options: [record, resolve]
      workflow:
        description: Originating workflow key
        required: true
        type: string
      event_id:
        description: Idempotent event identifier
        required: true
        type: string
      automation_task_id:
        description: Correlated event identifier for the run name
        required: false
        type: string
      run_id:
        description: Originating workflow run ID for record operations
        required: false
        type: string
      source_sha:
        description: Full source commit SHA for record operations
        required: false
        type: string
      classification:
        description: Incident classification for record operations
        required: false
        type: string
      summary:
        description: Deterministic incident summary
        required: false
        type: string
      run_url:
        description: Originating Actions run URL
        required: false
        type: string
      before_run_id:
        description: Resolve only incidents older than this successful run
        required: false
        type: string
      classifications:
        description: Comma-separated classifications eligible for verified resolution
        required: false
        type: string
      verification_url:
        description: Independently verified recovery run URL
        required: false
        type: string
      diagnosis_json:
        description: Optional compact diagnosis JSON
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: storage-incident-ledger-main
  cancel-in-progress: false
jobs:
  mutate-ledger:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout Storage Management code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Apply allowlisted incident ledger operation
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          OPERATION: ${{ inputs.operation }}
          WORKFLOW_KEY: ${{ inputs.workflow }}
          EVENT_ID: ${{ inputs.event_id }}
          RUN_ID: ${{ inputs.run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          CLASSIFICATION: ${{ inputs.classification }}
          SUMMARY: ${{ inputs.summary }}
          RUN_URL: ${{ inputs.run_url }}
          BEFORE_RUN_ID: ${{ inputs.before_run_id }}
          CLASSIFICATIONS: ${{ inputs.classifications }}
          VERIFICATION_URL: ${{ inputs.verification_url }}
          DIAGNOSIS_JSON: ${{ inputs.diagnosis_json }}
        run: |
          set -euo pipefail
          args=("$OPERATION" --workflow "$WORKFLOW_KEY" --event-id "$EVENT_ID")
          if [ "$OPERATION" = "record" ]; then
            args+=(--run-id "$RUN_ID" --source-sha "$SOURCE_SHA" --classification "$CLASSIFICATION" --summary "$SUMMARY" --run-url "$RUN_URL")
            if [ -n "$DIAGNOSIS_JSON" ]; then
              printf '%s' "$DIAGNOSIS_JSON" > "$RUNNER_TEMP/diagnosis.json"
              args+=(--diagnosis-file "$RUNNER_TEMP/diagnosis.json")
            fi
          else
            args+=(--before-run-id "$BEFORE_RUN_ID" --classifications "$CLASSIFICATIONS" --verification-url "$VERIFICATION_URL")
          fi
          python3 storage/v2/incident_store.py "\${args[@]}" | tee "$GITHUB_STEP_SUMMARY"
