name: Publish GPT-reviewed Shadowrocket domains
on:
  push:
    paths:
      - "sources/gpt_domain_reviews.json"
      - "scripts/import_gpt_reviewed_domains.py"
      - "scripts/audit_pipeline.py"
      - "shadowrocket/ss.conf"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: shadowrocket-gpt-domain-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Import only GPT-approved domains
        run: python3 scripts/import_gpt_reviewed_domains.py
      - name: Validate config structure
        run: python3 scripts/validate_config.py
      - name: Validate canonical baseline, DNS and managed rules
        run: python3 scripts/audit_pipeline.py
      - name: Check patch integrity
        run: git diff --check
      - name: Commit verified config and audit trail
        run: |
          if git diff --quiet; then
            echo "No approved new domains to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shadowrocket/ss.conf reports/pending-gpt-review.json reports/gpt-domain-publication.md
          git commit -m "chore: publish GPT-reviewed domain rules"
          git push
