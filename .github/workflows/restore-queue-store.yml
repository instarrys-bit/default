name: Restore github_queue_store
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    if: ${{ github.ref_name == 'main' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore scripts/github_queue_store.py from known-good commit
        run: |
          set -euo pipefail
          git show 30f10ca5a13bb9d8b0dc421a9168bd0c6d71da68:scripts/github_queue_store.py > scripts/github_queue_store.py
          python3 -m py_compile scripts/github_queue_store.py
          test "$(wc -c < scripts/github_queue_store.py)" -gt 20000
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/github_queue_store.py
          git commit -m "fix(queue): restore full github_queue_store.py from 30f10ca"
          git push origin HEAD:main
