name: Storage Management
run-name: Storage Management / ${{ github.event.inputs.automation_task_id || github.run_id }}
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
    paths:
      - ".github/workflows/storage-management.yml"
      - "storage/v2/**"
      - "tests/**"
      - ".github/workflows/automation-watchdog.yml"
      - ".github/workflows/auto_sync.yml"
      - ".github/workflows/dashboard-pages.yml"
      - "automation/program_registry.json"
      - "automation/execution_adapters.json"
      - "automation/production_control.json"
      - "automation/capability_contract_inventory.json"
      - "automation/production_workflow_map.json"
      - "automation/release_manifest.json"
      - "automation/resource_ownership_audit.json"
      - "automation/resource_write_sets.json"
      - "automation/maintenance_backlog.json"
      - "scripts/validate_program_registry.py"
      - "scripts/validate_automation_write_boundary.py"
      - "scripts/validate_execution_adapters.py"
      - "scripts/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/storage-management.yml"
      - ".github/workflows/automation-watchdog.yml"
      - "automation/program_registry.json"
      - "automation/execution_adapters.json"
      - "automation/production_control.json"
      - "automation/capability_contract_inventory.json"
      - "automation/production_workflow_map.json"
      - "automation/release_manifest.json"
      - "automation/resource_ownership_audit.json"
      - "automation/resource_write_sets.json"
      - "automation/maintenance_backlog.json"
      - "scripts/**"
      - "scripts/register_config_baseline.py"
      - "scripts/verify_baseline.py"
      - "modules/uu.conf"
      - "sources/policy.json"
      - "storage/v2/artifact_store.py"
      - "storage/v2/ingest_actions_artifacts.py"
      - "storage/v2/**"
      - "tests/**"
  schedule:
    - cron: "*/15 * * * *"
  workflow_run:
    workflows:
      - "Shadowrocket Deterministic Domain Audit (User Config Baseline)"
    types: [completed]
  workflow_dispatch:
    inputs:
      operation:
        description: Storage Management operation
        required: true
        type: choice
        options: [record, resolve]
      automation_task_id:
        description: Idempotent event identifier and run correlation ID
        required: true
        type: string
      run_id:
        description: Originating workflow run ID for record operations
        required: false
        type: string
      source_sha:
        description: Full source commit SHA for record operations
        required: false
        type: string
      classification:
        description: Incident classification for record operations
        required: false
        type: string
      summary:
        description: Deterministic incident summary
        required: false
        type: string
      run_url:
        description: Originating Actions run URL
        required: false
        type: string
      before_run_id:
        description: Resolve only incidents older than this successful run
        required: false
        type: string
      classifications:
        description: Comma-separated classifications eligible for verified resolution
        required: false
        type: string
      verification_url:
        description: Independently verified recovery run URL
        required: false
        type: string
permissions:
  contents: write
concurrency:
  # PR validation is read-only and must not queue behind a long production artifact backfill.
  # Main-branch mutations remain serialized under one shared group.
  group: storage-management-${{ github.event.pull_request.number || 'main' }}-epoch-2
  # Ingestion is content-addressed and idempotent; a newer main run supersedes a stuck poll.
  cancel-in-progress: false
jobs:
  ensure-watchdog-enabled:
    name: Ensure Watchdog workflow is enabled
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      actions: write
    steps:
      - name: Read Watchdog workflow state
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          state="$(gh api "repos/$GH_REPO/actions/workflows/403552201" --jq '.state')"
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "Watchdog workflow state: $state" >> "$GITHUB_STEP_SUMMARY"
      - name: Enable Watchdog when disabled
        if: ${{ steps.state.outputs.state != 'active' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api --method PUT "repos/$GH_REPO/actions/workflows/403552201/enable"
          state="$(gh api "repos/$GH_REPO/actions/workflows/403552201" --jq '.state')"
          test "$state" = "active"
          echo "Watchdog workflow enabled and verified." >> "$GITHUB_STEP_SUMMARY"

  reconcile-config-baseline:
    name: Register user-authorized uu.conf SHA changes (metadata only)
    needs: repository-integrity-snapshot
    if: ${{ always() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - name: Checkout latest main with complete config history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            /*
            !/storage/v2/artifacts/sha256/
          sparse-checkout-cone-mode: false
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Follow latest main uu.conf SHA and prepare metadata-only update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          python3 scripts/register_config_baseline.py --apply | tee "$GITHUB_STEP_SUMMARY"
      - name: Publish only allowlisted baseline metadata
        env:
          BASELINE_METADATA_ALLOWLIST: "sources/policy.json automation/release_manifest.json automation/production_workflow_map.json automation/resource_write_sets.json reports/config-drift-audit.json"
        run: bash scripts/publish_config_baseline_metadata.sh

  validate-storage:
    name: Validate Storage Management runtime and recovery
    if: ${{ (github.event_name == 'pull_request' && github.event.action != 'closed') || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout proposed Storage Management changes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            /*
            !/storage/v2/artifacts/sha256/
          sparse-checkout-cone-mode: false
      - name: Validate all retained workflow YAML files and reject duplicate keys
        run: |
          ruby <<'RUBY'
          require "psych"
          def check_unique_keys(node, file)
            return unless node
            if node.is_a?(Psych::Nodes::Mapping)
              seen = {}
              node.children.each_slice(2) do |key, value|
                name = key.respond_to?(:value) ? key.value : key.class.name
                raise "#{file}: duplicate YAML key #{name.inspect}" if seen.key?(name)
                seen[name] = true
                check_unique_keys(value, file)
              end
            elsif node.respond_to?(:children) && node.children
              node.children.each { |child| check_unique_keys(child, file) }
            end
          end
          Dir.glob(".github/workflows/*.yml").sort.each do |file|
            check_unique_keys(Psych.parse_file(file), file)
            puts "Valid YAML with unique mapping keys: #{file}"
          end
          RUBY
      - name: Verify the four-system workflow boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('.github/workflows')
          expected = {'auto_sync.yml', 'automation-watchdog.yml', 'dashboard-pages.yml', 'storage-management.yml'}
          actual = {p.name for p in root.glob('*.yml')}
          if actual != expected:
              raise SystemExit(f'Expected exactly four workflows; found {sorted(actual)}')
          forbidden = ('assessment-completion-relay' + '.yml', 'source-discovery' + '.yml', 'queue-snapshot-artifact' + '.yml', 'validate-config' + '.yml', 'self-healing-agent' + '.yml', 'self-healing-tests' + '.yml', 'storage-incident-management' + '.yml', 'v2-storage-tests' + '.yml')
          for file in root.glob('*.yml'):
              content = file.read_text(encoding='utf-8')
              for name in forbidden:
                  if name in content:
                      raise SystemExit(f'{file} references deleted workflow {name}')
          print('Four workflows present; all YAML parsed; no deleted workflow references.')
          PY
      - name: Validate GitHub Actions workflow semantics
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/*.yml
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Compile Storage Management runtime
        run: python3 -m compileall -q scripts storage/v2
      - name: Validate program registry
        run: python3 scripts/validate_program_registry.py
      - name: Validate automation write boundaries
        run: python3 scripts/validate_automation_write_boundary.py
      - name: Validate execution adapter contracts
        run: python3 scripts/validate_execution_adapters.py
      - name: Validate file-based maintenance backlog
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path("automation/maintenance_backlog.json")
          document = json.loads(path.read_text(encoding="utf-8"))
          if document.get("schema_version") != 1:
              raise SystemExit("maintenance backlog schema_version must be 1")
          items = document.get("items")
          if not isinstance(items, list) or not items:
              raise SystemExit("maintenance backlog items must be a non-empty array")
          ids = [item.get("id") for item in items if isinstance(item, dict)]
          if len(ids) != len(items) or len(ids) != len(set(ids)) or any(not isinstance(x, str) or not x for x in ids):
              raise SystemExit("maintenance backlog item IDs must be unique non-empty strings")
          allowed = {"open", "in_progress", "blocked_pending_live_run", "blocked_pending_supported_lifecycle", "complete"}
          for item in items:
              if item.get("status") not in allowed:
                  raise SystemExit(f"unsupported maintenance status for {item.get('id')}: {item.get('status')}")
              if not isinstance(item.get("acceptance"), list) or not item["acceptance"]:
                  raise SystemExit(f"missing acceptance criteria for {item.get('id')}")
          print(f"Validated {len(items)} file-managed maintenance items; executable work remains in the registered task queue.")
          PY
      - name: Run maintained production preflight suite
        env:
          PYTHONPATH: scripts
        run: python3 scripts/run_preflight_tests.py
      - name: Run Storage Management regression suite
        env:
          PYTHONPATH: storage/v2
        run: python3 -m unittest discover -s tests/v2 -v

  mutate-ledger:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout Storage Management code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/storage/v2/artifacts/sha256/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Apply allowlisted incident ledger operation
        env:
          GITHUB_TOKEN: ${{ secrets.AUTOMATION_WRITE_TOKEN || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          OPERATION: ${{ inputs.operation }}
          WORKFLOW_KEY: ${{ startsWith(inputs.automation_task_id, 'auto-sync-') && 'auto_sync' || 'automation_watchdog' }}
          EVENT_ID: ${{ inputs.automation_task_id }}
          RUN_ID: ${{ inputs.run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          CLASSIFICATION: ${{ inputs.classification }}
          SUMMARY: ${{ inputs.summary }}
          RUN_URL: ${{ inputs.run_url }}
          BEFORE_RUN_ID: ${{ inputs.before_run_id }}
          CLASSIFICATIONS: ${{ inputs.classifications }}
          VERIFICATION_URL: ${{ inputs.verification_url }}
        run: |
          set -euo pipefail
          args=("$OPERATION" --workflow "$WORKFLOW_KEY" --event-id "$EVENT_ID")
          if [ "$OPERATION" = "record" ]; then
            args+=(--run-id "$RUN_ID" --source-sha "$SOURCE_SHA" --classification "$CLASSIFICATION" --summary "$SUMMARY" --run-url "$RUN_URL")
          else
            args+=(--before-run-id "$BEFORE_RUN_ID" --classifications "$CLASSIFICATIONS" --verification-url "$VERIFICATION_URL")
          fi
          python3 storage/v2/incident_store.py "${args[@]}" | tee "$GITHUB_STEP_SUMMARY"


  reconcile-verified-auto-sync-incidents:
    name: Reconcile incidents from independently verified Auto Sync success
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'push') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout Storage Management code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/storage/v2/artifacts/sha256/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Retry recovery from the latest independently verified Auto Sync task
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_WRITE_TOKEN || github.token }}
          GITHUB_TOKEN: ${{ secrets.AUTOMATION_WRITE_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          task_file="$RUNNER_TEMP/verified-auto-sync-task.json"
          run_file="$RUNNER_TEMP/verified-auto-sync-run.json"
          jobs_file="$RUNNER_TEMP/verified-auto-sync-jobs.json"
          current_fingerprint="$(PYTHONPATH=scripts python3 - <<'PY'
          from pathlib import Path
          from production_intent import compute_fingerprint, load_manifest
          root = Path(".")
          manifest = load_manifest(root / "automation" / "production_inputs.json")
          print(compute_fingerprint(root, manifest))
          PY
          )"
          jq --arg current_fingerprint "$current_fingerprint" -c '[.tasks[]
            | select(.status == "SUCCEEDED" and .verification.status == "passed")
            | select(.input.production_fingerprint == $current_fingerprint)
            | select(.dispatch_intent.workflow_id == 402712272
                and .dispatch_intent.workflow_path == ".github/workflows/auto_sync.yml")
            | select(.result.workflow_id == 402712272
                and .result.workflow_path == ".github/workflows/auto_sync.yml"
                and .result.run_evidence.run_id != null)]
            | sort_by(.verification.verified_at) | last // empty' \
            automation/task_queue.json > "$task_file"
          if [ ! -s "$task_file" ]; then
            echo "No independently verified Auto Sync queue task matches current production inputs; incident state is unchanged." \
              | tee "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          run_id="$(jq -er '.result.run_evidence.run_id' "$task_file")"
          gh api "repos/$GH_REPO/actions/runs/$run_id" > "$run_file"
          gh api "repos/$GH_REPO/actions/runs/$run_id/jobs?per_page=100" > "$jobs_file"
          python3 storage/v2/verify_auto_sync_recovery.py \
            --run "$run_file" --jobs "$jobs_file" --queue automation/task_queue.json \
            | tee "$GITHUB_STEP_SUMMARY"
          run_url="$(jq -er '.html_url' "$run_file")"
          python3 storage/v2/incident_store.py resolve \
            --workflow auto_sync \
            --event-id "auto-sync-recovery-$run_id" \
            --before-run-id "$run_id" \
            --classifications PIPELINE_FAILURE \
            --verification-url "$run_url" \
            | tee -a "$GITHUB_STEP_SUMMARY"

  repository-integrity-snapshot:
    name: Inventory repository and pull-request SHAs through File Management
    needs: ingest-actions-artifacts
    if: ${{ always() && ((github.ref == 'refs/heads/main' && github.event_name == 'schedule') || (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.path == '.github/workflows/auto_sync.yml')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout File Management runtime
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/storage/v2/artifacts/sha256/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Capture full Git blob inventory and verify uu.conf is unchanged
        env:
          GITHUB_TOKEN: ${{ secrets.AUTOMATION_WRITE_TOKEN || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          PYTHONPATH=storage/v2 python3 storage/v2/snapshot_repository_integrity.py --repository "$GITHUB_REPOSITORY" | tee "$GITHUB_STEP_SUMMARY"

  poll-recent-actions-artifacts:
    name: Poll and ingest recent completed workflow artifacts
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'push') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout Storage Management runtime
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/storage/v2/artifacts/sha256/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Poll recent Auto Sync and Watchdog artifacts and ingest them
        env:
          GITHUB_TOKEN: ${{ secrets.AUTOMATION_WRITE_TOKEN || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: main
        run: |
          set -euo pipefail
          PYTHONPATH=storage/v2 python3 storage/v2/ingest_actions_artifacts.py --scan-recent | tee "$GITHUB_STEP_SUMMARY"

  ingest-actions-artifacts:
    name: Ingest completed workflow artifacts into Storage Management
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' && (github.event.workflow_run.path == '.github/workflows/auto_sync.yml' || github.event.workflow_run.path == '.github/workflows/automation-watchdog.yml') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout Storage Management runtime
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /*
            !/storage/v2/artifacts/sha256/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Ingest, catalog, and verify source artifacts before cleanup
        env:
          GITHUB_TOKEN: ${{ secrets.AUTOMATION_WRITE_TOKEN || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: main
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          PYTHONPATH=storage/v2 python3 storage/v2/ingest_actions_artifacts.py | tee "$GITHUB_STEP_SUMMARY"
