name: Storage Management
run-name: Storage Management / ${{ github.event.inputs.automation_task_id || github.run_id }}
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
    paths:
      - ".github/workflows/storage-management.yml"
      - "storage/v2/**"
      - "tests/v2/**"
      - ".github/workflows/automation-watchdog.yml"
      - ".github/workflows/auto_sync.yml"
      - ".github/workflows/dashboard-pages.yml"
      - "automation/program_registry.json"
      - "automation/execution_adapters.json"
      - "automation/production_control.json"
      - "scripts/validate_program_registry.py"
      - "scripts/validate_execution_adapters.py"
      - "scripts/remote_task_queue_runtime.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/storage-management.yml"
      - "automation/program_registry.json"
      - "automation/execution_adapters.json"
      - "automation/production_control.json"
      - "scripts/remote_task_queue_runtime.py"
  workflow_run:
    workflows:
      - "Shadowrocket Deterministic Domain Audit (User Config Baseline)"
      - "Shadowrocket automation watchdog"
    types: [completed]
  workflow_dispatch:
    inputs:
      operation:
        description: Storage Management operation
        required: true
        type: choice
        options: [record, resolve, purge_legacy_source_tasks]
      automation_task_id:
        description: Idempotent event identifier and run correlation ID
        required: true
        type: string
      run_id:
        description: Originating workflow run ID for record operations
        required: false
        type: string
      source_sha:
        description: Full source commit SHA for record operations
        required: false
        type: string
      classification:
        description: Incident classification for record operations
        required: false
        type: string
      summary:
        description: Deterministic incident summary
        required: false
        type: string
      run_url:
        description: Originating Actions run URL
        required: false
        type: string
      before_run_id:
        description: Resolve only incidents older than this successful run
        required: false
        type: string
      classifications:
        description: Comma-separated classifications eligible for verified resolution
        required: false
        type: string
      verification_url:
        description: Independently verified recovery run URL
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: storage-management-main
  cancel-in-progress: false
jobs:
  validate-storage:
    name: Validate Storage Management runtime and recovery
    if: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout proposed Storage Management changes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate all retained workflow YAML files and reject duplicate keys
        run: |
          ruby <<'RUBY'
          require "psych"
          def check_unique_keys(node, file)
            return unless node
            if node.is_a?(Psych::Nodes::Mapping)
              seen = {}
              node.children.each_slice(2) do |key, value|
                name = key.respond_to?(:value) ? key.value : key.class.name
                raise "#{file}: duplicate YAML key #{name.inspect}" if seen.key?(name)
                seen[name] = true
                check_unique_keys(value, file)
              end
            elsif node.respond_to?(:children) && node.children
              node.children.each { |child| check_unique_keys(child, file) }
            end
          end
          Dir.glob(".github/workflows/*.yml").sort.each do |file|
            check_unique_keys(Psych.parse_file(file), file)
            puts "Valid YAML with unique mapping keys: #{file}"
          end
          RUBY
      - name: Verify the four-system workflow boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('.github/workflows')
          expected = {'auto_sync.yml', 'automation-watchdog.yml', 'dashboard-pages.yml', 'storage-management.yml'}
          actual = {p.name for p in root.glob('*.yml')}
          if actual != expected:
              raise SystemExit(f'Expected exactly four workflows; found {sorted(actual)}')
          forbidden = ('assessment-completion-relay' + '.yml', 'source-discovery' + '.yml', 'queue-snapshot-artifact' + '.yml', 'validate-config' + '.yml', 'self-healing-agent' + '.yml', 'self-healing-tests' + '.yml', 'storage-incident-management' + '.yml', 'v2-storage-tests' + '.yml')
          for file in root.glob('*.yml'):
              content = file.read_text(encoding='utf-8')
              for name in forbidden:
                  if name in content:
                      raise SystemExit(f'{file} references deleted workflow {name}')
          print('Four workflows present; all YAML parsed; no deleted workflow references.')
          PY
      - name: Validate GitHub Actions workflow semantics
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/*.yml
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Compile Storage Management runtime
        run: python3 -m compileall -q scripts storage/v2
      - name: Validate program registry
        run: python3 scripts/validate_program_registry.py
      - name: Validate execution adapter contracts
        run: python3 scripts/validate_execution_adapters.py
      - name: Run Storage Management regression suite
        env:
          PYTHONPATH: storage/v2
        run: python3 -m unittest discover -s tests/v2 -v
      - name: Run complete repository regression suite
        run: python3 -m unittest discover -s tests -v

  purge-legacy-source-tasks:
    name: Purge superseded Discovery and Assessment tasks from the live queue
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout Storage Management code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Archive and remove legacy tasks through Storage Management
        env:
          GITHUB_TOKEN: ${{ secrets.AUTOMATION_WRITE_TOKEN || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 scripts/remote_task_queue_runtime.py --repository "$GITHUB_REPOSITORY" --branch main purge-legacy-source-tasks | tee "$GITHUB_STEP_SUMMARY"

  mutate-ledger:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout Storage Management code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Apply allowlisted incident ledger operation
        env:
          GITHUB_TOKEN: ${{ secrets.AUTOMATION_WRITE_TOKEN || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          OPERATION: ${{ inputs.operation }}
          WORKFLOW_KEY: automation_watchdog
          EVENT_ID: ${{ inputs.automation_task_id }}
          RUN_ID: ${{ inputs.run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          CLASSIFICATION: ${{ inputs.classification }}
          SUMMARY: ${{ inputs.summary }}
          RUN_URL: ${{ inputs.run_url }}
          BEFORE_RUN_ID: ${{ inputs.before_run_id }}
          CLASSIFICATIONS: ${{ inputs.classifications }}
          VERIFICATION_URL: ${{ inputs.verification_url }}
        run: |
          set -euo pipefail
          if [ "$OPERATION" = "purge_legacy_source_tasks" ]; then
            python3 scripts/remote_task_queue_runtime.py --repository "$GITHUB_REPOSITORY" --branch main purge-legacy-source-tasks | tee "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          args=("$OPERATION" --workflow "$WORKFLOW_KEY" --event-id "$EVENT_ID")
          if [ "$OPERATION" = "record" ]; then
            args+=(--run-id "$RUN_ID" --source-sha "$SOURCE_SHA" --classification "$CLASSIFICATION" --summary "$SUMMARY" --run-url "$RUN_URL")
          else
            args+=(--before-run-id "$BEFORE_RUN_ID" --classifications "$CLASSIFICATIONS" --verification-url "$VERIFICATION_URL")
          fi
          python3 storage/v2/incident_store.py "\${args[@]}" | tee "$GITHUB_STEP_SUMMARY"
  ingest-actions-artifacts:
    name: Ingest completed workflow artifacts into Storage Management
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' && (github.event.workflow_run.path == '.github/workflows/auto_sync.yml' || github.event.workflow_run.path == '.github/workflows/automation-watchdog.yml') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout Storage Management runtime
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Ingest, catalog, and verify source artifacts before cleanup
        env:
          GITHUB_TOKEN: ${{ secrets.AUTOMATION_WRITE_TOKEN || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: main
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          PYTHONPATH=storage/v2 python3 storage/v2/ingest_actions_artifacts.py | tee "$GITHUB_STEP_SUMMARY"

