name: Purge retired queue issue comments
run-name: Purge retired queue issue comments
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/purge-retired-queue-comments.yml"
permissions:
  issues: write
jobs:
  purge:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      issues: write
    steps:
      - name: Delete all comments from retired queue issues
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_WRITE_TOKEN || github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for issue in 423 571; do
            ids_file="$RUNNER_TEMP/issue-$issue-comment-node-ids.txt"
            gh api --paginate "repos/$REPO/issues/$issue/comments?per_page=100" --jq '.[].node_id' > "$ids_file"
            mapfile -t ids < "$ids_file"
            total="${#ids[@]}"
            echo "Issue #$issue: deleting $total comments."
            query="mutation {"
            batch=0
            for node_id in "${ids[@]}"; do
              query+=" c$batch: deleteIssueComment(input: {id: \"$node_id\"}) { clientMutationId }"
              batch=$((batch + 1))
              if [ "$batch" -eq 25 ]; then
                query+=" }"
                gh api graphql -f query="$query" > /dev/null
                query="mutation {"
                batch=0
                sleep 0.5
              fi
            done
            if [ "$batch" -gt 0 ]; then
              query+=" }"
              gh api graphql -f query="$query" > /dev/null
            fi
            remaining="$(gh api "repos/$REPO/issues/$issue" --jq '.comments')"
            echo "Issue #$issue remaining comments: $remaining"
            test "$remaining" -eq 0
          done
          echo "Retired queue issue comments have been deleted." >> "$GITHUB_STEP_SUMMARY"
