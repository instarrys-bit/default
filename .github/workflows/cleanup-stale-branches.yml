name: Cleanup stale branches
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pull-requests: read

concurrency:
  group: cleanup-stale-branches-main
  cancel-in-progress: false

jobs:
  cleanup:
    if: ${{ github.ref_name == 'main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Delete stale branches until only keep-set remains
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          keep_file="$RUNNER_TEMP/keep_branches.txt"
          {
            echo main
            gh api "repos/$GH_REPO/pulls?state=open&per_page=100" --paginate \
              --jq '.[].head.ref' || true
          } | sort -u > "$keep_file"
          echo "Keep list:" >> "$GITHUB_STEP_SUMMARY"
          sed 's/^/- /' "$keep_file" >> "$GITHUB_STEP_SUMMARY"

          deleted=0
          # Always re-read page 1 after deletes so pagination cannot skip branches.
          while true; do
            payload="$(gh api "repos/$GH_REPO/branches?per_page=100&page=1")"
            mapfile -t names < <(printf '%s' "$payload" | jq -r '.[].name')
            if [ "${#names[@]}" -eq 0 ]; then
              break
            fi
            progress=0
            for branch in "${names[@]}"; do
              if grep -Fxq "$branch" "$keep_file"; then
                continue
              fi
              enc="$(printf %s "$branch" | jq -sRr @uri)"
              if gh api -X DELETE "repos/$GH_REPO/git/refs/heads/$enc" >/dev/null; then
                echo "DELETED $branch"
                deleted=$((deleted + 1))
                progress=1
              else
                echo "FAILED $branch" >&2
              fi
            done
            # If page 1 had only keep branches, check whether more pages exist.
            if [ "$progress" -eq 0 ]; then
              page2="$(gh api "repos/$GH_REPO/branches?per_page=100&page=2")"
              count2="$(printf '%s' "$page2" | jq 'length')"
              if [ "$count2" -eq 0 ]; then
                break
              fi
              # Page 2 still has branches; force delete from page 2 names once, then loop.
              mapfile -t names2 < <(printf '%s' "$page2" | jq -r '.[].name')
              for branch in "${names2[@]}"; do
                if grep -Fxq "$branch" "$keep_file"; then
                  continue
                fi
                enc="$(printf %s "$branch" | jq -sRr @uri)"
                if gh api -X DELETE "repos/$GH_REPO/git/refs/heads/$enc" >/dev/null; then
                  echo "DELETED $branch"
                  deleted=$((deleted + 1))
                  progress=1
                else
                  echo "FAILED $branch" >&2
                fi
              done
              if [ "$progress" -eq 0 ]; then
                break
              fi
            fi
          done

          echo "Deleted count: $deleted" >> "$GITHUB_STEP_SUMMARY"
          echo "Remaining branches:" >> "$GITHUB_STEP_SUMMARY"
          gh api "repos/$GH_REPO/branches?per_page=100" --paginate --jq '.[].name' | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
      - name: Disable orphaned validate-config workflow if still registered
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh api "repos/$GH_REPO/actions/workflows/validate-config.yml" >/tmp/wf.json 2>/dev/null; then
            state="$(jq -r '.state' /tmp/wf.json)"
            echo "validate-config state=$state" >> "$GITHUB_STEP_SUMMARY"
            if [ "$state" = "active" ]; then
              gh api --method PUT "repos/$GH_REPO/actions/workflows/validate-config.yml/disable" || true
              echo "Requested disable for validate-config.yml" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "validate-config.yml not registered or not readable" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Remove this one-shot workflow from main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          path=".github/workflows/cleanup-stale-branches.yml"
          sha="$(gh api "repos/$GH_REPO/contents/$path?ref=main" --jq '.sha')"
          gh api -X DELETE "repos/$GH_REPO/contents/$path" \
            -f message="chore: remove one-shot stale branch cleanup workflow" \
            -f sha="$sha" \
            -f branch="main"
          echo "Removed $path from main" >> "$GITHUB_STEP_SUMMARY"
