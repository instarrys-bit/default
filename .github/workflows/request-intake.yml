name: GitHub-only observed-domain intake
run-name: Automation task \${{ inputs.automation_task_id || 'manual' }}

on:
  workflow_dispatch:
    inputs:
      domains:
        description: "Paste hostnames separated by spaces, commas, semicolons or newlines. Hostnames only; no URLs."
        required: true
        type: string
      automation_task_id:
        description: 'Internal task correlation ID; leave blank for manual runs'
        required: false
        type: string

permissions:
  contents: read
  actions: write
  issues: write

# Serialize this repository writer with production publication, Watchdog state
# mutations and self-healing repairs. Git-ref CAS remains a second safety layer.
concurrency:
  group: shadowrocket-domain-intake
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate and persist submitted hostnames
        id: validate
        env:
          DOMAINS: \${{ inputs.domains }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          raw = os.environ.get("DOMAINS", "")
          submitted = [
              value.strip().lower().rstrip(".")
              for value in re.split(r"[\s,;]+", raw)
              if value.strip()
          ]

          # Some manual dispatch clients submit "0" as an empty-input sentinel.
          # Treat that exact value as an empty batch, never as a hostname.
          if submitted == ["0"]:
              submitted = []
          if not submitted:
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write("has_domains=false\n")
              print("No hostnames submitted; intake completed as a safe no-op.")
              raise SystemExit(0)

          if len(submitted) > 500:
              raise SystemExit("Maximum 500 hostnames per intake run.")
          submitted = list(dict.fromkeys(submitted))

          pattern = re.compile(
              r"^(?=.{1,253}$)(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)"
              r"(?:\.(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?))+$"
          )
          invalid = sorted({value for value in submitted if not pattern.fullmatch(value)})
          if invalid:
              raise SystemExit("Invalid hostname(s): " + ", ".join(invalid[:30]))

          destination = Path(os.environ["RUNNER_TEMP"]) / "request-domains.json"
          destination.write_text(
              json.dumps(submitted, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("has_domains=true\n")
          print(f"Validated {len(submitted)} unique hostname observations for external intake storage.")
          PY

      - name: Append observation batch to external intake Issue
        if: steps.validate.outputs.has_domains == 'true'
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/request-domains.json" "$RUNNER_TEMP/intake-comment.md" <<'PY'
          import json
          import os
          import sys
          from datetime import datetime, timezone
          submitted = json.loads(open(sys.argv[1], encoding="utf-8").read())
          payload = {
              "schema_version": 1,
              "run_id": os.environ["GITHUB_RUN_ID"],
              "observed_at": datetime.now(timezone.utc).isoformat(timespec="seconds"),
              "submitted_by": os.environ.get("GITHUB_ACTOR", "unknown"),
              "domains": submitted,
          }
          with open(sys.argv[2], "w", encoding="utf-8") as handle:
              handle.write("<!-- shadowrocket-domain-observation:v1 -->\n")
              handle.write(json.dumps(payload, ensure_ascii=False, separators=(",", ":")))
          PY
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/317/comments" -f body="$(cat "$RUNNER_TEMP/intake-comment.md")" >/dev/null

      - name: Request ruleset audit through Watchdog queue
        if: steps.validate.outputs.has_domains == 'true'
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          set -euo pipefail
          # GITHUB_TOKEN is permitted to trigger workflow_dispatch. The Watchdog
          # creates the durable auto-sync task; intake never dispatches production
          # publication directly.
          gh workflow run automation-watchdog.yml --ref main --repo "$GITHUB_REPOSITORY" --field request_deterministic_audit=true
