name: GitHub-only observed-domain intake
run-name: Automation task ${{ inputs.automation_task_id || 'manual' }}

on:
  workflow_dispatch:
    inputs:
      domains:
      automation_task_id:
        description: 'Internal task correlation ID; leave blank for manual runs'
        required: false
        type: string
        description: "Paste hostnames separated by spaces, commas, semicolons or newlines. Hostnames only; no URLs."
        required: true
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: shadowrocket-request-intake
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate hostnames without repository writes
        env:
          DOMAINS: \${{ inputs.domains }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          raw = os.environ.get("DOMAINS", "")
          domains = sorted(set(value.strip().lower().rstrip(".") for value in re.split(r"[\s,;]+", raw) if value.strip()))
          if not domains:
              raise SystemExit("No hostnames supplied.")
          if len(domains) > 500:
              raise SystemExit("Maximum 500 hostnames per intake run.")
          pattern = re.compile(r"^(?=.{1,253}$)(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)(?:\.(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?))+$")
          invalid = [value for value in domains if not pattern.fullmatch(value)]
          if invalid:
              raise SystemExit("Invalid hostname(s): " + ", ".join(invalid[:30]))
          payload = json.dumps(domains, ensure_ascii=False, separators=(",", ":"))
          if len(payload) > 60000:
              raise SystemExit("The validated batch exceeds the safe workflow-dispatch input size.")
          Path(os.environ["RUNNER_TEMP"], "request-domains.json").write_text(payload, encoding="utf-8")
          print(f"Validated {len(domains)} unique hostnames; forwarding them as unclassified candidates.")
          PY

      - name: Enqueue through the Watchdog control plane
        env:
          GH_TOKEN: \${{ github.token }}
          REPO: \${{ github.repository }}
        run: |
          set -euo pipefail
          observations="$(cat "$RUNNER_TEMP/request-domains.json")"
          gh workflow run automation-watchdog.yml --repo "$REPO" --ref main \
            --field request_deterministic_audit=true \
            --field request_observations_json="$observations"
