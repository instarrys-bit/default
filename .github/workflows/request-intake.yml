name: GitHub-only observed-domain intake
run-name: Automation task ${{ inputs.automation_task_id || 'manual' }}

on:
  workflow_dispatch:
    inputs:
      domains:
        description: "Paste hostnames separated by spaces, commas, semicolons or newlines. Hostnames only; no URLs."
        required: true
        type: string
      automation_task_id:
        description: 'Internal task correlation ID; leave blank for manual runs'
        required: false
        type: string

permissions:
  contents: write
  actions: write

# Intake commits are rebased safely on push; do not let a shared pending
# writer slot discard a user's submitted hostname batch.
concurrency:
  group: shadowrocket-request-intake-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true

      - name: Validate and merge submitted hostnames
        env:
          DOMAINS: ${{ inputs.domains }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re
          from datetime import datetime, timezone
          from pathlib import Path

          raw = os.environ.get("DOMAINS", "")
          submitted = [x.strip().lower().rstrip(".") for x in re.split(r"[\s,;]+", raw) if x.strip()]
          if not submitted:
              raise SystemExit("No hostnames supplied.")
          if len(submitted) > 500:
              raise SystemExit("Maximum 500 hostnames per intake run.")

          pattern = re.compile(r"^(?=.{1,253}$)(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)(?:\.(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?))+$")
          invalid = sorted({d for d in submitted if not pattern.fullmatch(d)})
          if invalid:
              raise SystemExit("Invalid hostname(s): " + ", ".join(invalid[:30]))

          now = datetime.now(timezone.utc).isoformat(timespec="seconds")
          path = Path("sources/request_domain_observations.json")
          payload = json.loads(path.read_text(encoding="utf-8")) if path.exists() else {"schema_version": 1, "observations": []}
          if payload.get("schema_version") != 1 or not isinstance(payload.get("observations"), list):
              raise SystemExit("Unsupported observation ledger schema.")

          rows = {row["domain"]: row for row in payload["observations"]}
          for domain in sorted(set(submitted)):
              old = rows.get(domain, {})
              rows[domain] = {
                  "domain": domain,
                  "first_seen": old.get("first_seen") or now,
                  "last_seen": now,
                  "observations": int(old.get("observations", 0)) + submitted.count(domain),
                  "intake": "github-workflow-dispatch"
              }

          payload = {"schema_version": 1, "observations": [rows[k] for k in sorted(rows)]}
          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"Accepted {len(submitted)} hostname observations; {len(rows)} unique hostnames in ledger.")
          PY

      - name: Commit observation ledger
        run: |
          set -euo pipefail
          git add -- sources/request_domain_observations.json
          if git diff --cached --quiet; then
            echo "Observation ledger unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Import observed domains through GitHub Actions"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                echo "Observation ledger committed to main."
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Could not publish the observation ledger after three safe push attempts." >&2
                exit 1
              fi
              echo "Main advanced during intake publication; rebasing the isolated observation commit (attempt $attempt)."
              git fetch origin main
              git rebase origin/main
            done
          fi

      - name: Request ruleset audit through Watchdog queue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # GITHUB_TOKEN is permitted to trigger workflow_dispatch. The Watchdog
          # creates the durable auto-sync task; intake never dispatches production
          # publication directly.
          gh workflow run automation-watchdog.yml --ref main --repo "$GITHUB_REPOSITORY"
