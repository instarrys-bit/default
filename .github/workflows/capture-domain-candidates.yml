name: Capture new Shadowrocket domain candidates
on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:
  push:
    paths:
      - "sources/policy.json"
      - "scripts/capture_domain_candidates.py"
      - ".github/workflows/capture-domain-candidates.yml"
permissions:
  contents: write
concurrency:
  group: shadowrocket-main-writer
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Capture and compare domain-only source
        run: python3 scripts/capture_domain_candidates.py
      - name: Validate generated queue
        run: python3 -m json.tool reports/pending-gpt-review.json >/dev/null
      - name: Commit queue and source fingerprint
        run: |
          git diff --check
          git add reports/domain-source-bloom.json reports/pending-gpt-review.json reports/domain-capture.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: capture new domain candidates"
          git pull --rebase origin main
          git push
