name: Shadowrocket Safe Audit

on:
  schedule:
    # Every Monday at 04:00 China Standard Time (Sunday 20:00 UTC)
    - cron: "0 20 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shadowrocket-safe-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Audit canonical config and DNS invariants
        run: python3 scripts/audit_pipeline.py
