# Request observations enter only as unclassified candidates; trusted source evidence controls policy.
name: Shadowrocket Deterministic Domain Audit (User Config Baseline)
run-name: Automation task ${{ inputs.automation_task_id || 'manual' }}

on:
  workflow_dispatch:
    inputs:
      restore_ids:
        description: 'Comma-separated lifecycle deletion IDs to restore (optional)'
        required: false
        type: string
      restore_conflict_ids:
        description: 'Comma-separated config-conflict archive IDs to restore after rechecking uu.conf (optional)'
        required: false
        type: string
      automation_task_id:
        description: 'Required Watchdog-owned durable task correlation ID'
        required: true
        type: string
      resource_lease_proof:
        description: 'Watchdog-issued exclusive production resource lease IDs and fencing tokens'
        required: true
        type: string
      baseline_source_event:
        description: 'Original event type preserved by the Watchdog queue'
        required: false
        type: string
      baseline_source_actor:
        description: 'Original actor preserved by the Watchdog queue'
        required: false
        type: string
      baseline_source_before:
        description: 'Original push before SHA for config baseline registration'
        required: false
        type: string
      baseline_source_sha:
        description: 'Original push SHA for config baseline registration'
        required: false
        type: string
      production_fingerprint:
        description: 'Watchdog-computed production input fingerprint'
        required: false
        type: string
      production_decision:
        description: 'Watchdog production intent decision'
        required: false
        type: string
      production_reason:
        description: 'Auditable reason for this production task'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: shadowrocket-main-writer
  # Keep the active audit; stale-commit guards stop obsolete runs safely.
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      PYTHONPATH: scripts
      SOURCE_DISCOVERY_MODE: ${{ vars.SOURCE_DISCOVERY_MODE || 'monolithic_fallback' }}
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Isolate production writes in a temporary workspace
        run: |
          set -euo pipefail
          workspace="$RUNNER_TEMP/production-workspace"
          mkdir -p "$workspace"
          cp -a "$GITHUB_WORKSPACE/." "$workspace/"
          printf 'cd "%s"\\n' "$workspace" > "$RUNNER_TEMP/production-workspace.bashenv"
          echo "BASH_ENV=$RUNNER_TEMP/production-workspace.bashenv" >> "$GITHUB_ENV"
      - name: Verify Watchdog-owned durable task dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RESOURCE_LEASE_PROOF: ${{ inputs.resource_lease_proof }}
          AUTOMATION_TASK_ID: ${{ inputs.automation_task_id }}
          PRODUCTION_FINGERPRINT: ${{ inputs.production_fingerprint }}
          PRODUCTION_DECISION: ${{ inputs.production_decision }}
          PRODUCTION_REASON: ${{ inputs.production_reason }}
          BASELINE_SOURCE_EVENT: ${{ inputs.baseline_source_event }}
          BASELINE_SOURCE_ACTOR: ${{ inputs.baseline_source_actor }}
          BASELINE_SOURCE_BEFORE: ${{ inputs.baseline_source_before }}
          BASELINE_SOURCE_SHA: ${{ inputs.baseline_source_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          correlation = os.environ.get("AUTOMATION_TASK_ID", "")
          match = re.fullmatch(r"(task_[0-9a-f]{24})-a([1-9][0-9]*)", correlation)
          if not match:
              raise SystemExit("A valid Watchdog task correlation is required; direct/manual audit dispatch is not authorized.")

          task_id, attempt_text = match.groups()
          attempt = int(attempt_text)
          # The workflow input is a correlation ID (task_id + attempt). The
          # resource lease verifier must receive the canonical queue task ID.
          queue = json.loads(Path("automation/task_queue.json").read_text(encoding="utf-8"))
          task = next((item for item in queue.get("tasks", []) if item.get("task_id") == task_id), None)
          if task is None:
              raise SystemExit("The correlated durable task does not exist in the checked-out queue snapshot.")
          lease = task.get("lease")
          resource_lease = task.get("resource_lease")
          proof_text = os.environ.get("RESOURCE_LEASE_PROOF", "")
          try:
              proof = json.loads(proof_text)
          except json.JSONDecodeError as exc:
              raise SystemExit("The Watchdog resource lease proof is not valid JSON.") from exc
          declared = resource_lease.get("resources") if isinstance(resource_lease, dict) else None
          queue_leases = queue.get("resource_leases")
          if (task.get("status") not in {"CLAIMED", "VERIFYING"}
                  or not isinstance(resource_lease, dict) or resource_lease.get("status") != "ACTIVE"
                  or not isinstance(declared, dict) or proof != declared
                  or not isinstance(queue_leases, dict) or not isinstance(proof, dict) or not proof):
              raise SystemExit("The Watchdog resource lease proof is missing, inactive or inconsistent.")
          workers = set()
          from datetime import datetime, timezone
          now = datetime.now(timezone.utc)
          for key, item in proof.items():
              record = queue_leases.get(key)
              if (not isinstance(record, dict) or record.get("status") != "ACTIVE"
                      or record.get("task_id") != task_id
                      or record.get("lease_id") != item.get("lease_id")
                      or record.get("fencing_token") != item.get("fencing_token")):
                  raise SystemExit("The Watchdog resource lease is stale or fenced: " + key)
              expiry = datetime.fromisoformat(record["expires_at"].replace("Z", "+00:00"))
              if expiry <= now:
                  raise SystemExit("The Watchdog resource lease has expired: " + key)
              workers.add(record.get("worker_id"))
          if len(workers) != 1 or not next(iter(workers)):
              raise SystemExit("The Watchdog resource leases do not share one active worker owner.")
          worker_id = next(iter(workers))
          # The resource lease owner is the write authority. The scheduler task
          # lease may rotate independently while this exclusive resource fence remains active.
          if task.get("status") == "CLAIMED" and (
                  not isinstance(lease, dict) or not lease.get("owner") or not lease.get("token")):
              raise SystemExit("A CLAIMED task must retain its scheduler task lease.")
          task_lease_token = lease.get("token") if isinstance(lease, dict) else "resource-fence-only"
          env_values = {
              "AUTOMATION_TASK_ID": task_id,
              "AUTOMATION_WORKER_ID": worker_id,
              "AUTOMATION_TASK_LEASE_TOKEN": task_lease_token,
              "AUTOMATION_QUEUE_REPOSITORY": os.environ["GITHUB_REPOSITORY"],
              "AUTOMATION_QUEUE_BRANCH": "main",
              "AUTOMATION_QUEUE_PATH": "automation/task_queue.json",
              "AUTOMATION_QUEUE_TOKEN": os.environ["GH_TOKEN"],
              "AUTOMATION_QUEUE_SNAPSHOT": str(Path("automation/task_queue.json").resolve()),
              "AUTOMATION_REQUIRE_RESOURCE_LEASE": "1",
          }
          delimiter = "__WATCHDOG_RESOURCE_PROOF__"
          if delimiter in proof_text:
              raise SystemExit("The resource proof contains an invalid environment delimiter.")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as stream:
              stream.write(f"AUTOMATION_TASK_ID_BASE={task_id}\n")
              for key, value in env_values.items():
                  stream.write(f"{key}={value}\n")
              stream.write(f"AUTOMATION_RESOURCE_LEASE_PROOF<<{delimiter}\n{proof_text}\n{delimiter}\n")

          intent = task.get("dispatch_intent")
          if (
              task.get("target_program_id") != "workflow_auto_sync"
              or task.get("requester_program_id") != "workflow_automation_watchdog"
              or task.get("attempts") != attempt
              or not isinstance(intent, dict)
              or intent.get("task_id") != task_id
              or intent.get("correlation_id") != correlation
              or intent.get("dispatch_attempt") != attempt
              or intent.get("workflow_path") != ".github/workflows/auto_sync.yml"
              or intent.get("ref") != "main"
          ):
              raise SystemExit("The queue record does not authorize this exact Watchdog production audit dispatch.")

          production_fingerprint = os.environ.get("PRODUCTION_FINGERPRINT", "")
          production_decision = os.environ.get("PRODUCTION_DECISION", "")
          production_reason = os.environ.get("PRODUCTION_REASON", "")
          if production_fingerprint:
              task_input = task.get("input")
              if (
                  not isinstance(task_input, dict)
                  or task_input.get("production_fingerprint") != production_fingerprint
                  or task_input.get("production_decision") != production_decision
                  or task_input.get("production_reason") != production_reason
                  or production_decision not in {"INPUT_CHANGED", "SCHEDULE_DUE", "RECOVERY_REQUIRED"}
                  or not production_reason
              ):
                  raise SystemExit("The dispatched production intent does not match the durable task input.")
          task_input = task.get("input")
          if not isinstance(task_input, dict):
              raise SystemExit("The durable task input is missing or invalid.")
          for field, env_name in (
              ("baseline_source_event", "BASELINE_SOURCE_EVENT"),
              ("baseline_source_actor", "BASELINE_SOURCE_ACTOR"),
              ("baseline_source_before", "BASELINE_SOURCE_BEFORE"),
              ("baseline_source_sha", "BASELINE_SOURCE_SHA"),
          ):
              supplied = os.environ.get(env_name, "")
              durable_value = task_input.get(field, "")
              if durable_value != supplied:
                  raise SystemExit(f"Dispatched {field} does not match the durable Watchdog task input.")
          baseline_sha = os.environ.get("BASELINE_SOURCE_SHA", "")
          if baseline_sha and not re.fullmatch(r"[0-9a-f]{40}", baseline_sha):
              raise SystemExit("The dispatched baseline source SHA is not a full Git commit SHA.")
          if task.get("status") == "VERIFYING":
              result = task.get("result")
              if (
                  not isinstance(result, dict)
                  or result.get("correlation_id") != correlation
                  or result.get("dispatch_state") != "submitted"
              ):
                  raise SystemExit("The VERIFYING task has no matching persisted dispatch submission.")

          print(f"Authorized Watchdog production audit task {task_id}, attempt {attempt}.")
          PY

      - name: Verify live Watchdog resource lease before production audit
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RESOURCE_LEASE_PROOF: ${{ inputs.resource_lease_proof }}
        run: |
          set -euo pipefail
          test -n "${AUTOMATION_TASK_ID_BASE:-}"
          printf '%s' "$GH_TOKEN" | python3 scripts/resource_lease_runtime.py --repository "$GITHUB_REPOSITORY" --branch main --token-stdin assert-workflow --task-id "$AUTOMATION_TASK_ID_BASE" --proof-json "$RESOURCE_LEASE_PROOF"

      - name: Register repository-owner-approved uu.conf changes (never edit the config)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_NAME: ${{ inputs.baseline_source_event || github.event_name }}
          GITHUB_ACTOR: ${{ inputs.baseline_source_actor || github.actor }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_BEFORE: ${{ inputs.baseline_source_before || github.event.before }}
          GITHUB_SHA: ${{ inputs.baseline_source_sha || github.sha }}
        run: python3 scripts/register_config_baseline.py
      - name: Verify registered user config baseline
        run: python3 scripts/verify_baseline.py --baseline-only
      - name: Capture and verify the exact production input fingerprint
        env:
          PRODUCTION_FINGERPRINT: ${{ inputs.production_fingerprint }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from production_intent import load_manifest, compute_fingerprint
          manifest = load_manifest(Path("automation/production_inputs.json"))
          actual = compute_fingerprint(Path("."), manifest)
          expected = os.environ.get("PRODUCTION_FINGERPRINT", "")
          if expected and expected != actual:
              raise SystemExit("The dispatched production fingerprint does not match the checked-out input snapshot.")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as stream:
              stream.write(f"PRODUCTION_INPUT_FINGERPRINT={actual}\n")
          print(f"Captured production input fingerprint {actual}.")
          PY

      - name: Stop stale audit before discovery and source downloads
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          bash scripts/verify_publish_base.sh --check-only

      - name: Compile and run deterministic review tests
        env:
        run: |
          python3 -m compileall -q scripts tests
          python3 -m unittest discover -s tests -v

      - name: Discover candidate source repositories (non-activating)
        if: ${{ env.SOURCE_DISCOVERY_MODE != 'independent' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/discover_sources.py

      - name: Assess discovered rule-list syntax and policy claims
        if: ${{ env.SOURCE_DISCOVERY_MODE != 'independent' }}
        run: |
          python3 scripts/assess_sources.py
          python3 scripts/append_step_summary.py --input reports/source-assessment.md

      - name: Remove published and queued rules that conflict with uu.conf
        env:
          RULESET_CONFIG_RESTORE_IDS: ${{ github.event.inputs.restore_conflict_ids || '' }}
          RULESET_CONFIG_REPORT_AGGREGATION: "1"
        run: |
          python3 scripts/sync_ruleset_config_conflicts.py
          python3 scripts/append_step_summary.py --input reports/ruleset-config-conflict-sync.md

      - name: Import observed request hostnames as unclassified candidates
        run: python3 scripts/import_request_observations.py

      - name: Audit public source lineage and shared upstreams
        run: python3 scripts/audit_source_lineage.py

      - name: Audit domain-level policy-source overlap and contradictions
        run: |
          python3 scripts/audit_policy_source_overlap.py
          python3 scripts/append_step_summary.py --input reports/policy-source-overlap.md

      - name: Build automated source candidate and lineage matrix
        run: |
          python3 scripts/build_source_candidates.py
          python3 scripts/append_step_summary.py --input reports/source-candidate-matrix.md

      - name: Admit stable policy-evidenced sources without AI review
        run: |
          python3 scripts/auto_activate_sources.py
          python3 scripts/append_step_summary.py --input reports/source-activation.md

      - name: Collect and cross-check all enabled domain sources
        run: python3 scripts/collect_domains.py

      - name: Stop stale audit before expensive deterministic review
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          bash scripts/verify_publish_base.sh --check-only
      - name: "Audit each domain: deduplicate, resolve conflicts, grade evidence and protect critical services"
        run: python3 scripts/deterministic_review.py

      - name: Preserve resumable review cursor checkpoint
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: review-cursor-checkpoint
          path: sources/review_cursor.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Build standalone DIRECT, PROXY and REJECT rule sets
        run: python3 scripts/build_rulesets.py

      - name: Evaluate lifecycle milestones and monthly capacity review
        run: python3 scripts/lifecycle_gate.py

      - name: Run conservative lifecycle audit and selectable restoration
        env:
          LIFECYCLE_RESTORE_IDS: ${{ github.event.inputs.restore_ids || '' }}
        run: |
          python3 scripts/lifecycle_audit.py
          if [ -f reports/lifecycle/latest.md ]; then python3 scripts/append_step_summary.py --input reports/lifecycle/latest.md; fi

      - name: Reconcile final uu.conf scope coverage after all rule mutations
        env:
          RULESET_CONFIG_REPORT_AGGREGATION: "1"
        run: |
          python3 scripts/sync_ruleset_config_conflicts.py
          python3 scripts/append_step_summary.py --input reports/ruleset-config-conflict-sync.md
      - name: Reconcile final RULE-SET manifest counts
        run: python3 scripts/refresh_ruleset_manifest.py

      - name: Build append-only rule-level provenance ledger
        run: python3 scripts/build_rule_provenance.py

      - name: Validate Shadowrocket config structure
        run: python3 scripts/validate_config.py

      - name: Audit RULE-SET references against generated outputs (read-only)
        run: |
          python3 scripts/audit_ruleset_references.py
          python3 scripts/append_step_summary.py --input reports/ruleset-reference-audit.md

      - name: Audit candidate scope coverage against user config (read-only)
        run: |
          python3 scripts/audit_ruleset_config_overlap.py
          python3 scripts/append_step_summary.py --input reports/ruleset-config-overlap-audit.md

      - name: Audit managed config drift (read-only)
        run: |
          python3 scripts/audit_config_drift.py
          python3 scripts/append_step_summary.py --input reports/config-drift-audit.md

      - name: Run read-only full-source regression audit
        run: |
          python3 scripts/audit_external_domains.py
          python3 scripts/append_step_summary.py --input reports/external-domain-audit.md

      - name: Build consolidated project status
        run: |
          python3 scripts/build_project_status.py
          python3 scripts/append_step_summary.py --input reports/project-status.md

      - name: Write successful audit heartbeat
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          from datetime import datetime, timezone
          from production_intent import load_manifest, compute_fingerprint, compute_output_fingerprint
          from pathlib import Path
          Path("reports/automation").mkdir(parents=True, exist_ok=True)
          manifest = load_manifest(Path("automation/production_inputs.json"))
          input_fingerprint = os.environ["PRODUCTION_INPUT_FINGERPRINT"]
          post_run_input_fingerprint = compute_fingerprint(Path("."), manifest)
          output_fingerprint = compute_output_fingerprint(Path("."))
          record = {
              "schema_version": 3,
              "input_fingerprint": input_fingerprint,
              "post_run_input_fingerprint": post_run_input_fingerprint,
              "output_fingerprint": output_fingerprint,
              "input_manifest_schema_version": manifest["schema_version"],
              "status": "audit_passed",
              "workflow": "Shadowrocket Deterministic Domain Audit (User Config Baseline)",
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "event": os.environ["GITHUB_EVENT_NAME"],
              "source_commit": os.environ["GITHUB_SHA"],
              "production_decision": os.environ.get("PRODUCTION_DECISION", ""),
              "production_reason": os.environ.get("PRODUCTION_REASON", ""),
              "recorded_at_utc": datetime.now(timezone.utc).isoformat(),
              "checks": {
                  "deterministic_tests": "passed",
                  "user_config_baseline": "passed",
                  "config_conflict_sync": "passed",
                  "lifecycle_audit": "passed",
                  "three_policy_rule_sets": "passed",
                  "config_validation": "passed",
                  "source_and_rule_audits": "passed"
              },
              "protected_config": {
                  "path": "modules/uu.conf",
                  "modified_by_automation": False
              }
          }
          with open("reports/automation/heartbeat.json", "w", encoding="utf-8") as stream:
              json.dump(record, stream, ensure_ascii=False, indent=2)
              stream.write("\n")
          PY

      - name: Package ruleset outputs only
        run: |
          set -euo pipefail
          test -d rulesets
          tar -czf "$RUNNER_TEMP/audit-output.tar.gz" -- rulesets

      - name: Upload allowlisted audit outputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deterministic-audit-output
          path: ${{ runner.temp }}/audit-output.tar.gz
          if-no-files-found: error
          retention-days: 90
  publish:
    needs: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: scripts
      AUTOMATION_REQUIRE_RESOURCE_LEASE: "1"
    permissions:
      contents: write
    steps:
      - name: Checkout exact audited commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Revalidate Watchdog task and export canonical lease context
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AUTOMATION_TASK_ID: ${{ inputs.automation_task_id }}
          RESOURCE_LEASE_PROOF: ${{ inputs.resource_lease_proof }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          correlation = os.environ.get("AUTOMATION_TASK_ID", "")
          match = re.fullmatch(r"(task_[0-9a-f]{24})-a([1-9][0-9]*)", correlation)
          if not match:
              raise SystemExit("Publish requires a canonical Watchdog task correlation.")
          task_id, attempt_text = match.groups()
          attempt = int(attempt_text)
          queue = json.loads(Path("automation/task_queue.json").read_text(encoding="utf-8"))
          task = next((x for x in queue.get("tasks", []) if isinstance(x, dict) and x.get("task_id") == task_id), None)
          proof_text = os.environ.get("RESOURCE_LEASE_PROOF", "")
          try:
              proof = json.loads(proof_text)
          except json.JSONDecodeError as exc:
              raise SystemExit("Publish resource lease proof is invalid JSON.") from exc
          lease = task.get("lease") if isinstance(task, dict) else None
          intent = task.get("dispatch_intent") if isinstance(task, dict) else None
          if (not isinstance(task, dict) or task.get("target_program_id") != "workflow_auto_sync"
                  or task.get("requester_program_id") != "workflow_automation_watchdog"
                  or task.get("attempts") != attempt or not isinstance(intent, dict)
                  or intent.get("task_id") != task_id or intent.get("dispatch_attempt") != attempt
                  or intent.get("correlation_id") != correlation
                  or intent.get("workflow_path") != ".github/workflows/auto_sync.yml"
                  or intent.get("ref") != "main"
                  or not isinstance(lease, dict) or not lease.get("owner") or not lease.get("token")
                  or not isinstance(proof, dict) or not proof):
              raise SystemExit("The current queue record does not authorize this exact publish attempt.")
          values = {
              "AUTOMATION_TASK_ID_BASE": task_id,
              "AUTOMATION_TASK_ID": task_id,
              "AUTOMATION_WORKER_ID": lease["owner"],
              "AUTOMATION_TASK_LEASE_TOKEN": lease["token"],
              "AUTOMATION_QUEUE_REPOSITORY": os.environ["GITHUB_REPOSITORY"],
              "AUTOMATION_QUEUE_BRANCH": "main",
              "AUTOMATION_QUEUE_PATH": "automation/task_queue.json",
              "AUTOMATION_QUEUE_TOKEN": os.environ["GH_TOKEN"],
              "AUTOMATION_QUEUE_SNAPSHOT": str(Path("automation/task_queue.json").resolve()),
          }
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as stream:
              for key, value in values.items():
                  stream.write(f"{key}={value}\n")
              delimiter = "__PUBLISH_RESOURCE_PROOF__"
              if delimiter in proof_text:
                  raise SystemExit("Invalid publish proof delimiter.")
              stream.write(f"AUTOMATION_RESOURCE_LEASE_PROOF<<{delimiter}\n{proof_text}\n{delimiter}\n")
          PY

      - name: Verify live Watchdog resource lease before artifact restoration
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RESOURCE_LEASE_PROOF: ${{ inputs.resource_lease_proof }}
        run: |
          set -euo pipefail
          test -n "${AUTOMATION_TASK_ID_BASE:-}"
          printf '%s' "$GH_TOKEN" | python3 scripts/resource_lease_runtime.py --repository "$GITHUB_REPOSITORY" --branch main --token-stdin assert-workflow --task-id "$AUTOMATION_TASK_ID_BASE" --proof-json "$RESOURCE_LEASE_PROOF"

      - name: Download audited outputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: deterministic-audit-output
          path: ${{ runner.temp }}/audit-artifact

      - name: Verify base commit and safely publish allowlisted outputs
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RESOURCE_LEASE_PROOF: ${{ inputs.resource_lease_proof }}
        run: |
          set -euo pipefail
          bash scripts/verify_publish_base.sh

          printf '%s' "$GH_TOKEN" | python3 scripts/resource_lease_runtime.py --repository "$GITHUB_REPOSITORY" --branch main --token-stdin assert-workflow --task-id "$AUTOMATION_TASK_ID_BASE" --proof-json "$RESOURCE_LEASE_PROOF"
          archive="$RUNNER_TEMP/audit-artifact/audit-output.tar.gz"
          test -s "$archive"
          python3 scripts/restore_automation_state.py --publish-outputs --archive "$archive" --root .

          # The user-managed config is immutable: audit artifacts may never alter it.
          git diff --quiet "$GITHUB_SHA" -- modules/uu.conf || {
            echo "Protected config modules/uu.conf changed during audit packaging; refusing to publish."
            exit 1
          }

          # The only production artifact permitted to persist in the repository.
          git add -A -- rulesets/
          staged_paths="$(git diff --cached --name-only)"
          if [ -n "$staged_paths" ]; then
            while IFS= read -r path; do
              case "$path" in
                rulesets/*) ;;
                *) echo "Unexpected production publication path: $path"; exit 1 ;;
              esac
            done <<< "$staged_paths"
          fi

          # Explicitly fail if the protected config somehow entered the staged commit.
          git diff --cached --quiet "$GITHUB_SHA" -- modules/uu.conf || {
            echo "Protected config modules/uu.conf is staged; refusing to commit."
            exit 1
          }

          # Even a no-change run must finish under its original fencing epoch.
          printf '%s' "$GH_TOKEN" | python3 scripts/resource_lease_runtime.py --repository "$GITHUB_REPOSITORY" --branch main --token-stdin assert-workflow --task-id "$AUTOMATION_TASK_ID_BASE" --proof-json "$RESOURCE_LEASE_PROOF"

          if git diff --cached --quiet; then
            echo "No audit output changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Run deterministic Shadowrocket domain audit"
          # Re-read the live queue and verify the exact fencing epoch immediately before the main-branch write.
          printf '%s' "$GH_TOKEN" | python3 scripts/resource_lease_runtime.py --repository "$GITHUB_REPOSITORY" --branch main --token-stdin assert-workflow --task-id "$AUTOMATION_TASK_ID_BASE" --proof-json "$RESOURCE_LEASE_PROOF"
          git push origin HEAD:main

      - name: Independently verify committed remote rulesets
        run: |
          set -euo pipefail
          git fetch origin main
          python3 scripts/verify_published_rulesets.py --ref origin/main | tee /tmp/publish-verification.json
          python3 scripts/append_step_summary.py --input /tmp/publish-verification.json
