name: Shadowrocket Safe Audit and Auto Publish

on:
  schedule:
    # Every Monday at 04:00 China Standard Time (Sunday 20:00 UTC)
    - cron: "0 20 * * 0"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "sources/gpt_domain_reviews.json"
      - "sources/policy.json"

permissions:
  contents: write

concurrency:
  group: shadowrocket-safe-audit
  cancel-in-progress: false

jobs:
  audit-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Import approved GPT-reviewed domains into managed ss.conf block
        run: python3 scripts/import_gpt_reviewed_domains.py

      - name: Audit canonical config and DNS invariants
        run: python3 scripts/audit_pipeline.py

      - name: Validate config structure
        run: python3 scripts/validate_config.py

      - name: Audit pinned external domain-only source
        run: |
          python3 scripts/audit_external_domains.py
          cat reports/external-domain-audit.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit approved config changes
        run: |
          if ! git diff --quiet -- shadowrocket/ss.conf reports/pending-gpt-review.json reports/gpt-domain-publication.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add shadowrocket/ss.conf reports/pending-gpt-review.json reports/gpt-domain-publication.md
            git commit -m "Auto-publish approved GPT-reviewed Shadowrocket domains"
            git push
          else
            echo "No approved domain changes to publish."
          fi
