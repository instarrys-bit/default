name: Shadowrocket Deterministic Domain Audit (Immutable Baseline)

on:
  schedule:
    - cron: "0 20 * * 0"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "sources/policy.json"
      - "shadowrocket/ss.conf"
      - "sources/domain_sources.json"
      - "sources/protected_domains.json"
      - "sources/request_domain_observations.json"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/auto_sync.yml"

permissions:
  contents: read

concurrency:
  group: shadowrocket-main-writer
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Compile and run deterministic review tests
        run: |
          python3 -m py_compile scripts/collect_domains.py scripts/deterministic_review.py scripts/domain_rule_engine.py scripts/source_registry.py scripts/build_rulesets.py scripts/validate_config.py scripts/verify_baseline.py scripts/audit_source_lineage.py scripts/discover_sources.py scripts/assess_sources.py scripts/build_source_candidates.py scripts/audit_policy_source_overlap.py scripts/audit_external_domains.py scripts/import_request_observations.py
          python3 -m unittest discover -s tests -v

      - name: Discover candidate source repositories (non-activating)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/discover_sources.py

      - name: Assess discovered rule-list syntax and policy claims
        run: |
          python3 scripts/assess_sources.py
          cat reports/source-assessment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Verify immutable uploaded baseline
        run: python3 scripts/verify_baseline.py --baseline-only

      - name: Import observed request hostnames as unclassified candidates
        run: python3 scripts/import_request_observations.py

      - name: Collect and cross-check domain-only sources
        run: python3 scripts/collect_domains.py

      - name: Audit public source lineage and shared upstreams
        run: python3 scripts/audit_source_lineage.py

      - name: Audit domain-level policy-source overlap and contradictions
        run: |
          python3 scripts/audit_policy_source_overlap.py
          cat reports/policy-source-overlap.md >> "$GITHUB_STEP_SUMMARY"

      - name: Build automated source candidate and lineage matrix
        run: |
          python3 scripts/build_source_candidates.py
          cat reports/source-candidate-matrix.md >> "$GITHUB_STEP_SUMMARY"

      - name: "Audit each domain: deduplicate, resolve conflicts, grade evidence and protect critical services"
        run: python3 scripts/deterministic_review.py

      - name: Build standalone DIRECT, PROXY and REJECT rule sets
        run: python3 scripts/build_rulesets.py

      - name: Validate Shadowrocket config structure
        run: python3 scripts/validate_config.py

      - name: Audit managed config drift (read-only)
        run: |
          python3 scripts/audit_config_drift.py
          cat reports/config-drift-audit.md >> "$GITHUB_STEP_SUMMARY"

      - name: Run read-only full-source regression audit
        run: |
          python3 scripts/audit_external_domains.py
          cat reports/external-domain-audit.md >> "$GITHUB_STEP_SUMMARY"

      - name: Package allowlisted audit outputs
        run: |
          tar -czf audit-output.tar.gz \
            sources/domain_reviews.json \
            reports/external-domain-audit.md \
            reports/config-drift-audit.md \
            reports/config-drift-audit.json \
            reports/source-lineage-audit.json \
            reports/source-discovery.md \
            reports/source-assessment.md \
            reports/source-candidate-matrix.md \
            reports/policy-source-overlap.md \
            sources/policy_source_overlap.json \
            sources/discovered_sources.json \
            sources/source_assessments.json \
            sources/source_candidates.json \
            data/domain_candidates.json \
            data/primary_snapshot.txt \
            data/secondary_snapshot.txt \
            data/source_snapshots \
            rulesets

      - name: Upload allowlisted audit outputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deterministic-audit-output
          path: audit-output.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout exact audited commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Download audited outputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: deterministic-audit-output
          path: audit-artifact

      - name: Verify base commit and safely publish allowlisted outputs
        run: |
          set -euo pipefail
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "main changed while audit was running; refusing to publish stale output."
            exit 1
          fi

          archive="audit-artifact/audit-output.tar.gz"
          test -s "$archive"
          if tar -tzf "$archive" | grep -E '(^/|(^|/)\.\.(/|$))'; then
            echo "Unsafe path found in audit artifact."
            exit 1
          fi
          tar -xzf "$archive" -C .

          git add -- \
            sources/domain_reviews.json \
            reports/external-domain-audit.md \
            reports/source-lineage-audit.json \
            reports/source-discovery.md \
            reports/source-assessment.md \
            reports/source-candidate-matrix.md \
            reports/policy-source-overlap.md \
            sources/policy_source_overlap.json \
            sources/discovered_sources.json \
            sources/source_assessments.json \
            sources/source_candidates.json \
            data/domain_candidates.json \
            data/primary_snapshot.txt \
            data/secondary_snapshot.txt \
            data/source_snapshots/ \
            rulesets/

          if git diff --cached --quiet; then
            echo "No audit output changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Run deterministic Shadowrocket domain audit"
          git push origin HEAD:main

  notify-failure:
    if: ${{ always() && (needs.audit.result == 'failure' || needs.publish.result == 'failure') }}
    needs: [audit, publish]
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Open or update automation incident
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          title="Shadowrocket automation failure"
          body="The scheduled deterministic pipeline failed.\n\nRun: $RUN_URL\nCommit: $COMMIT_SHA\n\nPlease inspect the failed job and logs. This issue is maintained automatically."
          existing="$(gh issue list --repo "$REPO" --state open --search "$title in:title" --json number --jq '.[0].number')"
          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "$title" --body "$body"
          fi
