# Request observations enter only as unclassified candidates; trusted source evidence controls policy.
name: Shadowrocket Deterministic Domain Audit (User Config Baseline)

on:
  schedule:
    - cron: "0 20 * * 0"
    # Beijing time: every Monday at 04:00.
  workflow_dispatch:
    inputs:
      restore_ids:
        description: 'Comma-separated lifecycle deletion IDs to restore (optional)'
        required: false
        type: string
      restore_conflict_ids:
        description: 'Comma-separated config-conflict archive IDs to restore after rechecking ss.conf (optional)'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - "sources/policy.json"
      - "shadowrocket/ss.conf"
      - "sources/domain_sources.json"
      - "sources/protected_domains.json"
      - "sources/request_domain_observations.json"
      - "sources/reject_manual_approvals.json"
      - "scripts/**"
      - "!scripts/refresh_ruleset_manifest.py"
      - "tests/**"
      - "!tests/test_refresh_ruleset_manifest.py"

permissions:
  contents: read

concurrency:
  group: shadowrocket-main-writer
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Stop stale audit before discovery and source downloads
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/$REPO/commits/main" --jq .sha)"
          if [ "$current_main" != "$RUN_SHA" ]; then
            echo "Audit commit $RUN_SHA is stale; current main is $current_main. Stopping before source discovery." >&2
            exit 1
          fi

      - name: Compile and run deterministic review tests
        run: |
          python3 -m py_compile scripts/restore_automation_state.py scripts/register_config_baseline.py scripts/sync_ruleset_config_conflicts.py scripts/collect_domains.py scripts/deterministic_review.py scripts/domain_rule_engine.py scripts/source_registry.py scripts/build_rulesets.py scripts/validate_config.py scripts/verify_baseline.py scripts/audit_source_lineage.py scripts/discover_sources.py scripts/assess_sources.py scripts/build_source_candidates.py scripts/audit_policy_source_overlap.py scripts/audit_external_domains.py scripts/audit_config_drift.py scripts/audit_ruleset_references.py scripts/audit_ruleset_config_overlap.py scripts/import_request_observations.py scripts/lifecycle_gate.py scripts/lifecycle_audit.py scripts/auto_activate_sources.py scripts/build_project_status.py scripts/build_rule_provenance.py scripts/refresh_ruleset_manifest.py scripts/diagnose_workflow_failure.py scripts/append_step_summary.py scripts/apply_safe_repair.py scripts/review_cursor.py scripts/verify_published_rulesets.py
          python3 -m unittest discover -s tests -v

      - name: Discover candidate source repositories (non-activating)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/discover_sources.py

      - name: Assess discovered rule-list syntax and policy claims
        run: |
          python3 scripts/assess_sources.py
          python3 scripts/append_step_summary.py --input reports/source-assessment.md

      - name: Preserve complete source assessment report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-assessment-report
          path: |
            reports/source-assessment.md
            sources/source_assessments.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Register repository-owner-approved ss.conf changes (never edit the config)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
        run: python3 scripts/register_config_baseline.py
      - name: Verify registered user config baseline
        run: python3 scripts/verify_baseline.py --baseline-only
      - name: Restore prior high-volume automation state
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/prior-audit-state
          pointer="reports/automation/state_store.json"
          if [ -s "$pointer" ]; then
            run_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("last_state_run_id", ""))' "$pointer")"
            if [ -z "$run_id" ]; then
              echo "State pointer exists but has no run ID; refusing to reset automation state."
              exit 1
            fi
            run_ids="$run_id"
          else
            run_ids="$(gh api "repos/$REPO/actions/runs?per_page=100" --jq '.workflow_runs[] | select(.path == ".github/workflows/auto_sync.yml" and .head_branch == "main") | .id')"
          fi
          restored=0
          for run_id in $run_ids; do
            [ "$run_id" = "$CURRENT_RUN_ID" ] && continue
            artifact_id="$(gh api "repos/$REPO/actions/runs/$run_id/artifacts" --jq '[.artifacts[] | select(.name == "deterministic-audit-output" and .expired == false)] | first | .id // empty' 2>/dev/null || true)"
            if [ -z "$artifact_id" ]; then
              if [ -s "$pointer" ]; then
                echo "The state artifact for recorded run $run_id is missing or expired; refusing destructive reinitialization."
                exit 1
              fi
              continue
            fi
            gh run download "$run_id" --name deterministic-audit-output --dir /tmp/prior-audit-state
            archive="/tmp/prior-audit-state/audit-output.tar.gz"
            test -s "$archive"
            python3 scripts/restore_automation_state.py --archive "$archive" --root .
            echo "Restored high-volume state from audit run $run_id (artifact $artifact_id)."
            restored=1
            break
          done
          if [ "$restored" -eq 0 ]; then
            if [ -s "$pointer" ]; then
              echo "Recorded automation state could not be restored; refusing to continue."
              exit 1
            fi
            echo "No prior state artifact found; using repository bootstrap state."
          fi

      - name: Remove published and queued rules that conflict with ss.conf
        env:
          RULESET_CONFIG_RESTORE_IDS: ${{ github.event.inputs.restore_conflict_ids || '' }}
          RULESET_CONFIG_REPORT_AGGREGATION: "1"
        run: |
          python3 scripts/sync_ruleset_config_conflicts.py
          python3 scripts/append_step_summary.py --input reports/ruleset-config-conflict-sync.md

      - name: Import observed request hostnames as unclassified candidates
        run: python3 scripts/import_request_observations.py

      - name: Audit public source lineage and shared upstreams
        run: python3 scripts/audit_source_lineage.py

      - name: Audit domain-level policy-source overlap and contradictions
        run: |
          python3 scripts/audit_policy_source_overlap.py
          python3 scripts/append_step_summary.py --input reports/policy-source-overlap.md

      - name: Build automated source candidate and lineage matrix
        run: |
          python3 scripts/build_source_candidates.py
          python3 scripts/append_step_summary.py --input reports/source-candidate-matrix.md

      - name: Admit stable policy-evidenced sources without AI review
        run: |
          python3 scripts/auto_activate_sources.py
          python3 scripts/append_step_summary.py --input reports/source-activation.md

      - name: Collect and cross-check all enabled domain sources
        run: python3 scripts/collect_domains.py

      - name: Stop stale audit before expensive deterministic review
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/$REPO/commits/main" --jq .sha)"
          if [ "$current_main" != "$GITHUB_SHA" ]; then
            echo "Audit commit $GITHUB_SHA is stale; current main is $current_main. Refusing to spend resources on stale review inputs." >&2
            exit 1
          fi
      - name: "Audit each domain: deduplicate, resolve conflicts, grade evidence and protect critical services"
        run: python3 scripts/deterministic_review.py

      - name: Preserve resumable review cursor checkpoint
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: review-cursor-checkpoint
          path: sources/review_cursor.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Build standalone DIRECT, PROXY and REJECT rule sets
        run: python3 scripts/build_rulesets.py

      - name: Evaluate lifecycle milestones and monthly capacity review
        run: python3 scripts/lifecycle_gate.py

      - name: Run conservative lifecycle audit and selectable restoration
        env:
          LIFECYCLE_RESTORE_IDS: ${{ github.event.inputs.restore_ids || '' }}
        run: |
          python3 scripts/lifecycle_audit.py
          if [ -f reports/lifecycle/latest.md ]; then python3 scripts/append_step_summary.py --input reports/lifecycle/latest.md; fi

      - name: Enforce final ss.conf precedence after all rule mutations
        env:
          RULESET_CONFIG_REPORT_AGGREGATION: "1"
        run: |
          python3 scripts/sync_ruleset_config_conflicts.py
          python3 scripts/append_step_summary.py --input reports/ruleset-config-conflict-sync.md
      - name: Reconcile final RULE-SET manifest counts
        run: python3 scripts/refresh_ruleset_manifest.py

      - name: Build append-only rule-level provenance ledger
        run: python3 scripts/build_rule_provenance.py

      - name: Validate Shadowrocket config structure
        run: python3 scripts/validate_config.py

      - name: Audit RULE-SET references against generated outputs (read-only)
        run: |
          python3 scripts/audit_ruleset_references.py
          python3 scripts/append_step_summary.py --input reports/ruleset-reference-audit.md

      - name: Audit candidate overlap with user config precedence (read-only)
        run: |
          python3 scripts/audit_ruleset_config_overlap.py
          python3 scripts/append_step_summary.py --input reports/ruleset-config-overlap-audit.md

      - name: Audit managed config drift (read-only)
        run: |
          python3 scripts/audit_config_drift.py
          python3 scripts/append_step_summary.py --input reports/config-drift-audit.md

      - name: Run read-only full-source regression audit
        run: |
          python3 scripts/audit_external_domains.py
          python3 scripts/append_step_summary.py --input reports/external-domain-audit.md

      - name: Build consolidated project status
        run: |
          python3 scripts/build_project_status.py
          python3 scripts/append_step_summary.py --input reports/project-status.md

      - name: Write successful audit heartbeat
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          mkdir -p reports/automation
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          record = {
              "schema_version": 1,
              "status": "audit_passed",
              "workflow": "Shadowrocket Deterministic Domain Audit (User Config Baseline)",
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "event": os.environ["GITHUB_EVENT_NAME"],
              "source_commit": os.environ["GITHUB_SHA"],
              "recorded_at_utc": datetime.now(timezone.utc).isoformat(),
              "checks": {
                  "deterministic_tests": "passed",
                  "user_config_baseline": "passed",
                  "config_conflict_sync": "passed",
                  "lifecycle_audit": "passed",
                  "three_policy_rule_sets": "passed",
                  "config_validation": "passed",
                  "source_and_rule_audits": "passed"
              },
              "protected_config": {
                  "path": "shadowrocket/ss.conf",
                  "modified_by_automation": False
              }
          }
          with open("reports/automation/heartbeat.json", "w", encoding="utf-8") as stream:
              json.dump(record, stream, ensure_ascii=False, indent=2)
              stream.write("\n")
          PY

      - name: Record durable automation state pointer
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          mkdir -p reports/automation
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          record = {
              "schema_version": 1,
              "last_state_run_id": os.environ["GITHUB_RUN_ID"],
              "source_commit": os.environ["GITHUB_SHA"],
              "recorded_at_utc": datetime.now(timezone.utc).isoformat(),
              "artifact_name": "deterministic-audit-output",
              "artifact_retention_days": 90,
              "storage_mode": "github_actions_artifact",
              "missing_artifact_policy": "fail_closed"
          }
          with open("reports/automation/state_store.json", "w", encoding="utf-8") as stream:
              json.dump(record, stream, ensure_ascii=False, indent=2)
              stream.write("\n")
          PY

      - name: Package allowlisted audit outputs
        run: |
          tar -czf audit-output.tar.gz \
            sources/domain_reviews.json \
            sources/review_cursor.json \
            sources/rule_provenance.json \
            sources/domain_sources.json \
            sources/source_activation_log.json \
            reports/lifecycle \
            reports/project-status.md \
            reports/project-status.json \
            reports/automation/heartbeat.json \
            reports/automation/state_store.json \
            reports/external-domain-audit.md \
            reports/config-drift-audit.md \
            reports/config-drift-audit.json \
            reports/ruleset-reference-audit.md \
            reports/ruleset-reference-audit.json \
            reports/ruleset-config-conflict-sync.md \
            reports/ruleset-config-conflict-sync.json \
            sources/policy.json \
            reports/ruleset-config-overlap-audit.md \
            reports/ruleset-config-overlap-audit.json \
            reports/ruleset-config-conflict-sync.md \
            reports/ruleset-config-conflict-sync.json \
            reports/source-lineage-audit.json \
            reports/source-discovery.md \
            reports/source-assessment.md \
            reports/source-candidate-matrix.md \
            reports/source-activation.md \
            reports/policy-source-overlap.md \
            sources/policy_source_overlap.json \
            sources/discovered_sources.json \
            sources/source_assessments.json \
            sources/source_candidates.json \
            data/domain_candidates.json \
            data/candidates.json \
            data/source_pending.json \
            data/primary_snapshot.txt \
            data/secondary_snapshot.txt \
            data/source_snapshots \
            rulesets

      - name: Upload allowlisted audit outputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deterministic-audit-output
          path: audit-output.tar.gz
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout exact audited commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Download audited outputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: deterministic-audit-output
          path: audit-artifact

      - name: Verify base commit and safely publish allowlisted outputs
        run: |
          bash scripts/verify_publish_base.sh

          archive="audit-artifact/audit-output.tar.gz"
          test -s "$archive"
          if tar -tzf "$archive" | grep -E '(^/|(^|/)\.\.(/|$))'; then
            echo "Unsafe path found in audit artifact."
            exit 1
          fi
          tar -xzf "$archive" -C .

          # The user-managed config is immutable: audit artifacts may never alter it.
          git diff --quiet "$GITHUB_SHA" -- shadowrocket/ss.conf || {
            echo "Protected config shadowrocket/ss.conf changed during audit packaging; refusing to publish."
            exit 1
          }

          # Optional audit outputs are staged only when present in this run.
          # Missing optional files must not abort an otherwise valid publication.
          publish_paths=(
            sources/policy.json
            sources/domain_sources.json
            sources/source_activation_log.json
            reports/lifecycle
            reports/project-status.md
            reports/project-status.json
            reports/automation/heartbeat.json
            reports/automation/state_store.json
            reports/external-domain-audit.md
            reports/config-drift-audit.md
            reports/config-drift-audit.json
            reports/ruleset-reference-audit.md
            reports/ruleset-reference-audit.json
            reports/ruleset-config-overlap-audit.md
            reports/ruleset-config-overlap-audit.json
            reports/ruleset-config-conflict-sync.md
            reports/ruleset-config-conflict-sync.json
            reports/source-lineage-audit.json
            reports/source-discovery.md
            reports/source-assessment.md
            reports/source-candidate-matrix.md
            reports/source-activation.md
            reports/policy-source-overlap.md
            sources/policy_source_overlap.json
            sources/discovered_sources.json
            sources/source_assessments.json
            sources/source_candidates.json
            rulesets/
          )
          for path in "${publish_paths[@]}"; do
            if [[ -e "$path" ]]; then
              git add -- "$path"
            else
              echo "Optional publish path absent; skipping: $path"
            fi
          done

          # Explicitly fail if the protected config somehow entered the staged commit.
          git diff --cached --quiet "$GITHUB_SHA" -- shadowrocket/ss.conf || {
            echo "Protected config shadowrocket/ss.conf is staged; refusing to commit."
            exit 1
          }

          if git diff --cached --quiet; then
            echo "No audit output changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Run deterministic Shadowrocket domain audit"
          git push origin HEAD:main

      - name: Independently verify committed remote rulesets
        run: |
          set -euo pipefail
          git fetch origin main
          python3 scripts/verify_published_rulesets.py --ref origin/main | tee /tmp/publish-verification.json
          python3 scripts/append_step_summary.py --input /tmp/publish-verification.json

  persist-review-cursor:
    needs: audit
    if: ${{ always() && needs.audit.result == 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout latest main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Persist owner-approved config baseline even when audit fails
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
        run: python3 scripts/register_config_baseline.py
      - name: Download failed-run cursor checkpoint
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: review-cursor-checkpoint
          path: cursor-artifact
        continue-on-error: true
      - name: Validate and persist in-progress cursor only
        run: |
          set -euo pipefail
          if [ ! -s cursor-artifact/review_cursor.json ]; then echo "No cursor artifact to persist."; exit 0; fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("cursor-artifact/review_cursor.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          if d.get("schema_version") != 1:
              raise SystemExit("Unsupported review cursor schema; refusing to persist.")
          if d.get("status") != "in_progress":
              print("Cursor is not in progress; no checkpoint needs persistence.")
              raise SystemExit(0)
          digest=str(d.get("snapshot_sha256",""))
          if len(digest) != 64 or any(ch not in "0123456789abcdef" for ch in digest):
              raise SystemExit("Invalid cursor snapshot digest.")
          if not isinstance(d.get("next_index"),int):
              raise SystemExit("Invalid cursor checkpoint index.")
          if d["next_index"] < 1:
              print("Cursor has no completed checkpoint; nothing to persist.")
              raise SystemExit(0)
          Path("sources").mkdir(exist_ok=True)
          Path("sources/review_cursor.json").write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
          git add -- sources/policy.json sources/review_cursor.json
          if git diff --cached --quiet; then
            echo "No new review cursor checkpoint to persist."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Persist interrupted deterministic review cursor"
          git push origin HEAD:main

  notify-failure:
    if: ${{ always() && (needs.audit.result == 'failure' || needs.publish.result == 'failure') }}
    needs: [audit, publish]
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Open or update automation incident
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          title="Shadowrocket automation failure"
          body="The scheduled deterministic pipeline failed.\n\nRun: $RUN_URL\nCommit: $COMMIT_SHA\n\nPlease inspect the failed job and logs. This issue is maintained automatically."
          existing="$(gh issue list --repo "$REPO" --state open --search "$title in:title" --json number --jq '.[0].number')"
          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "$title" --body "$body"
          fi

  resolve-failure:
    needs: [audit, publish]
    if: ${{ needs.audit.result == 'success' && needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      issues: write
    steps:
      - name: Close recovered automation incidents
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          issues="$(gh issue list --repo "$REPO" --state open --search '"Shadowrocket automation failure" in:title' --json number --jq '.[].number')"
          if [ -z "$issues" ]; then
            echo "No open automation incident to resolve."
            exit 0
          fi
          while IFS= read -r issue; do
            [ -n "$issue" ] || continue
            gh issue comment "$issue" --repo "$REPO" --body "A subsequent deterministic audit and publish succeeded. Recovery run: $RUN_URL"
            gh issue close "$issue" --repo "$REPO"
          done <<< "$issues"
