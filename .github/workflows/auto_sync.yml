name: Shadowrocket Deterministic Domain Audit and Publish

on:
  schedule:
    # Six-hourly monitoring; GitHub scheduling may be delayed by platform load.
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/domain_candidates.json"
      - "sources/domain_sources.json"
      - "sources/protected_domains.json"
      - "sources/policy.json"
      - "sources/legacy_managed_rules.json"
      - "scripts/**"

permissions:
  contents: write

concurrency:
  group: shadowrocket-deterministic-audit
  cancel-in-progress: false

jobs:
  audit-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Collect and cross-check domain-only sources
        run: python3 scripts/collect_domains.py

      - name: Run deterministic duplicate, conflict, confidence and risk review
        run: python3 scripts/deterministic_review.py

      - name: Import only approved exact-domain rules
        run: python3 scripts/import_approved_domains.py

      - name: Audit canonical config, original-rule protection and DNS invariants
        run: python3 scripts/audit_pipeline.py

      - name: Validate Shadowrocket config structure
        run: python3 scripts/validate_config.py

      - name: Run read-only full-source regression audit
        run: |
          python3 scripts/audit_external_domains.py
          cat reports/external-domain-audit.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit validated ledger, reports and config
        run: |
          if ! git diff --quiet -- shadowrocket/ss.conf sources/domain_reviews.json reports/domain-publication.md reports/external-domain-audit.md sources/published_domains.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add shadowrocket/ss.conf sources/domain_reviews.json reports/domain-publication.md reports/external-domain-audit.md sources/published_domains.json
            git commit -m "Run deterministic Shadowrocket domain audit and safe publish"
            git push
          else
            echo "No ledger, report or config changes."
          fi
