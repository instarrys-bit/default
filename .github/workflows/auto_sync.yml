# Request observations enter only as unclassified candidates; trusted source evidence controls policy.
name: Shadowrocket Deterministic Domain Audit (User Config Baseline)
run-name: Automation task ${{ inputs.automation_task_id || 'manual' }}

on:
  workflow_dispatch:
    inputs:
      restore_ids:
        description: 'Comma-separated lifecycle deletion IDs to restore (optional)'
        required: false
        type: string
      restore_conflict_ids:
        description: 'Comma-separated config-conflict archive IDs to restore after rechecking ss.conf (optional)'
        required: false
        type: string
      automation_task_id:
        description: 'Required Watchdog-owned durable task correlation ID'
        required: true
        type: string
      baseline_source_event:
        description: 'Original event type preserved by the Watchdog queue'
        required: false
        type: string
      baseline_source_actor:
        description: 'Original actor preserved by the Watchdog queue'
        required: false
        type: string
      baseline_source_before:
        description: 'Original push before SHA for config baseline registration'
        required: false
        type: string
      baseline_source_sha:
        description: 'Original push SHA for config baseline registration'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: shadowrocket-main-writer
  # Keep the active audit; stale-commit guards stop obsolete runs safely.
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Verify Watchdog-owned durable task dispatch
        env:
          AUTOMATION_TASK_ID: ${{ inputs.automation_task_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          correlation = os.environ.get("AUTOMATION_TASK_ID", "")
          match = re.fullmatch(r"(task_[0-9a-f]{24})-a([1-9][0-9]*)", correlation)
          if not match:
              raise SystemExit("A valid Watchdog task correlation is required; direct/manual audit dispatch is not authorized.")

          task_id, attempt_text = match.groups()
          attempt = int(attempt_text)
          queue = json.loads(Path("automation/task_queue.json").read_text(encoding="utf-8"))
          task = next((item for item in queue.get("tasks", []) if item.get("task_id") == task_id), None)
          if task is None:
              raise SystemExit("The correlated durable task does not exist in the checked-out queue snapshot.")

          intent = task.get("dispatch_intent")
          if (
              task.get("target_program_id") != "workflow_auto_sync"
              or task.get("requester_program_id") != "workflow_automation_watchdog"
              or task.get("status") not in {"CLAIMED", "VERIFYING"}
              or task.get("attempts") != attempt
              or not isinstance(intent, dict)
              or intent.get("task_id") != task_id
              or intent.get("correlation_id") != correlation
              or intent.get("dispatch_attempt") != attempt
              or intent.get("workflow_path") != ".github/workflows/auto_sync.yml"
              or intent.get("ref") != "main"
          ):
              raise SystemExit("The queue record does not authorize this exact Watchdog production audit dispatch.")

          if task.get("status") == "VERIFYING":
              result = task.get("result")
              if (
                  not isinstance(result, dict)
                  or result.get("correlation_id") != correlation
                  or result.get("dispatch_state") != "submitted"
              ):
                  raise SystemExit("The VERIFYING task has no matching persisted dispatch submission.")

          print(f"Authorized Watchdog production audit task {task_id}, attempt {attempt}.")
          PY

      - name: Stop stale audit before discovery and source downloads
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          bash scripts/verify_publish_base.sh --check-only

      - name: Compile and run deterministic review tests
        run: |
          python3 -m py_compile scripts/restore_automation_state.py scripts/register_config_baseline.py scripts/sync_ruleset_config_conflicts.py scripts/collect_domains.py scripts/deterministic_review.py scripts/domain_rule_engine.py scripts/source_registry.py scripts/build_rulesets.py scripts/validate_config.py scripts/verify_baseline.py scripts/audit_source_lineage.py scripts/discover_sources.py scripts/assess_sources.py scripts/build_source_candidates.py scripts/audit_policy_source_overlap.py scripts/audit_external_domains.py scripts/audit_config_drift.py scripts/audit_ruleset_references.py scripts/audit_ruleset_config_overlap.py scripts/import_request_observations.py scripts/lifecycle_gate.py scripts/lifecycle_audit.py scripts/auto_activate_sources.py scripts/build_project_status.py scripts/build_rule_provenance.py scripts/refresh_ruleset_manifest.py scripts/diagnose_workflow_failure.py scripts/append_step_summary.py scripts/apply_safe_repair.py scripts/review_cursor.py scripts/persist_review_cursor.py scripts/json_document_store.py scripts/verify_published_rulesets.py
          python3 -m unittest discover -s tests -v

      - name: Discover candidate source repositories (non-activating)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/discover_sources.py

      - name: Assess discovered rule-list syntax and policy claims
        run: |
          python3 scripts/assess_sources.py
          python3 scripts/append_step_summary.py --input reports/source-assessment.md

      - name: Preserve complete source assessment report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-assessment-report
          path: |
            reports/source-assessment.md
            sources/source_assessments.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Register repository-owner-approved ss.conf changes (never edit the config)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_NAME: ${{ inputs.baseline_source_event || github.event_name }}
          GITHUB_ACTOR: ${{ inputs.baseline_source_actor || github.actor }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_BEFORE: ${{ inputs.baseline_source_before || github.event.before }}
          GITHUB_SHA: ${{ inputs.baseline_source_sha || github.sha }}
        run: python3 scripts/register_config_baseline.py
      - name: Verify registered user config baseline
        run: python3 scripts/verify_baseline.py --baseline-only
      - name: Restore prior high-volume automation state
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/prior-audit-state
          pointer="reports/automation/state_store.json"
          if [ -s "$pointer" ]; then
            run_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("last_state_run_id", ""))' "$pointer")"
            if [ -z "$run_id" ]; then
              echo "State pointer exists but has no run ID; refusing to reset automation state."
              exit 1
            fi
            run_ids="$run_id"
          else
            run_ids="$(gh api "repos/$REPO/actions/runs?per_page=100" --jq '.workflow_runs[] | select(.path == ".github/workflows/auto_sync.yml" and .head_branch == "main") | .id')"
          fi
          restored=0
          for run_id in $run_ids; do
            [ "$run_id" = "$CURRENT_RUN_ID" ] && continue
            artifact_id="$(gh api "repos/$REPO/actions/runs/$run_id/artifacts" --jq '[.artifacts[] | select(.name == "deterministic-audit-output" and .expired == false)] | first | .id // empty' 2>/dev/null || true)"
            if [ -z "$artifact_id" ]; then
              if [ -s "$pointer" ]; then
                echo "The state artifact for recorded run $run_id is missing or expired; refusing destructive reinitialization."
                exit 1
              fi
              continue
            fi
            gh run download "$run_id" --name deterministic-audit-output --dir /tmp/prior-audit-state
            archive="/tmp/prior-audit-state/audit-output.tar.gz"
            test -s "$archive"
            python3 scripts/restore_automation_state.py --archive "$archive" --root .
            echo "Restored high-volume state from audit run $run_id (artifact $artifact_id)."
            restored=1
            break
          done
          if [ "$restored" -eq 0 ]; then
            if [ -s "$pointer" ]; then
              echo "Recorded automation state could not be restored; refusing to continue."
              exit 1
            fi
            echo "No prior state artifact found; using repository bootstrap state."
          fi

      - name: Remove published and queued rules that conflict with ss.conf
        env:
          RULESET_CONFIG_RESTORE_IDS: ${{ github.event.inputs.restore_conflict_ids || '' }}
          RULESET_CONFIG_REPORT_AGGREGATION: "1"
        run: |
          python3 scripts/sync_ruleset_config_conflicts.py
          python3 scripts/append_step_summary.py --input reports/ruleset-config-conflict-sync.md

      - name: Import observed request hostnames as unclassified candidates
        run: python3 scripts/import_request_observations.py

      - name: Audit public source lineage and shared upstreams
        run: python3 scripts/audit_source_lineage.py

      - name: Audit domain-level policy-source overlap and contradictions
        run: |
          python3 scripts/audit_policy_source_overlap.py
          python3 scripts/append_step_summary.py --input reports/policy-source-overlap.md

      - name: Build automated source candidate and lineage matrix
        run: |
          python3 scripts/build_source_candidates.py
          python3 scripts/append_step_summary.py --input reports/source-candidate-matrix.md

      - name: Admit stable policy-evidenced sources without AI review
        run: |
          python3 scripts/auto_activate_sources.py
          python3 scripts/append_step_summary.py --input reports/source-activation.md

      - name: Collect and cross-check all enabled domain sources
        run: python3 scripts/collect_domains.py

      - name: Stop stale audit before expensive deterministic review
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          bash scripts/verify_publish_base.sh --check-only
      - name: "Audit each domain: deduplicate, resolve conflicts, grade evidence and protect critical services"
        run: python3 scripts/deterministic_review.py

      - name: Preserve resumable review cursor checkpoint
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: review-cursor-checkpoint
          path: sources/review_cursor.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Build standalone DIRECT, PROXY and REJECT rule sets
        run: python3 scripts/build_rulesets.py

      - name: Evaluate lifecycle milestones and monthly capacity review
        run: python3 scripts/lifecycle_gate.py

      - name: Run conservative lifecycle audit and selectable restoration
        env:
          LIFECYCLE_RESTORE_IDS: ${{ github.event.inputs.restore_ids || '' }}
        run: |
          python3 scripts/lifecycle_audit.py
          if [ -f reports/lifecycle/latest.md ]; then python3 scripts/append_step_summary.py --input reports/lifecycle/latest.md; fi

      - name: Reconcile final ss.conf scope coverage after all rule mutations
        env:
          RULESET_CONFIG_REPORT_AGGREGATION: "1"
        run: |
          python3 scripts/sync_ruleset_config_conflicts.py
          python3 scripts/append_step_summary.py --input reports/ruleset-config-conflict-sync.md
      - name: Reconcile final RULE-SET manifest counts
        run: python3 scripts/refresh_ruleset_manifest.py

      - name: Build append-only rule-level provenance ledger
        run: python3 scripts/build_rule_provenance.py

      - name: Validate Shadowrocket config structure
        run: python3 scripts/validate_config.py

      - name: Audit RULE-SET references against generated outputs (read-only)
        run: |
          python3 scripts/audit_ruleset_references.py
          python3 scripts/append_step_summary.py --input reports/ruleset-reference-audit.md

      - name: Audit candidate scope coverage against user config (read-only)
        run: |
          python3 scripts/audit_ruleset_config_overlap.py
          python3 scripts/append_step_summary.py --input reports/ruleset-config-overlap-audit.md

      - name: Audit managed config drift (read-only)
        run: |
          python3 scripts/audit_config_drift.py
          python3 scripts/append_step_summary.py --input reports/config-drift-audit.md

      - name: Run read-only full-source regression audit
        run: |
          python3 scripts/audit_external_domains.py
          python3 scripts/append_step_summary.py --input reports/external-domain-audit.md

      - name: Build consolidated project status
        run: |
          python3 scripts/build_project_status.py
          python3 scripts/append_step_summary.py --input reports/project-status.md

      - name: Write successful audit heartbeat
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          mkdir -p reports/automation
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          record = {
              "schema_version": 1,
              "status": "audit_passed",
              "workflow": "Shadowrocket Deterministic Domain Audit (User Config Baseline)",
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "event": os.environ["GITHUB_EVENT_NAME"],
              "source_commit": os.environ["GITHUB_SHA"],
              "recorded_at_utc": datetime.now(timezone.utc).isoformat(),
              "checks": {
                  "deterministic_tests": "passed",
                  "user_config_baseline": "passed",
                  "config_conflict_sync": "passed",
                  "lifecycle_audit": "passed",
                  "three_policy_rule_sets": "passed",
                  "config_validation": "passed",
                  "source_and_rule_audits": "passed"
              },
              "protected_config": {
                  "path": "shadowrocket/ss.conf",
                  "modified_by_automation": False
              }
          }
          with open("reports/automation/heartbeat.json", "w", encoding="utf-8") as stream:
              json.dump(record, stream, ensure_ascii=False, indent=2)
              stream.write("\n")
          PY

      - name: Record durable automation state pointer
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          mkdir -p reports/automation
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          record = {
              "schema_version": 1,
              "last_state_run_id": os.environ["GITHUB_RUN_ID"],
              "source_commit": os.environ["GITHUB_SHA"],
              "recorded_at_utc": datetime.now(timezone.utc).isoformat(),
              "artifact_name": "deterministic-audit-output",
              "artifact_retention_days": 90,
              "storage_mode": "github_actions_artifact",
              "missing_artifact_policy": "fail_closed"
          }
          with open("reports/automation/state_store.json", "w", encoding="utf-8") as stream:
              json.dump(record, stream, ensure_ascii=False, indent=2)
              stream.write("\n")
          PY

      - name: Package allowlisted audit outputs
        run: |
          set -euo pipefail
          shopt -s nullglob
          state_files=(
            sources/domain_reviews.json*
            sources/rule_provenance.json*
            sources/discovered_sources.json*
            sources/source_assessments.json*
            sources/source_candidates.json*
            data/domain_candidates.json*
            data/candidates.json*
          )
          base_files=(
            sources/review_cursor.json
            sources/domain_sources.json
            sources/source_activation_log.json
            reports/lifecycle
            reports/project-status.md
            reports/project-status.json
            reports/automation/heartbeat.json
            reports/automation/state_store.json
            reports/external-domain-audit.md
            reports/config-drift-audit.md
            reports/config-drift-audit.json
            reports/ruleset-reference-audit.md
            reports/ruleset-reference-audit.json
            reports/ruleset-config-conflict-sync.md
            reports/ruleset-config-conflict-sync.json
            sources/policy.json
            reports/ruleset-config-overlap-audit.md
            reports/ruleset-config-overlap-audit.json
            reports/source-lineage-audit.json
            reports/source-discovery.md
            reports/source-assessment.md
            reports/source-candidate-matrix.md
            reports/source-activation.md
            reports/policy-source-overlap.md
            sources/policy_source_overlap.json
            data/domain_candidates.json
            data/source_pending.json
            data/primary_snapshot.txt
            data/secondary_snapshot.txt
            data/source_snapshots
            rulesets
          )
          declare -A archive_seen=()
          archive_inputs=()
          for path in "${base_files[@]}" "${state_files[@]}"; do
            [[ -e "$path" ]] || continue
            if [[ -L "$path" ]]; then
              echo "Refusing symlink in automation state: $path" >&2
              exit 1
            fi
            if [[ -z "${archive_seen[$path]+present}" ]]; then
              archive_seen["$path"]=1
              archive_inputs+=("$path")
            fi
          done
          test "${#archive_inputs[@]}" -gt 0
          tar -czf audit-output.tar.gz -- "${archive_inputs[@]}"

      - name: Upload allowlisted audit outputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deterministic-audit-output
          path: audit-output.tar.gz
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout exact audited commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Download audited outputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: deterministic-audit-output
          path: audit-artifact

      - name: Verify base commit and safely publish allowlisted outputs
        run: |
          bash scripts/verify_publish_base.sh

          archive="audit-artifact/audit-output.tar.gz"
          test -s "$archive"
          if tar -tzf "$archive" | grep -E '(^/|(^|/)\.\.(/|$))'; then
            echo "Unsafe path found in audit artifact."
            exit 1
          fi
          tar -xzf "$archive" -C .

          # The user-managed config is immutable: audit artifacts may never alter it.
          git diff --quiet "$GITHUB_SHA" -- shadowrocket/ss.conf || {
            echo "Protected config shadowrocket/ss.conf changed during audit packaging; refusing to publish."
            exit 1
          }

          # Optional audit outputs are staged only when present in this run.
          # Missing optional files must not abort an otherwise valid publication.
          publish_paths=(
            sources/policy.json
            sources/domain_sources.json
            sources/source_activation_log.json
            reports/lifecycle
            reports/project-status.md
            reports/project-status.json
            reports/automation/heartbeat.json
            reports/automation/state_store.json
            reports/external-domain-audit.md
            reports/config-drift-audit.md
            reports/config-drift-audit.json
            reports/ruleset-reference-audit.md
            reports/ruleset-reference-audit.json
            reports/ruleset-config-overlap-audit.md
            reports/ruleset-config-overlap-audit.json
            reports/ruleset-config-conflict-sync.md
            reports/ruleset-config-conflict-sync.json
            reports/source-lineage-audit.json
            reports/source-discovery.md
            reports/source-assessment.md
            reports/source-candidate-matrix.md
            reports/source-activation.md
            reports/policy-source-overlap.md
            sources/policy_source_overlap.json
            sources/discovered_sources.json
            sources/source_assessments.json
            sources/source_candidates.json
            rulesets/
          )
          for path in "${publish_paths[@]}"; do
            if [[ -e "$path" ]]; then
              git add -- "$path"
            else
              echo "Optional publish path absent; skipping: $path"
            fi
          done

          # Sharded persistent source indexes are staged as complete manifest+parts sets.
          shopt -s nullglob
          for pattern in \
            "sources/discovered_sources.json.manifest.json" "sources/discovered_sources.json.parts-"* \
            "sources/source_assessments.json.manifest.json" "sources/source_assessments.json.parts-"* \
            "sources/source_candidates.json.manifest.json" "sources/source_candidates.json.parts-"*; do
            if [[ -e "$pattern" ]]; then git add -- "$pattern"; fi
          done

          # When a legacy monolith has been replaced by a manifest, stage its deletion.
          for base in sources/discovered_sources.json sources/source_assessments.json sources/source_candidates.json; do
            if [[ ! -e "$base" ]] && git ls-files --error-unmatch "$base" >/dev/null 2>&1; then
              git add -u -- "$base"
            fi
          done

          # Explicitly fail if the protected config somehow entered the staged commit.
          git diff --cached --quiet "$GITHUB_SHA" -- shadowrocket/ss.conf || {
            echo "Protected config shadowrocket/ss.conf is staged; refusing to commit."
            exit 1
          }

          if git diff --cached --quiet; then
            echo "No audit output changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Run deterministic Shadowrocket domain audit"
          git push origin HEAD:main

      - name: Independently verify committed remote rulesets
        run: |
          set -euo pipefail
          git fetch origin main
          python3 scripts/verify_published_rulesets.py --ref origin/main | tee /tmp/publish-verification.json
          python3 scripts/append_step_summary.py --input /tmp/publish-verification.json

  persist-review-cursor:
    needs: audit
    if: ${{ always() && needs.audit.result == 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout latest main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Persist owner-approved config baseline even when audit fails
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
        run: python3 scripts/register_config_baseline.py
      - name: Download failed-run cursor checkpoint
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: review-cursor-checkpoint
          path: cursor-artifact
        continue-on-error: true
      - name: Validate and persist in-progress cursor only
        run: |
          set -euo pipefail
          python3 scripts/persist_review_cursor.py \
            --cursor-artifact cursor-artifact/review_cursor.json \
            --destination sources/review_cursor.json
          # Stage the owner-approved baseline and resumable cursor independently.
          # A missing optional cursor must never prevent policy.json from being saved.
          for path in sources/policy.json sources/review_cursor.json; do
            if [[ -L "$path" ]]; then
              echo "Refusing symlink while persisting automation state: $path" >&2
              exit 1
            elif [[ -f "$path" ]]; then
              git add -- "$path"
            else
              echo "Optional persistence path absent; skipping: $path"
            fi
          done
          if git diff --cached --quiet; then
            echo "No new review cursor checkpoint to persist."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Persist interrupted deterministic review cursor"
          git push origin HEAD:main

  notify-failure:
    if: ${{ always() && (needs.audit.result == 'failure' || needs.publish.result == 'failure') }}
    needs: [audit, publish]
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Open or update automation incident
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          title="Shadowrocket automation failure (run $RUN_ID)"
          body="The deterministic pipeline failed.\n\nRun: $RUN_URL\nCommit: $COMMIT_SHA\n\n<!-- shadowrocket-automation:workflow=auto_sync;run_id=$RUN_ID -->\n\nPlease inspect the failed job and logs. This issue is maintained automatically."
          existing="$(gh issue list --repo "$REPO" --state open --limit 100 --json number,title | jq --arg title "$title" -r '.[] | select(.title == $title) | .number' | head -n 1)"
          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "$title" --body "$body"
          fi

  resolve-failure:
    needs: [audit, publish]
    if: ${{ needs.audit.result == 'success' && needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      issues: write
    steps:
      - name: Close recovered automation incidents
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          issues="$(gh issue list --repo "$REPO" --state open --search '"Shadowrocket automation failure" in:title' --json number,title,body | jq --argjson run_id "$RUN_ID" '.[] | select(.title | startswith("Shadowrocket automation failure (run ")) | select(.body | contains("shadowrocket-automation:workflow=auto_sync;run_id=")) | select(((.body | capture("shadowrocket-automation:workflow=auto_sync;run_id=(?<id>[0-9]+)") | .id | tonumber) < $run_id)) | .number')"
          if [ -z "$issues" ]; then
            echo "No earlier, explicitly linked auto_sync incident to resolve."
            exit 0
          fi
          while IFS= read -r issue; do
            [ -n "$issue" ] || continue
            gh issue comment "$issue" --repo "$REPO" --body "A later full deterministic audit and publish succeeded. Recovery run: $RUN_URL"
            gh issue close "$issue" --repo "$REPO"
          done <<< "$issues"
