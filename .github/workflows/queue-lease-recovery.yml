name: Durable queue lease recovery
# Closed-loop maintenance: expire stuck CLAIMED leases and surface queue health.
# Submit/dispatch success is not closed-loop completion; this job only recovers
# leases and verifies post-recover invariants. Publish verification remains on
# the main Watchdog / auto_sync paths.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: shadowrocket-queue-lease-recovery-main
  cancel-in-progress: false

jobs:
  recover-expired-leases:
    if: ${{ github.ref_name == 'main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Snapshot queue before recovery
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 scripts/remote_task_queue_runtime.py --repository "$GITHUB_REPOSITORY" --branch main snapshot --output "$RUNNER_TEMP/task_queue_before.json"
          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          import os
          q = json.loads((Path(os.environ["RUNNER_TEMP"]) / "task_queue_before.json").read_text(encoding="utf-8"))
          c = Counter(t.get("status") for t in q.get("tasks", []))
          claimed = [t for t in q.get("tasks", []) if t.get("status") == "CLAIMED"]
          print(json.dumps({
              "revision": q.get("revision"),
              "status_counts": dict(c),
              "claimed": [
                  {
                      "task_id": t.get("task_id"),
                      "lease_expires_at": (t.get("lease") or {}).get("expires_at"),
                      "resource_lease_expires_at": (t.get("resource_lease") or {}).get("expires_at"),
                  }
                  for t in claimed
              ],
          }, indent=2, sort_keys=True))
          PY
      - name: Recover expired CLAIMED leases
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 scripts/remote_task_queue_runtime.py --repository "$GITHUB_REPOSITORY" --branch main recover-expired | tee "$RUNNER_TEMP/recover-expired.json"
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          printf '%s' "$GITHUB_TOKEN" | python3 scripts/task_scheduler.py --repository "$GITHUB_REPOSITORY" --branch main --token-stdin --current-main-sha "$current_main" resolve-superseded-dead-letters | tee "$RUNNER_TEMP/resolve-superseded.json" || true
      - name: Snapshot after recovery and assert no expired CLAIMED remain
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 scripts/remote_task_queue_runtime.py --repository "$GITHUB_REPOSITORY" --branch main snapshot --output "$RUNNER_TEMP/task_queue_after.json"
          python3 - <<'PY'
          import json, os, sys
          from collections import Counter
          from datetime import datetime, timezone
          from pathlib import Path
          queue = json.loads((Path(os.environ["RUNNER_TEMP"]) / "task_queue_after.json").read_text(encoding="utf-8"))
          now = datetime.now(timezone.utc)
          counts = Counter(t.get("status") for t in queue.get("tasks", []) if isinstance(t, dict))
          expired = []
          for task in queue.get("tasks", []):
              if not isinstance(task, dict) or task.get("status") != "CLAIMED":
                  continue
              exp = (task.get("lease") or {}).get("expires_at")
              if not exp or datetime.fromisoformat(str(exp).replace("Z", "+00:00")) <= now:
                  expired.append(task.get("task_id"))
          report = {
              "revision": queue.get("revision"),
              "status_counts": dict(counts),
              "expired_claimed_remaining": expired,
              "note": "Dispatch/submit success is not closed-loop completion; publish + post-publish verification remain required on the production path.",
          }
          print(json.dumps(report, ensure_ascii=False, sort_keys=True, indent=2))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("### Queue lease recovery\n\n```json\n")
              out.write(json.dumps(report, ensure_ascii=False, sort_keys=True, indent=2))
              out.write("\n```\n")
          if expired:
              raise SystemExit("CLAIMED tasks still hold expired leases after recover-expired: " + ", ".join(map(str, expired)))
          PY
